<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPath — Найди свой университет</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Подключаем дорогие шрифты: Playfair Display для заголовков и Inter для текста -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #faf6ef; /* Светло-бежевый фон */
            --text-dark: #2e231b; /* Темно-коричневый */
            --text-muted: #6a5a4e;
            --accent-brown: #7a4e2d; /* Коричневый для кнопок */
            --dark-bg: #2a211b; /* Темный фон для блоков */
            --line-color: #dcd1c4; /* Цвет линий */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            line-height: 1.15;
        }
