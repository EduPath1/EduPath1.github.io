<!DOCTYPE html>
<html lang="ru">
<head>
<script>/* Внутренние страницы только для вошедших: без входа — на лендинг */try{if(!localStorage.getItem("edupath_token")){location.replace("index.html");}}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPath — Профиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F8FC; --cream-deep:#E6EDF7; --paper:#FFFFFF;
    --espresso:#17263C; --bark:#0F2A4A; --clay:#1E4E8C;
    --caramel:#F2B233; --sand:#C9D5E6;
    --text-main:#17263C; --text-muted:#5B6B82;
    --line:rgba(23,38,60,0.14);
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Manrope', sans-serif; background:var(--cream); color:var(--text-main); line-height:1.5; min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  h1,h2,h3{ font-family:'Lora', serif; font-weight:600; letter-spacing:-0.01em; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); filter: blur(4px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
  @keyframes pulse { 0%,80%,100%{ opacity:0.3; transform:scale(0.8);} 40%{ opacity:1; transform:scale(1.1);} }

  header{ background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:100; }
  nav.wrap{ display:flex; align-items:center; justify-content:space-between; height:84px; max-width:1200px; margin:0 auto; padding:0 32px; position:relative; }
  .logo{ display:flex; align-items:center; gap:12px; font-family:'Lora', serif; font-weight:600; font-size:26px; color:var(--espresso); transition:transform .3s var(--ease); }
  .logo:hover{ transform: scale(1.02); }
  .logo svg{ width:38px; height:38px; flex-shrink:0; transition:transform .6s var(--ease); }
  .logo:hover svg{ transform: rotate(90deg); }
  .nav-links{ display:flex; align-items:center; gap:8px; }
  .nav-links a{ font-size:15px; color:var(--text-muted); padding:10px 18px; border-radius:8px; transition:background .25s var(--ease), color .25s var(--ease); }
  .nav-links a:hover{ color:var(--espresso); background:var(--cream-deep); }
  .nav-links a.active{ background:var(--espresso); color:var(--paper); }
  .nav-right{ display:flex; align-items:center; gap:14px; }
  .btn-login{ background:var(--clay); color:var(--paper); padding:10px 22px; border-radius:20px; font-size:14px; font-weight:500; transition:background .25s var(--ease), transform .25s var(--ease); }
  .btn-login:hover{ background:var(--bark); transform: translateY(-1px); }
  .icon-btn{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); border-radius:50%; transition:background .2s var(--ease), color .2s var(--ease); }
  .icon-btn:hover{ background:var(--cream-deep); color:var(--espresso); }

  .lang-dropdown{ position:relative; }
  .lang-menu{ position:absolute; top:calc(100% + 10px); right:0; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:6px; min-width:150px; box-shadow:0 16px 32px -14px rgba(23,38,60,0.3); opacity:0; visibility:hidden; transform:translateY(-6px); transition:opacity .15s, transform .15s, visibility .15s; z-index:30; }
  .lang-menu.open{ opacity:1; visibility:visible; transform:translateY(0); }
  .lang-option{ display:block; width:100%; text-align:left; background:none; padding:10px 12px; font-size:14px; color:var(--text-muted); border-radius:8px; transition:background .15s; }
  .lang-option:hover{ background:var(--cream-deep); color:var(--espresso); }
  .lang-option.active{ background:var(--cream-deep); color:var(--espresso); font-weight:600; }

  main{ max-width:1000px; margin:0 auto; padding:48px 32px 96px; }

  /* Исправленная загрузка: занимает всю доступную высоту и центрирует текст */
  .loading { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    min-height: calc(100vh - 200px); 
    color: var(--text-muted); 
    font-size: 15px; 
  }
  .loading-inner { display: flex; align-items: center; gap: 8px; }
  .loading-dots{ display:inline-flex; gap:6px; vertical-align:middle; }
  .loading-dot{ width:8px; height:8px; border-radius:50%; background:var(--clay); animation:pulse 1.4s ease-in-out infinite; }
  .loading-dot:nth-child(2){ animation-delay: 0.2s; }
  .loading-dot:nth-child(3){ animation-delay: 0.4s; }

  .auth-required{ text-align:center; padding:80px 20px; background:var(--paper); border-radius:24px; border:1px solid var(--line); animation: fadeUp .6s var(--ease) both; }
  .auth-required svg{ width:60px; height:60px; color:var(--clay); margin-bottom:20px; }
  .auth-required h2{ font-size:28px; margin-bottom:12px; }
  .auth-required p{ font-size:15px; color:var(--text-muted); margin-bottom:28px; max-width:400px; margin-left:auto; margin-right:auto; }
  .btn-primary{ display:inline-flex; align-items:center; gap:10px; background:var(--espresso); color:var(--paper); padding:15px 30px; border-radius:10px; font-size:15px; font-weight:500; transition:background .25s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease); }
  .btn-primary:hover{ background:var(--bark); transform:translateY(-3px); box-shadow: 0 8px 20px -10px rgba(23,38,60,0.4); }

  .profile-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:40px; flex-wrap:wrap; gap:20px; }
  .profile-greeting h1{ font-size:38px; color:var(--espresso); margin-bottom:6px; }
  .profile-greeting h1 em{ font-style:italic; color:var(--clay); }
  .profile-email{ font-size:14px; color:var(--text-muted); }
  .btn-logout{ display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:10px; background:var(--cream-deep); color:var(--espresso); font-size:14px; font-weight:500; transition:background .25s var(--ease), transform .25s var(--ease); }
  .btn-logout:hover{ background:var(--sand); transform: translateY(-2px); }
  .btn-logout svg{ transition: transform .2s var(--ease); }
  .btn-logout:hover svg{ transform: translateX(2px); }

  .section{ margin-bottom:48px; }
  .section-title{ font-family:'Lora', serif; font-size:24px; color:var(--espresso); margin-bottom:8px; display:flex; align-items:center; gap:12px; }
  .section-sub{ font-size:14px; color:var(--text-muted); margin-bottom:20px; }

  .empty-state{ background:var(--paper); border:1px dashed var(--line); border-radius:16px; padding:40px 24px; text-align:center; font-size:14px; color:var(--text-muted); line-height:1.6; transition: border-color .3s var(--ease); }
  .empty-state:hover{ border-color: var(--sand); }
  .empty-state a{ color:var(--clay); text-decoration:underline; font-weight:500; transition: color .2s; }
  .empty-state a:hover{ color: var(--espresso); }

  .saved-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; }
  .saved-card{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:20px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; cursor:pointer; transition:transform .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease); }
  .saved-card:hover{ transform:translateY(-3px); border-color:var(--sand); box-shadow:0 12px 24px -14px rgba(23,38,60,0.25); }
  .saved-info{ flex:1; min-width:0; }
  .saved-name{ font-weight:600; font-size:16px; color:var(--espresso); margin-bottom:4px; }
  .saved-location{ font-size:13px; color:var(--text-muted); }
  .saved-remove{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-muted); background:transparent; transition:background .2s, color .2s; flex-shrink:0; }
  .saved-remove:hover{ background:var(--cream); color:#B84A3A; transform: scale(1.1); }

  .test-block{ background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:32px; margin-bottom:16px; transition:box-shadow .3s var(--ease), border-color .3s var(--ease); }
  .test-block:hover{ border-color:var(--sand); box-shadow:0 12px 32px -18px rgba(23,38,60,0.25); }
  .test-current{ border-color:var(--caramel); border-width:1.5px; }
  .test-header{ display:flex; align-items:center; justify-content:space-between; gap:16px; cursor:pointer; user-select:none; }
  .test-header-left{ display:flex; flex-direction:column; gap:4px; }
  .test-date{ font-family:'Lora', serif; font-size:18px; color:var(--espresso); font-weight:600; }
  .test-summary-line{ font-size:13px; color:var(--text-muted); }
  .test-toggle{ font-size:20px; color:var(--text-muted); transition:transform .4s var(--ease); flex-shrink:0; }
  .test-block.open .test-toggle{ transform:rotate(180deg); }
  .test-body{ max-height:0; overflow:hidden; opacity:0; transition:max-height .6s var(--ease), opacity .4s var(--ease), padding .4s var(--ease); }
  .test-block.open .test-body{ max-height:8000px; opacity:1; padding-top:24px; }

  .category-mini{ margin-bottom:24px; }
  .category-mini:last-child{ margin-bottom:0; }
  .category-title-mini{ display:flex; align-items:center; gap:10px; font-family:'Lora', serif; font-size:18px; color:var(--espresso); margin-bottom:12px; }
  .uni-list-mini{ display:flex; flex-direction:column; gap:8px; }
  .uni-mini{ background:var(--cream); border:1px solid transparent; border-radius:10px; padding:12px 16px; cursor:pointer; transition:border-color .2s var(--ease), transform .2s var(--ease), background .2s var(--ease); }
  .uni-mini:hover{ border-color:var(--sand); transform:translateX(4px); background: var(--paper); }
  .uni-mini-name{ font-weight:600; font-size:14px; color:var(--espresso); margin-bottom:2px; }
  .uni-mini-country{ font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .uni-mini-reason{ font-size:13px; color:var(--text-main); opacity:0.85; line-height:1.55; }
  .uni-mini-arrow{ display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--clay); font-weight:600; margin-top:8px; opacity:0; transform:translateX(-4px); transition:opacity .2s var(--ease), transform .2s var(--ease); }
  .uni-mini:hover .uni-mini-arrow{ opacity:1; transform:translateX(0); }

  .empty-mini{ padding:14px; background:var(--cream); border-radius:8px; font-size:13px; color:var(--text-muted); text-align:center; font-style:italic; }

  /* Учёба по дням (страница «Фокус») */
  .study-streak{ display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--bark); background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:6px 14px; margin-bottom:16px; }
  .study-streak b{ font-family:'Lora', serif; font-size:16px; color:var(--espresso); }
  .study-days{ display:flex; flex-direction:column; gap:10px; }
  .study-day{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:16px 20px; transition:border-color .3s var(--ease); }
  .study-day:hover{ border-color:var(--sand); }
  .study-day-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:8px; }
  .study-day-date{ font-family:'Lora', serif; font-size:17px; font-weight:600; color:var(--espresso); }
  .study-day-total{ font-size:13px; color:var(--text-muted); white-space:nowrap; }
  .study-items{ display:flex; flex-direction:column; gap:4px; }
  .study-item{ display:flex; justify-content:space-between; gap:12px; font-size:14px; padding:6px 0; border-top:1px solid rgba(23,38,60,.07); }
  .study-item:first-child{ border-top:none; }
  .study-item b{ font-weight:600; color:var(--espresso); }
  .study-item span.dur{ font-family:'Lora', serif; font-weight:600; color:var(--bark); white-space:nowrap; }
  .study-more{ margin-top:12px; font-size:13px; color:var(--clay); font-weight:600; text-decoration:underline; text-underline-offset:3px; }

  /* Сохранённые цитаты */
  .quotes-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:12px; }
  .quote-mini{ position:relative; background:var(--espresso); color:var(--paper); border-radius:16px; padding:20px 56px 18px 20px; }
  .quote-mini p{ font-family:'Lora', serif; font-size:17px; line-height:1.35; }
  .quote-mini .qa{ font-size:13px; color:var(--sand); margin-top:10px; }
  .quote-mini .qa::before{ content:"— "; }
  .quote-mini .qx{ position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; color:var(--espresso); background:var(--caramel); transition:transform .2s var(--ease), opacity .2s; }
  .quote-mini .qx:hover{ transform:scale(1.08); }
  .quote-mini .qx svg{ width:17px; height:17px; }

  /* ---------- Управление данными ---------- */
  .data-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:10px; margin-bottom:16px; }
  .data-opt{ display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--paper); border:1.5px solid var(--line); border-radius:12px; cursor:pointer; transition:border-color .2s, background .2s; font-size:14px; color:var(--text-main); }
  .data-opt:hover{ border-color:var(--sand); }
  .data-opt input{ width:18px; height:18px; accent-color:var(--clay); flex-shrink:0; margin:0; }
  .data-opt:has(input:checked){ border-color:var(--clay); background:var(--cream); }
  .btn-danger-soft, .btn-danger{ display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:10px; font-weight:600; font-size:14px; border:0; cursor:pointer; font-family:inherit; transition:transform .2s var(--ease), background .2s, opacity .2s; }
  .btn-danger-soft{ background:var(--cream-deep); color:#9B2C1F; }
  .btn-danger-soft:hover{ background:#F3D9CF; transform:translateY(-2px); }
  .btn-danger{ background:#B3362A; color:#fff; }
  .btn-danger:hover{ background:#962B20; transform:translateY(-2px); }
  .btn-danger:disabled, .btn-danger-soft:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
  .danger-box{ margin-top:22px; padding:18px 20px; border:1.5px dashed rgba(179,54,42,.45); border-radius:14px; display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .danger-box h3{ margin:0 0 4px; font-size:16px; color:#9B2C1F; }
  .danger-box p{ margin:0; font-size:13px; color:var(--text-muted); max-width:520px; line-height:1.5; }
  .dm-overlay{ position:fixed; inset:0; background:rgba(23,38,60,.55); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:9990; }
  .dm-overlay[hidden]{ display:none; }
  .dm{ background:var(--paper); border-radius:16px; max-width:440px; width:100%; padding:26px 24px 22px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:92vh; overflow-y:auto; }
  .dm h3{ margin:0 0 12px; font-size:20px; }
  .dm ul{ margin:6px 0 12px; padding-left:20px; font-size:14px; line-height:1.6; }
  .dm .dm-note{ font-size:12.5px; color:var(--text-muted); margin:0 0 14px; }
  .dm label{ display:block; font-size:13px; margin-bottom:6px; color:var(--bark); }
  .dm input[type=text]{ width:100%; box-sizing:border-box; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:15px; font-family:inherit; background:#fff; letter-spacing:.04em; }
  .dm input[type=text]:focus{ outline:none; border-color:var(--clay); }
  .dm .dm-err{ color:#B3362A; font-size:13px; min-height:18px; margin:8px 0 0; }
  .dm .dm-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }

  @media (max-width: 900px){
    .nav-links{ display:none !important; }
  }
  @media (max-width: 700px){
    nav.wrap{ height:72px; padding:0 18px; }
    .logo{ font-size:21px; gap:9px; }
    .logo svg{ width:30px; height:30px; }
    main{ padding:32px 18px 64px; }
    .profile-greeting h1{ font-size:28px; }
    .saved-grid{ grid-template-columns:1fr; }
    .section-title{ font-size:20px; }
    .test-block{ padding:22px; }
  }
</style>

<body>

<header class="ep-header" id="siteHeader" data-variant="app"></header>
<script src="layout.js?v=4"></script>
<script src="edupath-d.js?v=1"></script>

<main id="mainContent">
  <div class="loading">
    <div class="loading-inner">
      <span data-i18n="profile_loading">Загрузка профиля</span>
      <span class="loading-dots">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      </span>
    </div>
  </div>
</main>

<script src="i18n.js?v=9"></script>
<script src="auth.js"></script>
<script>
// ============================================================
// ХЕЛПЕРЫ
// ============================================================

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function escapeAttr(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function formatDate(iso) {
  const d = new Date(iso);
  const months = ["января", "февраля", "марта", "апреля", "мая", "июня",
                  "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  return d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear() + ", " +
         String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function t(key, fallback){
  return (window.I18N && window.I18N.t(key)) || fallback || key;
}

// ============================================================
// РЕНДЕР
// ============================================================

function renderLoading() {
  document.getElementById("mainContent").innerHTML = `
    <div class="loading">
      <div class="loading-inner">
        <span>${t("profile_loading", "Загрузка профиля")}</span>
        <span class="loading-dots">
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
        </span>
      </div>
    </div>
  `;
}

function renderNotLoggedIn() {
  return `
    <div class="auth-required">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      <h2>${t("profile_need_login_title", "Сначала войди в аккаунт")}</h2>
      <p>${t("profile_need_login_desc", "Чтобы сохранять университеты и видеть результаты тестов — создай аккаунт или войди.")}</p>
      <button class="btn-primary" data-auth-open="register">
        <span>${t("profile_create_account", "Создать аккаунт")}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  `;
}

function renderSavedUniversities(saved) {
  if (!saved || saved.length === 0) {
    return `
      <div class="empty-state">
        ${t("profile_empty_saved", "Ты пока не сохранил ни одного университета.")}<br>
        <a href="universities.html">${t("profile_empty_saved_hint", "Зайди в каталог и нажми на звёздочку рядом с вузом.")}</a>
      </div>
    `;
  }
  return `
    <div class="saved-grid">
      ${saved.map((u, i) => `
        <div class="saved-card anim-item" style="animation-delay: ${0.05 * i}s;" data-uni-name="${escapeAttr(u.name)}" data-uni-country="${escapeAttr(u.country || "")}" data-uni-city="${escapeAttr(u.city || "")}" title="Открыть полное досье">
          <div class="saved-info">
            <div class="saved-name">${escapeHtml(u.name)}</div>
            <div class="saved-location">${escapeHtml(u.country || "")}${u.city ? " · " + escapeHtml(u.city) : ""}</div>
          </div>
          <button class="saved-remove" type="button" data-remove-saved="${escapeAttr(u.name)}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      `).join("")}
    </div>
  `;
}

function renderTests(tests) {
  if (!tests || tests.length === 0) {
    return `
      <div class="empty-state">
        ${t("profile_empty_tests", "Ты пока не проходил тест.")}<br>
        <a href="test.html">${t("profile_empty_tests_hint", "Пройти тест на подбор университета →")}</a>
      </div>
    `;
  }

  return tests.map((tData, idx) => {
    const isFirst = idx === 0;
    const currentClass = isFirst ? "test-current" : "";
    
    const cats = tData.categories || {};
    const meta = (cats.meta && typeof cats.meta === "object") ? cats.meta : {};
    const catDefs = [
      { key: "academic",  icon: "🎓", title: t("test_cat_academic", "По учебным показателям") },
      { key: "lifestyle", icon: "🌍", title: t("test_cat_lifestyle", "По желанию жить") },
      { key: "safe",      icon: "🎯", title: t("test_cat_safe", "Куда шанс высокий") },
      { key: "reach",     icon: "💪", title: t("test_cat_reach", "Куда мог бы, но не дотягиваешь") }
    ];
    let totalUnis = 0;
    catDefs.forEach(c => { totalUnis += (cats[c.key] || []).length; });

    const bodyHtml = catDefs.map(c => {
      const list = cats[c.key] || [];
      let listHtml;
      if (list.length === 0) {
        listHtml = `<div class="empty-mini">${t("test_empty_category", "Ничего не подошло в этой категории")}</div>`;
      } else {
        listHtml = `<div class="uni-list-mini">` + list.map(u => `
          <div class="uni-mini" data-uni-name="${escapeAttr(u.name || "")}" data-uni-id="${escapeAttr(u.id || "")}" data-uni-country="${escapeAttr(u.country || "")}" data-uni-city="${escapeAttr(u.city || "")}" data-degree="${escapeAttr(meta.degree || "")}" data-cit="${escapeAttr(meta.cit || "")}">
            <div class="uni-mini-name">${escapeHtml(u.name || "—")}</div>
            <div class="uni-mini-country">${escapeHtml([u.city, u.country].filter(Boolean).join(", "))}</div>
            ${u.reason ? `<div class="uni-mini-reason">${escapeHtml(u.reason)}</div>` : ""}
            <div class="uni-mini-arrow">${t("test_more", "Подробнее →")}</div>
          </div>
        `).join("") + `</div>`;
      }
      return `
        <div class="category-mini">
          <div class="category-title-mini">${c.icon} ${c.title}</div>
          ${listHtml}
        </div>
      `;
    }).join("");

    return `
      <div class="test-block anim-item ${currentClass}" style="animation-delay: ${0.05 * idx}s;" data-test-idx="${idx}">
        <div class="test-header" data-toggle-test>
          <div class="test-header-left">
            <div class="test-date">${isFirst ? t("profile_last_test", "Последний тест") : t("profile_test", "Тест")} · ${formatDate(tData.date)}</div>
            <div class="test-summary-line">${totalUnis} ${t("profile_unis_found", "университетов найдено")}</div>
          </div>
          <div class="test-toggle">▾</div>
        </div>
        <div class="test-body">
          ${bodyHtml}
          ${tData.summary ? `<div class="empty-mini" style="margin-top:20px; font-style:normal;">${escapeHtml(tData.summary)}</div>` : ""}
        </div>
      </div>
    `;
  }).join("");
}

const STUDY_SHOW_STEP = 10;
let studyShown = STUDY_SHOW_STEP;
let QUOTES_DATA = null;

function curLang() {
  try { return (window.I18N && window.I18N.getLang()) || "ru"; } catch (e) { return "ru"; }
}
function humanDur(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  const H = t("profile_study_h", "ч"), M = t("profile_study_m", "мин");
  if (h > 0) return h + " " + H + (m ? " " + String(m).padStart(2, "0") + " " + M : "");
  return Math.max(1, m) + " " + M;
}
function dayTitle(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const locales = { ru: "ru-RU", en: "en-US", zh: "zh-CN", kk: "kk-KZ", ky: "ky-KG" };
  const opts = { day: "numeric", month: "long", weekday: "short" };
  if (y !== new Date().getFullYear()) opts.year = "numeric";
  try { return new Intl.DateTimeFormat(locales[curLang()] || "ru-RU", opts).format(new Date(y, m - 1, d)); }
  catch (e) { return iso; }
}
async function loadQuotesData() {
  if (QUOTES_DATA) return QUOTES_DATA;
  try { const r = await fetch("quotes.json", { cache: "no-cache" }); QUOTES_DATA = await r.json(); }
  catch (e) { QUOTES_DATA = null; }
  return QUOTES_DATA;
}

function renderStudy(summary) {
  if (summary === false) return `<div class="empty-state">${t("profile_study_err", "Не удалось загрузить. Сервер просыпается — обнови страницу через полминуты.")}</div>`;
  const days = (summary && summary.days) || [];
  if (!days.length) {
    return `
      <div class="empty-state">
        ${t("profile_study_empty", "Пока нет сохранённых таймеров.")}<br>
        <a href="focus.html">${t("profile_study_hint", "Запустить таймер →")}</a>
      </div>`;
  }
  const streak = summary.streak || 0, best = summary.best_streak || 0;
  const head = `<div class="study-streak">🔥 ${t("profile_study_streak", "Серия")}: <b>${streak}</b> ${t("profile_study_days", "дн.")}${best ? ` · ${t("profile_study_best", "рекорд")} ${best}` : ""}</div>`;
  const list = days.slice(0, studyShown).map(d => `
    <div class="study-day">
      <div class="study-day-head">
        <div class="study-day-date">${escapeHtml(dayTitle(d.date))}</div>
        <div class="study-day-total">${t("profile_study_total", "всего")} ${escapeHtml(humanDur(d.total_sec))}</div>
      </div>
      <div class="study-items">
        ${(d.items || []).map(it => `<div class="study-item"><b>${escapeHtml(it.label)}</b><span class="dur">${escapeHtml(humanDur(it.sec))}</span></div>`).join("")}
      </div>
    </div>`).join("");
  const more = days.length > studyShown ? `<button type="button" class="study-more" data-study-more>${t("profile_study_more", "Показать ещё")}</button>` : "";
  return head + `<div class="study-days">${list}</div>` + more;
}

function renderSavedQuotes(ids, data) {
  if (ids === false) return `<div class="empty-state">${t("profile_study_err", "Не удалось загрузить.")}</div>`;
  const L = curLang();
  const byId = {};
  ((data && data.quotes) || []).forEach(q => { byId[q.id] = q; });
  const list = (ids || []).map(id => byId[id]).filter(Boolean);
  if (!list.length) {
    return `
      <div class="empty-state">
        ${t("profile_quotes_empty", "Ты пока не сохранил ни одной цитаты.")}<br>
        <a href="focus.html">${t("profile_quotes_hint", "Сохрани цитату дня пером на странице «Фокус» →")}</a>
      </div>`;
  }
  const quill = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M20.2 3.8c-5.6.4-10.6 3.6-13 8.6-.9 1.9-1.4 3.9-1.5 6l3.1-.5c2.2-.3 4.2-1.3 5.8-2.8l-2.4-.6 3.4-1.4c1.9-1.3 3.4-3.1 4.2-5.3.4-1.3.6-2.6.4-4z"/><path d="M16 8 4 20" fill="none" stroke-width="1.7" stroke-linecap="round"/></svg>';
  return `<div class="quotes-grid">` + list.map(q => {
    const a = (data.authors && data.authors[q.author]) || {};
    const title = escapeAttr(t("profile_quotes_remove", "Убрать из сохранённых"));
    return `<div class="quote-mini">
      <p>${escapeHtml(q.text[L] || q.text.ru)}</p>
      <div class="qa">${escapeHtml(a[L] || a.ru || "")}</div>
      <button type="button" class="qx" data-remove-quote="${q.id}" title="${title}" aria-label="${title}">${quill}</button>
    </div>`;
  }).join("") + `</div>`;
}

async function renderProfile() {
  const user = window.EduAuth.getCurrentUser();

  if (!user) {
    document.getElementById("mainContent").innerHTML = renderNotLoggedIn();
    return;
  }

  renderLoading();

  let saved = [];
  let tests = [];
  // «Фокус» грузится отдельно: если он не ответит, остальной профиль всё равно откроется
  const focusPromise = Promise.all([
    window.EduAuth.getStudySummary({ days: 30, strict: true }).catch(() => false),
    window.EduAuth.getSavedQuotes({ strict: true }).catch(() => false),
    loadQuotesData()
  ]);
  try {
    [saved, tests] = await Promise.all([
      window.EduAuth.getSaved({ strict: true }),
      window.EduAuth.getTests({ strict: true })
    ]);
  } catch (e) {
    // Сессия умерла — показываем экран входа, а не пустой профиль
    if (!window.EduAuth.isLoggedIn()) {
      document.getElementById("mainContent").innerHTML = renderNotLoggedIn();
      return;
    }
    // Иначе (например, сервер ещё просыпается) — честная ошибка и кнопка повтора
    document.getElementById("mainContent").innerHTML = `
      <div style="max-width:520px;margin:80px auto;text-align:center;padding:0 20px;">
        <div style="font-size:40px;margin-bottom:12px;">⚠️</div>
        <p style="margin-bottom:20px;">${escapeHtml((e && e.message) || t("modal_server_waking", "Сервер просыпается. Подожди 30 секунд и попробуй снова."))}</p>
        <button type="button" class="btn-logout" onclick="renderProfile()">${t("test_save_retry", "Повторить")}</button>
      </div>
    `;
    return;
  }

  document.getElementById("mainContent").innerHTML = `
    <div class="profile-head anim-item anim-delay-1">
      <div class="profile-greeting">
        <h1>${t("profile_greeting", "Привет")}, <em>${escapeHtml((user.name || "друг").split(" ")[0])}</em></h1>
        <div class="profile-email">${escapeHtml(user.email || "")}</div>
      </div>
      <button class="btn-logout" data-auth-logout>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span>${t("profile_logout", "Выйти")}</span>
      </button>
    </div>

    <section class="section anim-item anim-delay-2">
      <h2 class="section-title">${t("profile_saved_title", "⭐ Понравившиеся университеты")}</h2>
      <p class="section-sub">${t("profile_saved_sub", "Те, которые ты отметил звёздочкой в каталоге")}</p>
      ${renderSavedUniversities(saved)}
    </section>

    <section class="section anim-item anim-delay-3">
      <h2 class="section-title">${t("profile_tests_title", "🎯 Результаты теста")}</h2>
      <p class="section-sub">${t("profile_tests_sub", "Университеты, которые ИИ подобрал по твоим ответам")}</p>
      ${renderTests(tests)}
    </section>

    <section class="section anim-item anim-delay-3" id="studyLog">
      <h2 class="section-title">${t("profile_study_title", "⏱ Учёба по дням")}</h2>
      <p class="section-sub">${t("profile_study_sub", "Сохранённые таймеры со страницы «Фокус»")}</p>
      <div id="studyBox"><div class="empty-mini">${t("profile_loading", "Загрузка профиля")}…</div></div>
    </section>

    <section class="section anim-item anim-delay-3" id="savedQuotes">
      <h2 class="section-title">${t("profile_quotes_title", "🪶 Сохранённые цитаты")}</h2>
      <p class="section-sub">${t("profile_quotes_sub", "Цитаты дня, которые ты отметил пером")}</p>
      <div id="quotesBox"><div class="empty-mini">${t("profile_loading", "Загрузка профиля")}…</div></div>
    </section>

    ${renderDataControls()}
  `;

  const [summary, quoteIds, qdata] = await focusPromise;
  LAST_FOCUS = { summary, quoteIds, qdata };
  paintFocus();
  // переход по ссылке «Мои цитаты →» / «профиле» с другой страницы
  if (location.hash === "#savedQuotes" || location.hash === "#studyLog") {
    const el = document.querySelector(location.hash);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

let LAST_FOCUS = null;
function paintFocus() {
  if (!LAST_FOCUS) return;
  const s = document.getElementById("studyBox"), q = document.getElementById("quotesBox");
  if (s) s.innerHTML = renderStudy(LAST_FOCUS.summary);
  if (q) q.innerHTML = renderSavedQuotes(LAST_FOCUS.quoteIds, LAST_FOCUS.qdata);
}

document.addEventListener("click", async (e) => {
  const moreBtn = e.target.closest("[data-study-more]");
  if (moreBtn) {
    studyShown += STUDY_SHOW_STEP;
    paintFocus();
    return;
  }

  const qBtn = e.target.closest("[data-remove-quote]");
  if (qBtn) {
    qBtn.disabled = true;
    const id = Number(qBtn.dataset.removeQuote);
    const r = await window.EduAuth.toggleQuote(id);
    if (r.ok && LAST_FOCUS && Array.isArray(LAST_FOCUS.quoteIds)) {
      LAST_FOCUS.quoteIds = LAST_FOCUS.quoteIds.filter(x => x !== id);
      window.EduAuth.showToast(t("profile_quotes_removed", "Цитата убрана из сохранённых"), "info");
      paintFocus();
    } else {
      qBtn.disabled = false;
      window.EduAuth.showToast((r && r.error) || "Error", "error");
    }
    return;
  }

  const removeBtn = e.target.closest("[data-remove-saved]");
  if (removeBtn) {
    e.stopPropagation();
    const name = removeBtn.dataset.removeSaved;
    const saved = await window.EduAuth.getSaved();
    const uni = saved.find(u => u.name === name);
    if (uni) {
      await window.EduAuth.toggleSave({ name: uni.name, country: uni.country, city: uni.city });
      window.EduAuth.showToast(t("catalog_saved_remove", "Университет убран из избранного"), "info");
      renderProfile();
    }
    return;
  }

  const savedCard = e.target.closest(".saved-card");
  if (savedCard) {
    const name = savedCard.dataset.uniName;
    if (name) {
      // сразу открываем полное досье этого вуза (данные берутся из кэша, без нового поиска)
      const q = new URLSearchParams({ uni: name });
      if (savedCard.dataset.uniCountry) q.set("country", savedCard.dataset.uniCountry);
      if (savedCard.dataset.uniCity) q.set("city", savedCard.dataset.uniCity);
      window.location.href = "universities.html?" + q.toString() + "#detailShell";
    }
    return;
  }

  const testHeader = e.target.closest("[data-toggle-test]");
  if (testHeader) {
    const block = testHeader.closest(".test-block");
    if (block) block.classList.toggle("open");
    return;
  }

  const uniMini = e.target.closest(".uni-mini");
  if (uniMini && uniMini.dataset.uniName) {
    // открываем полную карточку вуза в «Университетах» — на том же уровне обучения и гражданстве, что в тесте
    const d = uniMini.dataset, q = new URLSearchParams({ uni: d.uniName });
    if (d.uniId) q.set("id", d.uniId);
    if (d.uniCountry) q.set("country", d.uniCountry);
    if (d.uniCity) q.set("city", d.uniCity);
    if (d.degree) q.set("degree", d.degree);
    if (d.cit && d.cit !== "XX") q.set("cit", d.cit);
    window.location.href = "universities.html?" + q.toString() + "#detailShell";
    return;
  }
});

window.addEventListener("edupath-lang-change", () => {
  document.getElementById("mainContent").style.opacity = "0";
  setTimeout(() => {
    renderProfile();
    document.getElementById("mainContent").style.opacity = "1";

// УПРАВЛЕНИЕ ДАННЫМИ: удалить выбранное или аккаунт целиком
// ============================================================

const DATA_PARTS = [
  ["saved",   "data_saved",   "Понравившиеся университеты"],
  ["tests",   "data_tests",   "Результаты тестов"],
  ["study",   "data_study",   "История таймеров и серия"],
  ["quotes",  "data_quotes",  "Сохранённые цитаты"],
  ["profile", "data_profile", "Данные профиля (гражданство, уровень обучения)"]
];
let pendingDelete = null;

function renderDataControls() {
  return `
    <section class="section anim-item anim-delay-3" id="dataControls">
      <h2 class="section-title">${t("data_title", "🗂 Управление данными")}</h2>
      <p class="section-sub">${t("data_sub", "Отметь, что стереть. Всё остальное останется.")}</p>
      <div class="data-list">
        ${DATA_PARTS.map(([id, key, fb]) => `
          <label class="data-opt"><input type="checkbox" data-del-part="${id}"><span>${t(key, fb)}</span></label>`).join("")}
      </div>
      <button type="button" class="btn-danger-soft" data-del-selected disabled>${t("data_delete_sel", "Удалить выбранное")}</button>

      <div class="danger-box">
        <div>
          <h3>${t("data_account_title", "Удалить аккаунт целиком")}</h3>
          <p>${t("data_account_sub", "Сотрётся всё: аккаунт, университеты, тесты, таймеры и цитаты. Вернуть будет нельзя.")}</p>
        </div>
        <button type="button" class="btn-danger" data-del-account>${t("data_account_btn", "Удалить аккаунт")}</button>
      </div>
    </section>

    <div class="dm-overlay" id="delModal" hidden>
      <div class="dm" role="dialog" aria-modal="true" aria-labelledby="delTitle">
        <h3 id="delTitle"></h3>
        <div style="font-size:14px;">${t("data_confirm_will", "Будет удалено:")}</div>
        <ul id="delList"></ul>
        <p class="dm-note">${t("data_confirm_note", "Дневные лимиты ИИ-теста при удалении не обнуляются.")}</p>
        <div id="delWordBox">
          <label for="delWord" id="delWordLabel"></label>
          <input type="text" id="delWord" autocomplete="off" autocapitalize="characters" spellcheck="false">
        </div>
        <p class="dm-err" id="delErr"></p>
        <div class="dm-actions">
          <button type="button" class="btn-logout" data-del-cancel>${t("data_cancel", "Отмена")}</button>
          <button type="button" class="btn-danger" data-del-confirm>${t("data_confirm_btn", "Удалить")}</button>
        </div>
      </div>
    </div>`;
}

function confirmWord() { return t("data_confirm_word", "УДАЛИТЬ"); }

function openDeleteModal(parts) {
  pendingDelete = parts;
  const acc = parts.indexOf("account") !== -1;
  const modal = document.getElementById("delModal");
  document.getElementById("delTitle").textContent = acc
    ? t("data_confirm_title_acc", "Удалить аккаунт навсегда?")
    : t("data_confirm_title_sel", "Удалить выбранное?");
  const items = acc
    ? [t("data_item_account", "Аккаунт и вход")].concat(DATA_PARTS.map(([, key, fb]) => t(key, fb)))
    : DATA_PARTS.filter(([id]) => parts.indexOf(id) !== -1).map(([, key, fb]) => t(key, fb));
  document.getElementById("delList").innerHTML = items.map(x => `<li>${escapeHtml(x)}</li>`).join("");
  // слово-подтверждение нужно только для удаления аккаунта
  document.getElementById("delWordBox").style.display = acc ? "block" : "none";
  document.getElementById("delWordLabel").innerHTML = escapeHtml(t("data_confirm_type", "Чтобы подтвердить, впиши слово {word}")).replace("{word}", "<b>" + escapeHtml(confirmWord()) + "</b>");
  document.getElementById("delWord").value = "";
  document.getElementById("delErr").textContent = "";
  document.querySelector("[data-del-confirm]").disabled = acc;
  modal.hidden = false;
  setTimeout(() => (acc ? document.getElementById("delWord") : document.querySelector("[data-del-cancel]")).focus(), 50);
}

function closeDeleteModal() {
  const m = document.getElementById("delModal");
  if (m) m.hidden = true;
  pendingDelete = null;
}

async function runDelete() {
  if (!pendingDelete) return;
  const parts = pendingDelete.slice();
  const acc = parts.indexOf("account") !== -1;
  const word = document.getElementById("delWord").value.trim();
  if (acc && word.toUpperCase() !== confirmWord().toUpperCase()) {
    document.getElementById("delErr").textContent = t("data_confirm_wrong", "Слово не совпадает");
    return;
  }
  const btn = document.querySelector("[data-del-confirm]");
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = t("modal_wait", "Подождите...");
  const res = await window.EduAuth.deleteMyData(parts, acc ? confirmWord() : "");
  btn.textContent = old;
  btn.disabled = false;
  if (!res.ok) {
    document.getElementById("delErr").textContent = res.error || t("modal_error_generic", "Что-то пошло не так");
    return;
  }
  closeDeleteModal();
  if (res.account) {
    window.EduAuth.showToast(t("data_acc_done", "Аккаунт удалён. Нам жаль, что ты уходишь."), "info");
    setTimeout(() => location.replace("index.html"), 1600);
    return;
  }
  window.EduAuth.showToast(t("data_done", "Готово, выбранное удалено."), "success");
  renderProfile();
}

document.addEventListener("change", (e) => {
  if (!e.target.matches("[data-del-part]")) return;
  const any = document.querySelectorAll("[data-del-part]:checked").length > 0;
  const b = document.querySelector("[data-del-selected]");
  if (b) b.disabled = !any;
});

document.addEventListener("input", (e) => {
  if (e.target.id !== "delWord") return;
  document.getElementById("delErr").textContent = "";
  document.querySelector("[data-del-confirm]").disabled = e.target.value.trim().toUpperCase() !== confirmWord().toUpperCase();
});

document.addEventListener("click", (e) => {
  if (e.target.closest("[data-del-selected]")) {
    const parts = Array.from(document.querySelectorAll("[data-del-part]:checked")).map(x => x.dataset.delPart);
    if (!parts.length) { window.EduAuth.showToast(t("data_pick", "Отметь хотя бы один пункт"), "info"); return; }
    openDeleteModal(parts);
    return;
  }
  if (e.target.closest("[data-del-account]")) { openDeleteModal(["account"]); return; }
  if (e.target.closest("[data-del-cancel]") || e.target.id === "delModal") { closeDeleteModal(); return; }
  if (e.target.closest("[data-del-confirm]")) { runDelete(); return; }
});

document.addEventListener("keydown", (e) => {
  const m = document.getElementById("delModal");
  if (!m || m.hidden) return;
  if (e.key === "Escape") closeDeleteModal();
  if (e.key === "Enter" && e.target.id === "delWord" && !document.querySelector("[data-del-confirm]").disabled) runDelete();
});
</script>
</body>
</html>
