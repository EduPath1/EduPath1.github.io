<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPath — Профиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7EFE1; --cream-deep:#EFE1C6; --paper:#FBF6EC;
    --espresso:#2B1B10; --bark:#5A3B26; --clay:#8C5A34;
    --caramel:#C79256; --sand:#D9BD93;
    --text-main:#2B1B10; --text-muted:#7A6552;
    --line:rgba(43,27,16,0.14);
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Work Sans', sans-serif; background:var(--cream); color:var(--text-main); line-height:1.5; min-height:100vh; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; letter-spacing:-0.01em; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }

  header{ background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:100; }
  nav.wrap{ display:flex; align-items:center; justify-content:space-between; height:84px; max-width:1200px; margin:0 auto; padding:0 32px; position:relative; }
  .logo{ display:flex; align-items:center; gap:12px; font-family:'Fraunces', serif; font-weight:600; font-size:26px; color:var(--espresso); }
  .logo svg{ width:38px; height:38px; flex-shrink:0; }
  .nav-links{ display:flex; align-items:center; gap:8px; }
  .nav-links a{ font-size:15px; color:var(--text-muted); padding:10px 18px; border-radius:8px; transition:background .25s var(--ease), color .25s var(--ease); }
  .nav-links a:hover{ color:var(--espresso); background:var(--cream-deep); }
  .nav-links a.active{ background:var(--espresso); color:var(--paper); }
  .nav-right{ display:flex; align-items:center; gap:14px; }
  .btn-login{ background:var(--clay); color:var(--paper); padding:10px 22px; border-radius:20px; font-size:14px; font-weight:500; }
  .icon-btn{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); border-radius:50%; }

  .lang-dropdown{ position:relative; }
  .lang-menu{ position:absolute; top:calc(100% + 10px); right:0; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:6px; min-width:150px; box-shadow:0 16px 32px -14px rgba(43,27,16,0.3); opacity:0; visibility:hidden; transform:translateY(-6px); transition:opacity .15s, transform .15s, visibility .15s; z-index:30; }
  .lang-menu.open{ opacity:1; visibility:visible; transform:translateY(0); }
  .lang-option{ display:block; width:100%; text-align:left; background:none; padding:10px 12px; font-size:14px; color:var(--text-muted); border-radius:8px; }
  .lang-option:hover{ background:var(--cream-deep); color:var(--espresso); }
  .lang-option.active{ background:var(--cream-deep); color:var(--espresso); font-weight:600; }

  main{ max-width:1000px; margin:0 auto; padding:48px 32px 96px; }

  .loading{ text-align:center; padding:80px 20px; color:var(--text-muted); font-size:15px; }
  .loading-dots{ display:inline-flex; gap:6px; margin-left:10px; vertical-align:middle; }
  .loading-dot{ width:8px; height:8px; border-radius:50%; background:var(--clay); animation:pulse 1.4s ease-in-out infinite; }
  .loading-dot:nth-child(2){ animation-delay: 0.2s; }
  .loading-dot:nth-child(3){ animation-delay: 0.4s; }
  @keyframes pulse{ 0%,80%,100%{ opacity:0.3; transform:scale(0.8);} 40%{ opacity:1; transform:scale(1.1);} }

  .auth-required{ text-align:center; padding:80px 20px; background:var(--paper); border-radius:24px; border:1px solid var(--line); }
  .auth-required svg{ width:60px; height:60px; color:var(--clay); margin-bottom:20px; }
  .auth-required h2{ font-size:28px; margin-bottom:12px; }
  .auth-required p{ font-size:15px; color:var(--text-muted); margin-bottom:28px; max-width:400px; margin-left:auto; margin-right:auto; }
  .btn-primary{ display:inline-flex; align-items:center; gap:10px; background:var(--espresso); color:var(--paper); padding:15px 30px; border-radius:10px; font-size:15px; font-weight:500; transition:background .25s var(--ease), transform .25s var(--ease); }
  .btn-primary:hover{ background:var(--bark); transform:translateY(-2px); }

  .profile-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:40px; flex-wrap:wrap; gap:20px; }
  .profile-greeting h1{ font-size:38px; color:var(--espresso); margin-bottom:6px; }
  .profile-greeting h1 em{ font-style:italic; color:var(--clay); }
  .profile-email{ font-size:14px; color:var(--text-muted); }
  .btn-logout{ display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:10px; background:var(--cream-deep); color:var(--espresso); font-size:14px; font-weight:500; transition:background .25s var(--ease); }
  .btn-logout:hover{ background:var(--sand); }

  .section{ margin-bottom:48px; }
  .section-title{ font-family:'Fraunces', serif; font-size:24px; color:var(--espresso); margin-bottom:8px; display:flex; align-items:center; gap:12px; }
  .section-sub{ font-size:14px; color:var(--text-muted); margin-bottom:20px; }

  .empty-state{ background:var(--paper); border:1px dashed var(--line); border-radius:16px; padding:40px 24px; text-align:center; font-size:14px; color:var(--text-muted); line-height:1.6; }
  .empty-state a{ color:var(--clay); text-decoration:underline; font-weight:500; }

  .saved-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; }
  .saved-card{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:20px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; cursor:pointer; transition:transform .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease); }
  .saved-card:hover{ transform:translateY(-3px); border-color:var(--sand); box-shadow:0 12px 24px -14px rgba(43,27,16,0.25); }
  .saved-info{ flex:1; min-width:0; }
  .saved-name{ font-weight:600; font-size:16px; color:var(--espresso); margin-bottom:4px; }
  .saved-location{ font-size:13px; color:var(--text-muted); }
  .saved-remove{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-muted); background:transparent; transition:background .2s, color .2s; flex-shrink:0; }
  .saved-remove:hover{ background:var(--cream); color:#B84A3A; }

  .test-block{ background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:32px; margin-bottom:16px; transition:box-shadow .3s var(--ease), border-color .3s var(--ease); }
  .test-block:hover{ border-color:var(--sand); box-shadow:0 12px 32px -18px rgba(43,27,16,0.25); }
  .test-current{ border-color:var(--caramel); border-width:1.5px; }
  .test-header{ display:flex; align-items:center; justify-content:space-between; gap:16px; cursor:pointer; user-select:none; }
  .test-header-left{ display:flex; flex-direction:column; gap:4px; }
  .test-date{ font-family:'Fraunces', serif; font-size:18px; color:var(--espresso); font-weight:600; }
  .test-summary-line{ font-size:13px; color:var(--text-muted); }
  .test-toggle{ font-size:20px; color:var(--text-muted); transition:transform .4s var(--ease); flex-shrink:0; }
  .test-block.open .test-toggle{ transform:rotate(180deg); }
  .test-body{ max-height:0; overflow:hidden; opacity:0; transition:max-height .6s var(--ease), opacity .4s var(--ease), padding .4s var(--ease); }
  .test-block.open .test-body{ max-height:8000px; opacity:1; padding-top:24px; }

  .category-mini{ margin-bottom:24px; }
  .category-mini:last-child{ margin-bottom:0; }
  .category-title-mini{ display:flex; align-items:center; gap:10px; font-family:'Fraunces', serif; font-size:18px; color:var(--espresso); margin-bottom:12px; }
  .uni-list-mini{ display:flex; flex-direction:column; gap:8px; }
  .uni-mini{ background:var(--cream); border:1px solid transparent; border-radius:10px; padding:12px 16px; cursor:pointer; transition:border-color .2s var(--ease), transform .2s var(--ease); }
  .uni-mini:hover{ border-color:var(--sand); transform:translateX(3px); }
  .uni-mini-name{ font-weight:600; font-size:14px; color:var(--espresso); margin-bottom:2px; }
  .uni-mini-country{ font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .uni-mini-reason{ font-size:13px; color:var(--text-main); opacity:0.85; line-height:1.55; }
  .uni-mini-arrow{ display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--clay); font-weight:600; margin-top:8px; opacity:0; transform:translateX(-4px); transition:opacity .2s var(--ease), transform .2s var(--ease); }
  .uni-mini:hover .uni-mini-arrow{ opacity:1; transform:translateX(0); }

  .empty-mini{ padding:14px; background:var(--cream); border-radius:8px; font-size:13px; color:var(--text-muted); text-align:center; font-style:italic; }

  @media (max-width: 900px){
    .nav-links{ display:none !important; }
  }
  @media (max-width: 700px){
    nav.wrap{ height:72px; padding:0 18px; }
    .logo{ font-size:21px; gap:9px; }
    .logo svg{ width:30px; height:30px; }
    main{ padding:32px 18px 64px; }
    .profile-greeting h1{ font-size:28px; }
    .saved-grid{ grid-template-columns:1fr; }
    .section-title{ font-size:20px; }
    .test-block{ padding:22px; }
  }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="#5A3B26" stroke-width="2"/>
        <path d="M27 13 L18 18 L13 27 L22 22 Z" fill="#C79256"/>
        <circle cx="20" cy="20" r="2.4" fill="#2B1B10"/>
      </svg>
      EduPath
    </a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav_home">Главная</a>
      <a href="universities.html" data-i18n="nav_universities">Университеты</a>
      <a href="profile.html" class="active" data-i18n="nav_profile">Профиль</a>
      <a href="fanzone.html" data-i18n="nav_fanzone">🤡 Fun Zone</a>
    </div>
    <div class="nav-right">
      <div class="lang-dropdown">
        <button type="button" class="icon-btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Сменить язык">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="19" height="19"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.7 4 6 4 9.5s-1.4 6.8-4 9.5c-2.6-2.7-4-6-4-9.5s1.4-6.8 4-9.5z"/></svg>
        </button>
        <div class="lang-menu" id="langMenu" role="menu">
          <button type="button" class="lang-option active" data-lang="ru" role="menuitem">Русский</button>
          <button type="button" class="lang-option" data-lang="en" role="menuitem">English</button>
          <button type="button" class="lang-option" data-lang="zh" role="menuitem">中文</button>
          <button type="button" class="lang-option" data-lang="kk" role="menuitem">Қазақша</button>
          <button type="button" class="lang-option" data-lang="ky" role="menuitem">Кыргызча</button>
        </div>
      </div>
      <a href="#" class="btn-login" data-auth-open="register" data-i18n="nav_login">Войти</a>
    </div>
  </nav>
</header>

<main id="mainContent">
  <div class="loading">
    <span data-i18n="profile_loading">Загрузка профиля</span>
    <span class="loading-dots">
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
    </span>
  </div>
</main>

<script src="i18n.js"></script>
<script src="auth.js"></script>
<script>
// ============================================================
// ХЕЛПЕРЫ
// ============================================================

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function escapeAttr(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function formatDate(iso) {
  const d = new Date(iso);
  const months = ["января", "февраля", "марта", "апреля", "мая", "июня",
                  "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  return d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear() + ", " +
         String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function t(key, fallback){
  return (window.I18N && window.I18N.t(key)) || fallback || key;
}

// ============================================================
// РЕНДЕР
// ============================================================

function renderLoading() {
  document.getElementById("mainContent").innerHTML = `
    <div class="loading">
      <span>${t("profile_loading", "Загрузка профиля")}</span>
      <span class="loading-dots">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      </span>
    </div>
  `;
}

function renderNotLoggedIn() {
  return `
    <div class="auth-required">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      <h2>${t("profile_need_login_title", "Сначала войди в аккаунт")}</h2>
      <p>${t("profile_need_login_desc", "Чтобы сохранять университеты и видеть результаты тестов — создай аккаунт или войди.")}</p>
      <button class="btn-primary" data-auth-open="register">
        <span>${t("profile_create_account", "Создать аккаунт")}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  `;
}

function renderSavedUniversities(saved) {
  if (!saved || saved.length === 0) {
    return `
      <div class="empty-state">
        ${t("profile_empty_saved", "Ты пока не сохранил ни одного университета.")}<br>
        <a href="universities.html">${t("profile_empty_saved_hint", "Зайди в каталог и нажми на звёздочку рядом с вузом.")}</a>
      </div>
    `;
  }
  return `
    <div class="saved-grid">
      ${saved.map(u => `
        <div class="saved-card" data-uni-name="${escapeAttr(u.name)}">
          <div class="saved-info">
            <div class="saved-name">${escapeHtml(u.name)}</div>
            <div class="saved-location">${escapeHtml(u.country || "")}${u.city ? " · " + escapeHtml(u.city) : ""}</div>
          </div>
          <button class="saved-remove" type="button" data-remove-saved="${escapeAttr(u.name)}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      `).join("")}
    </div>
  `;
}

function renderTests(tests) {
  if (!tests || tests.length === 0) {
    return `
      <div class="empty-state">
        ${t("profile_empty_tests", "Ты пока не проходил тест.")}<br>
        <a href="test.html">${t("profile_empty_tests_hint", "Пройти тест на подбор университета →")}</a>
      </div>
    `;
  }

  return tests.map((tData, idx) => {
    const isFirst = idx === 0;
    const openClass = isFirst ? "open" : "";
    const currentClass = isFirst ? "test-current" : "";
    const cats = tData.categories || {};
    const catDefs = [
      { key: "academic",  icon: "🎓", title: t("test_cat_academic", "По учебным показателям") },
      { key: "lifestyle", icon: "🌍", title: t("test_cat_lifestyle", "По желанию жить") },
      { key: "safe",      icon: "🎯", title: t("test_cat_safe", "Куда шанс высокий") },
      { key: "reach",     icon: "💪", title: t("test_cat_reach", "Куда мог бы, но не дотягиваешь") }
    ];
    let totalUnis = 0;
    catDefs.forEach(c => { totalUnis += (cats[c.key] || []).length; });

    const bodyHtml = catDefs.map(c => {
      const list = cats[c.key] || [];
      let listHtml;
      if (list.length === 0) {
        listHtml = `<div class="empty-mini">${t("test_empty_category", "Ничего не подошло в этой категории")}</div>`;
      } else {
        listHtml = `<div class="uni-list-mini">` + list.map(u => `
          <div class="uni-mini" data-uni-name="${escapeAttr(u.name || "")}">
            <div class="uni-mini-name">${escapeHtml(u.name || "—")}</div>
            <div class="uni-mini-country">${escapeHtml(u.country || "")}</div>
            <div class="uni-mini-reason">${escapeHtml(u.reason || "")}</div>
            <div class="uni-mini-arrow">${t("test_more", "Подробнее →")}</div>
          </div>
        `).join("") + `</div>`;
      }
      return `
        <div class="category-mini">
          <div class="category-title-mini">${c.icon} ${c.title}</div>
          ${listHtml}
        </div>
      `;
    }).join("");

    return `
      <div class="test-block ${openClass} ${currentClass}" data-test-idx="${idx}">
        <div class="test-header" data-toggle-test>
          <div class="test-header-left">
            <div class="test-date">${isFirst ? t("profile_last_test", "Последний тест") : t("profile_test", "Тест")} · ${formatDate(tData.date)}</div>
            <div class="test-summary-line">${totalUnis} ${t("profile_unis_found", "университетов найдено")}</div>
          </div>
          <div class="test-toggle">▾</div>
        </div>
        <div class="test-body">
          ${bodyHtml}
          ${tData.summary ? `<div class="empty-mini" style="margin-top:20px; font-style:normal;">${escapeHtml(tData.summary)}</div>` : ""}
        </div>
      </div>
    `;
  }).join("");
}

async function renderProfile() {
  const user = window.EduAuth.getCurrentUser();

  if (!user) {
    document.getElementById("mainContent").innerHTML = renderNotLoggedIn();
    return;
  }

  renderLoading();

  let saved = [];
  let tests = [];
  try { saved = await window.EduAuth.getSaved(); } catch(e) { saved = []; }
  try { tests = await window.EduAuth.getTests(); } catch(e) { tests = []; }

  document.getElementById("mainContent").innerHTML = `
    <div class="profile-head">
      <div class="profile-greeting">
        <h1>${t("profile_greeting", "Привет")}, <em>${escapeHtml((user.name || "друг").split(" ")[0])}</em></h1>
        <div class="profile-email">${escapeHtml(user.email || "")}</div>
      </div>
      <button class="btn-logout" data-auth-logout>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span>${t("profile_logout", "Выйти")}</span>
      </button>
    </div>

    <section class="section">
      <h2 class="section-title">${t("profile_saved_title", "⭐ Понравившиеся университеты")}</h2>
      <p class="section-sub">${t("profile_saved_sub", "Те, которые ты отметил звёздочкой в каталоге")}</p>
      ${renderSavedUniversities(saved)}
    </section>

    <section class="section">
      <h2 class="section-title">${t("profile_tests_title", "🎯 Результаты теста")}</h2>
      <p class="section-sub">${t("profile_tests_sub", "Университеты, которые ИИ подобрал по твоим ответам")}</p>
      ${renderTests(tests)}
    </section>
  `;
}

// ============================================================
// КЛИКИ
// ============================================================

document.addEventListener("click", async (e) => {
  const removeBtn = e.target.closest("[data-remove-saved]");
  if (removeBtn) {
    e.stopPropagation();
    const name = removeBtn.dataset.removeSaved;
    const saved = await window.EduAuth.getSaved();
    const uni = saved.find(u => u.name === name);
    if (uni) {
      await window.EduAuth.toggleSave({ name: uni.name, country: uni.country, city: uni.city });
      window.EduAuth.showToast(t("catalog_saved_remove", "Университет убран из избранного"), "info");
      renderProfile();
    }
    return;
  }

  const savedCard = e.target.closest(".saved-card");
  if (savedCard) {
    const name = savedCard.dataset.uniName;
    if (name) window.location.href = "universities.html?uni=" + encodeURIComponent(name);
    return;
  }

  const testHeader = e.target.closest("[data-toggle-test]");
  if (testHeader) {
    const block = testHeader.closest(".test-block");
    if (block) block.classList.toggle("open");
    return;
  }

  const uniMini = e.target.closest(".uni-mini");
  if (uniMini && uniMini.dataset.uniName) {
    window.location.href = "universities.html?uni=" + encodeURIComponent(uniMini.dataset.uniName);
    return;
  }
});

// ============================================================
// ПЕРЕРИСОВКА ПРИ СМЕНЕ ЯЗЫКА
// ============================================================

window.addEventListener("edupath-lang-change", () => {
  renderProfile();
});

renderProfile();
</script>
</body>
</html>
