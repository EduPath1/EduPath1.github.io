<!DOCTYPE html>
<html lang="ru">
<head>
<script>/* Внутренние страницы только для вошедших: без входа — на лендинг */try{if(!localStorage.getItem("edupath_token")){location.replace("index.html");}}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPath — Профиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFFFFF; --cream-deep:#F3F4F6; --paper:#FFFFFF;
    --espresso:#0A0A0B; --bark:#0A0A0B; --clay:#1F4FE0; --caramel:#1F4FE0; --sand:#D9DBE0;
    --text-main:#0A0A0B; --text-muted:#5F636B; --line:#E6E8EC; --blue-soft:#D9E2FB; --blue-mid:#8FA8F0;
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Inter', sans-serif; background:#fff; color:var(--text-main); line-height:1.45; min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  h1,h2,h3{ font-family:'Inter Tight', sans-serif; letter-spacing:-0.02em; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  @keyframes pulse { 0%,80%,100%{ opacity:0.3; transform:scale(0.8);} 40%{ opacity:1; transform:scale(1.1);} }

  .loading{ display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 200px); color:var(--text-muted); font-size:15px; gap:8px; }
  .loading-dots{ display:inline-flex; gap:6px; }
  .loading-dot{ width:8px; height:8px; border-radius:50%; background:var(--clay); animation:pulse 1.4s ease-in-out infinite; }
  .loading-dot:nth-child(2){ animation-delay:.2s; } .loading-dot:nth-child(3){ animation-delay:.4s; }
  .auth-required{ text-align:center; padding:80px 20px; max-width:560px; margin:60px auto; border:1px solid var(--line); border-radius:24px; }
  .auth-required h2{ font-size:28px; margin-bottom:12px; }
  .auth-required p{ color:var(--text-muted); margin-bottom:24px; }

  /* ---------- каркас: панель слева + содержимое ---------- */
  .pf{ display:grid; grid-template-columns:268px minmax(0,1fr); min-height:calc(100vh - 72px); background:linear-gradient(90deg,#0A0A0B 268px,#fff 268px); }
  .pf-side{ background:var(--espresso); color:#fff; padding:24px 18px; display:flex; flex-direction:column; gap:20px; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .pf-me{ display:flex; gap:12px; align-items:center; padding:14px; border-radius:16px; background:#17171A; }
  .ava{ width:48px; height:48px; border-radius:50%; background:var(--clay); color:#fff; display:grid; place-items:center; font:700 20px 'Inter Tight',sans-serif; flex:none; }
  .pf-me b{ display:block; font-size:16px; } .pf-me small{ color:#9EA3AC; font-size:12px; word-break:break-all; }
  .pf-nav{ display:flex; flex-direction:column; gap:4px; }
  .pf-nav a{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; color:#C9CCD2; font-weight:500; font-size:14px; transition:background .2s; }
  .pf-nav a:hover{ background:#1C1C20; color:#fff; }
  .pf-nav a svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; flex:none; }
  .pf-nav a em{ margin-left:auto; font-style:normal; font-size:12px; background:#24242A; color:#fff; border-radius:999px; padding:1px 8px; }
  .pf-nav a.on{ background:var(--clay); color:#fff; } .pf-nav a.on em{ background:rgba(255,255,255,.22); }
  .pf-mini{ margin-top:auto; padding:16px; border-radius:16px; background:#17171A; }
  .pf-mini small{ color:#9EA3AC; font-size:12px; display:block; }
  .pf-mini b{ display:block; font-size:15px; margin:4px 0; }
  .pf-mini .bar{ height:8px; border-radius:9px; background:#2A2A30; margin:10px 0 4px; overflow:hidden; } .pf-mini .bar i{ display:block; height:100%; background:var(--clay); border-radius:9px; }
  .pf-out{ color:#9EA3AC; font-size:13px; display:flex; gap:8px; align-items:center; padding:4px 2px; }
  .pf-out:hover{ color:#fff; }

  .pf-main{ padding:28px 36px 64px; display:flex; flex-direction:column; gap:22px; min-width:0; max-width:1240px; }
  .anchor{ scroll-margin-top:80px; }

  /* баннер */
  .hero{ position:relative; border-radius:24px; overflow:hidden; color:#fff; min-height:270px; display:flex; align-items:flex-end; background:#000; }
  .hero > img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:grayscale(1) brightness(.8); }
  .hero::after{ content:""; position:absolute; inset:0; background:linear-gradient(90deg,rgba(10,10,11,.92) 0%,rgba(10,10,11,.55) 55%,rgba(10,10,11,.15) 100%); }
  .hero-in{ position:relative; z-index:1; padding:30px 32px; width:100%; display:flex; justify-content:space-between; align-items:flex-end; gap:24px; }
  .pill{ display:inline-block; background:var(--clay); color:#fff; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:6px 11px; border-radius:999px; }
  .hero h1{ font-size:44px; line-height:1.05; margin:14px 0 8px; }
  .hero p{ color:#D5D8DE; max-width:460px; }
  .hero-me{ display:none; gap:12px; align-items:center; margin-bottom:16px; } .hero-me small{ color:#C9CCD2; font-size:12px; }
  .next{ background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:18px; padding:16px 18px; width:310px; flex:none; }
  .next small{ color:#C9CCD2; font-size:12px; } .next b{ display:block; font-size:17px; margin:4px 0 2px; }
  .count{ display:flex; gap:6px; margin:12px 0 14px; } .count span{ flex:1; background:rgba(255,255,255,.12); border-radius:10px; text-align:center; padding:6px 0; font-size:11px; color:#C9CCD2; } .count span b{ font-size:20px; color:#fff; margin:0; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--clay); color:#fff; border-radius:12px; padding:12px 18px; font-weight:600; font-size:14px; transition:background .2s, transform .2s; }
  .btn:hover{ background:#3A66F0; transform:translateY(-1px); }
  .btn.ghost{ background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.35); }
  .btn.light{ background:#fff; color:var(--clay); }
  .btn.gray{ background:var(--cream-deep); color:var(--espresso); } .btn.gray:hover{ background:var(--sand); }
  .btn.w{ width:100%; }

  /* вкладки на телефоне */
  .tabs{ display:none; gap:8px; overflow-x:auto; scrollbar-width:none; position:sticky; top:0; z-index:5; background:#fff; padding:10px 16px; margin:0 -16px; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tabs a{ padding:9px 14px; border-radius:999px; border:1px solid var(--line); font-size:13px; font-weight:600; white-space:nowrap; }
  .tabs a.on{ background:var(--espresso); color:#fff; border-color:var(--espresso); }

  /* цифры */
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .stat{ border:1px solid var(--line); border-radius:18px; padding:16px 18px; display:flex; flex-direction:column; gap:4px; }
  .stat small{ color:var(--text-muted); font-size:13px; } .stat .num{ font:700 32px 'Inter Tight',sans-serif; letter-spacing:-.02em; }
  .stat.k{ background:var(--espresso); color:#fff; border-color:var(--espresso); } .stat.k small{ color:#9EA3AC; }
  .spark{ display:flex; gap:5px; align-items:flex-end; height:30px; margin-top:auto; } .spark i{ flex:1; background:var(--clay); border-radius:4px; min-height:3px; } .spark i.z{ background:var(--line); }
  .flames{ display:flex; gap:5px; margin-top:auto; } .flames i{ width:18px; height:18px; border-radius:6px; background:var(--clay); } .flames i.o{ background:var(--line); }

  .sec-h{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .sec-h h2{ font-size:24px; } .sec-h a, .sec-h button{ color:var(--clay); font-weight:600; font-size:14px; }

  /* вузы */
  .unis{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .uni{ border-radius:20px; overflow:hidden; border:1px solid var(--line); background:#fff; cursor:pointer; transition:transform .25s var(--ease), box-shadow .25s; }
  .uni:hover{ transform:translateY(-3px); box-shadow:0 14px 28px -18px rgba(10,10,11,.35); }
  .uni .ph{ height:130px; position:relative; background:#222; }
  .uni .ph img{ width:100%; height:100%; object-fit:cover; filter:grayscale(1); }
  .uni .star{ position:absolute; right:12px; top:12px; width:34px; height:34px; border-radius:50%; background:#fff; display:grid; place-items:center; color:var(--clay); font-size:17px; }
  .uni .star:hover{ background:var(--espresso); color:#fff; }
  .uni .cc{ position:absolute; left:12px; top:12px; background:var(--espresso); color:#fff; font-size:11px; font-weight:700; padding:5px 9px; border-radius:999px; max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .uni .bd{ padding:14px 16px 16px; } .uni h3{ font-size:17px; margin-bottom:2px; } .uni small{ color:var(--text-muted); font-size:12px; }
  .dl{ margin-top:12px; display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--text-muted); } .dl b{ color:var(--espresso); white-space:nowrap; }
  .dbar{ height:6px; border-radius:9px; background:var(--cream-deep); margin-top:6px; overflow:hidden; } .dbar i{ display:block; height:100%; background:var(--clay); } .dbar.hot i{ background:var(--espresso); }

  .two{ display:grid; grid-template-columns:1.25fr 1fr; gap:16px; align-items:start; }
  .card{ border:1px solid var(--line); border-radius:20px; padding:20px 22px; min-width:0; }
  .card h3{ font-size:19px; margin-bottom:4px; } .card > small, .card .sub{ color:var(--text-muted); font-size:13px; }
  .seg{ display:flex; height:14px; border-radius:9px; overflow:hidden; margin:16px 0 10px; background:var(--cream-deep); }
  .leg{ display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:12px; color:var(--text-muted); }
  .leg span::before{ content:""; display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; background:var(--c); }
  .rec-cat{ margin-top:14px; } .rec-cat > b{ font-size:13px; display:flex; align-items:center; gap:8px; } .rec-cat > b::before{ content:""; width:9px; height:9px; border-radius:3px; background:var(--c); }
  .rec{ display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-top:1px solid var(--line); cursor:pointer; margin-top:8px; }
  .rec:hover b{ color:var(--clay); }
  .rec .ic{ width:38px; height:38px; border-radius:10px; background:var(--cream-deep); display:grid; place-items:center; font:700 13px 'Inter Tight',sans-serif; color:var(--espresso); flex:none; }
  .rec small{ display:block; color:var(--text-muted); font-size:12px; } .rec p{ font-size:12px; color:var(--text-main); opacity:.85; margin-top:3px; }
  .rec .go{ margin-left:auto; color:var(--clay); font-weight:700; flex:none; }
  .more-btn{ margin-top:10px; color:var(--clay); font-weight:600; font-size:13px; }
  .old-tests{ margin-top:14px; border-top:1px solid var(--line); padding-top:10px; font-size:13px; color:var(--text-muted); }

  .chart{ display:flex; gap:10px; align-items:flex-end; height:150px; margin-top:18px; }
  .chart div{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px; color:var(--text-muted); height:100%; justify-content:flex-end; }
  .chart div i{ width:100%; border-radius:8px 8px 4px 4px; background:var(--blue-soft); min-height:4px; } .chart div.t i{ background:var(--clay); }
  .chart-sum{ display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted); margin-top:12px; } .chart-sum b{ color:var(--espresso); }

  .quote{ background:var(--clay); color:#fff; border-radius:20px; padding:24px 26px; position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; gap:18px; }
  .quote::before{ content:"\201C"; position:absolute; right:18px; top:-30px; font-size:180px; font-family:Georgia,serif; opacity:.18; }
  .quote p{ font:600 21px/1.35 'Inter Tight',sans-serif; max-width:90%; } .quote small{ display:block; margin-top:12px; color:#D9E2FB; }
  .quote .acts{ display:flex; gap:8px; flex-wrap:wrap; }
  .tl{ display:flex; flex-direction:column; margin-top:12px; }
  .tl div{ display:flex; gap:14px; padding:11px 0; border-top:1px solid var(--line); align-items:center; cursor:pointer; }
  .tl .d{ width:54px; text-align:center; border-radius:10px; background:var(--cream-deep); padding:5px 0; font-size:11px; color:var(--text-muted); flex:none; } .tl .d b{ display:block; font-size:18px; color:var(--espresso); }
  .tl .d.h{ background:var(--espresso); color:#C9CCD2; } .tl .d.h b{ color:#fff; }
  .tl small{ display:block; color:var(--text-muted); font-size:12px; }
  .tl .src{ margin-left:auto; font-size:11px; color:var(--text-muted); background:var(--cream-deep); border-radius:999px; padding:3px 8px; white-space:nowrap; }

  .empty{ border:1px dashed var(--sand); border-radius:16px; padding:28px 20px; text-align:center; font-size:14px; color:var(--text-muted); line-height:1.6; }
  .empty a{ color:var(--clay); font-weight:600; }
  .empty-mini{ padding:14px; background:var(--cream-deep); border-radius:10px; font-size:13px; color:var(--text-muted); text-align:center; }
  details.log{ margin-top:14px; } details.log summary{ cursor:pointer; color:var(--clay); font-weight:600; font-size:14px; list-style:none; } details.log summary::-webkit-details-marker{ display:none; }
  details.log[open] summary{ margin-bottom:12px; }
  .settings{ display:flex; flex-direction:column; gap:16px; }
  .section-title{ font-size:20px; margin-bottom:6px; } .section-sub{ font-size:14px; color:var(--text-muted); margin-bottom:16px; }
  .btn-logout{ display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:10px; background:var(--cream-deep); color:var(--espresso); font-size:14px; font-weight:500; }
  .btn-logout:hover{ background:var(--sand); }
  .empty-state{ border:1px dashed var(--sand); border-radius:16px; padding:28px 20px; text-align:center; font-size:14px; color:var(--text-muted); } .empty-state a{ color:var(--clay); font-weight:600; }

  /* Учёба по дням (страница «Фокус») */
  .study-streak{ display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--bark); background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:6px 14px; margin-bottom:16px; }
  .study-streak b{ font-family:'Inter Tight', serif; font-size:16px; color:var(--espresso); }
  .study-days{ display:flex; flex-direction:column; gap:10px; }
  .study-day{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:16px 20px; transition:border-color .3s var(--ease); }
  .study-day:hover{ border-color:var(--sand); }
  .study-day-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:8px; }
  .study-day-date{ font-family:'Inter Tight', serif; font-size:17px; font-weight:600; color:var(--espresso); }
  .study-day-total{ font-size:13px; color:var(--text-muted); white-space:nowrap; }
  .study-items{ display:flex; flex-direction:column; gap:4px; }
  .study-item{ display:flex; justify-content:space-between; gap:12px; font-size:14px; padding:6px 0; border-top:1px solid rgba(10,10,11,.07); }
  .study-item:first-child{ border-top:none; }
  .study-item b{ font-weight:600; color:var(--espresso); }
  .study-item span.dur{ font-family:'Inter Tight', serif; font-weight:600; color:var(--bark); white-space:nowrap; }
  .study-more{ margin-top:12px; font-size:13px; color:var(--clay); font-weight:600; text-decoration:underline; text-underline-offset:3px; }

  /* Сохранённые цитаты */
  .quotes-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:12px; }
  .quote-mini{ position:relative; background:var(--espresso); color:var(--paper); border-radius:16px; padding:20px 56px 18px 20px; }
  .quote-mini p{ font-family:'Inter Tight', serif; font-size:17px; line-height:1.35; }
  .quote-mini .qa{ font-size:13px; color:var(--sand); margin-top:10px; }
  .quote-mini .qa::before{ content:"— "; }
  .quote-mini .qx{ position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; color:var(--espresso); background:var(--caramel); transition:transform .2s var(--ease), opacity .2s; }
  .quote-mini .qx:hover{ transform:scale(1.08); }
  .quote-mini .qx svg{ width:17px; height:17px; }

  /* ---------- Управление данными ---------- */
  .data-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:10px; margin-bottom:16px; }
  .data-opt{ display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--paper); border:1.5px solid var(--line); border-radius:12px; cursor:pointer; transition:border-color .2s, background .2s; font-size:14px; color:var(--text-main); }
  .data-opt:hover{ border-color:var(--sand); }
  .data-opt input{ width:18px; height:18px; accent-color:var(--clay); flex-shrink:0; margin:0; }
  .data-opt:has(input:checked){ border-color:var(--clay); background:var(--cream); }
  .btn-danger-soft, .btn-danger{ display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:10px; font-weight:600; font-size:14px; border:0; cursor:pointer; font-family:inherit; transition:transform .2s var(--ease), background .2s, opacity .2s; }
  .btn-danger-soft{ background:var(--cream-deep); color:#9B2C1F; }
  .btn-danger-soft:hover{ background:#F3D9CF; transform:translateY(-2px); }
  .btn-danger{ background:#B3362A; color:#fff; }
  .btn-danger:hover{ background:#962B20; transform:translateY(-2px); }
  .btn-danger:disabled, .btn-danger-soft:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
  .danger-box{ margin-top:22px; padding:18px 20px; border:1.5px dashed rgba(179,54,42,.45); border-radius:14px; display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .danger-box h3{ margin:0 0 4px; font-size:16px; color:#9B2C1F; }
  .danger-box p{ margin:0; font-size:13px; color:var(--text-muted); max-width:520px; line-height:1.5; }
  .dm-overlay{ position:fixed; inset:0; background:rgba(10,10,11,.55); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:9990; }
  .dm-overlay[hidden]{ display:none; }
  .dm{ background:var(--paper); border-radius:16px; max-width:440px; width:100%; padding:26px 24px 22px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:92vh; overflow-y:auto; }
  .dm h3{ margin:0 0 12px; font-size:20px; }
  .dm ul{ margin:6px 0 12px; padding-left:20px; font-size:14px; line-height:1.6; }
  .dm .dm-note{ font-size:12.5px; color:var(--text-muted); margin:0 0 14px; }
  .dm label{ display:block; font-size:13px; margin-bottom:6px; color:var(--bark); }
  .dm input[type=text]{ width:100%; box-sizing:border-box; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:15px; font-family:inherit; background:#fff; letter-spacing:.04em; }
  .dm input[type=text]:focus{ outline:none; border-color:var(--clay); }
  .dm .dm-err{ color:#B3362A; font-size:13px; min-height:18px; margin:8px 0 0; }
  .dm .dm-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }


  @media (max-width:1180px){ .stats{ grid-template-columns:repeat(2,1fr); } .unis{ grid-template-columns:repeat(2,1fr); } .two{ grid-template-columns:1fr; } .next{ width:280px; } }
  @media (max-width:900px){
    .pf{ display:block; background:#fff; } .pf-side{ display:none; }
    .pf-main{ padding:0 16px 48px; gap:18px; }
    .hero{ border-radius:0; margin:0 -16px; min-height:0; }
    .hero-in{ flex-direction:column; align-items:stretch; padding:22px 18px 18px; }
    .hero h1{ font-size:32px; } .next{ width:auto; }
    .hero-me{ display:flex; }
    .tabs{ display:flex; }
    .unis{ display:flex; overflow-x:auto; scroll-snap-type:x mandatory; margin-right:-16px; padding-right:16px; scrollbar-width:none; } .unis::-webkit-scrollbar{ display:none; }
    .uni{ min-width:260px; scroll-snap-align:start; }
    .stats{ gap:10px; } .stat .num{ font-size:24px; }
    .quote p{ font-size:18px; }
  }
</style>

<header class="ep-header" id="siteHeader" data-variant="app"></header>
<script src="layout.js?v=5"></script>

const LOCALES = { ru: "ru-RU", en: "en-GB", zh: "zh-CN", kk: "kk-KZ", ky: "ky-KG" };
const PHOTOS = ["d-students.jpg", "d-graduation.jpg", "d-study.jpg", "d-desk.jpg", "d-airport.jpg", "d-hero.jpg", "d-phone.jpg"];
const CAT_COLORS = { academic: "#0A0A0B", lifestyle: "#1F4FE0", safe: "#8FA8F0", reach: "#C9CCD2" };

function escapeHtml(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
function escapeAttr(s) { return escapeHtml(s); }
function t(key, fallback) { return (window.I18N && window.I18N.t(key) !== key && window.I18N.t(key)) || fallback || key; }
function curLang() { try { return (window.I18N && window.I18N.getLang()) || localStorage.getItem("edupath_lang") || "ru"; } catch (e) { return "ru"; } }
function p(key, vars) { let s = (P[curLang()] || P.ru)[key] ?? P.ru[key] ?? key; if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => vars[k] != null ? vars[k] : m); return s; }
function fmtDay(iso, opts) { try { return new Intl.DateTimeFormat(LOCALES[curLang()] || "ru-RU", opts || { day: "numeric", month: "short" }).format(new Date(iso)); } catch (e) { return iso; } }
function initials(name) { return (String(name || "?").trim()[0] || "?").toUpperCase(); }
function abbr(name) { const w = String(name || "").replace(/[^A-Za-zА-Яа-яЁё ]/g, " ").split(/\s+/).filter(x => x && !/^(of|the|and|de|di|da|du|für|la|le)$/i.test(x)); return (w.length > 1 ? w.slice(0, 3).map(x => x[0]).join("") : (w[0] || "?").slice(0, 3)).toUpperCase(); }
function hashIdx(s, n) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % n; }
function humanDur(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  const H = t("profile_study_h", "ч"), M = t("profile_study_m", "мин");
  if (h > 0) return h + " " + H + (m ? " " + String(m).padStart(2, "0") + " " + M : "");
  return Math.max(sec ? 1 : 0, m) + " " + M;
}
function dayTitle(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const opts = { day: "numeric", month: "long", weekday: "short" };
  if (y !== new Date().getFullYear()) opts.year = "numeric";
  try { return new Intl.DateTimeFormat(LOCALES[curLang()] || "ru-RU", opts).format(new Date(y, m - 1, d)); } catch (e) { return iso; }
}
const isoLocal = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

/* ---------- ссылки в досье ---------- */
function uniHref(u, meta) {
  const q = new URLSearchParams({ uni: u.name });
  if (u.id) q.set("id", u.id);
  if (u.country) q.set("country", u.country);
  if (u.city) q.set("city", u.city);
  if (meta && meta.degree) q.set("degree", meta.degree);
  if (meta && meta.cit && meta.cit !== "XX") q.set("cit", meta.cit);
  return "universities.html?" + q.toString() + "#detailShell";
}

/* ---------- состояние ---------- */
const S = { user: null, saved: [], tests: [], study: null, quoteIds: null, qdata: null, showAllUnis: false, showAllRecs: false, showOldTests: false, studyShown: 10 };

/* все вузы с дедлайнами: из избранного и из последнего теста */
function deadlineList() {
  if (!window.EduDeadlines) return [];
  const seen = new Set(), out = [];
  const add = (u, src, meta) => {
    const key = window.EduDeadlines.norm(u.name); if (!u.name || seen.has(key)) return;
    const d = window.EduDeadlines.next(u.name); if (!d || !d.date) return;
    seen.add(key); out.push({ u, src, meta, d });
  };
  S.saved.forEach(u => add(u, "saved"));
  const last = S.tests[0], cats = (last && last.categories) || {};
  ["academic", "lifestyle", "safe", "reach"].forEach(k => (cats[k] || []).forEach(u => add(u, "test", cats.meta)));
  return out.sort((a, b) => a.d.date.localeCompare(b.d.date));
}

    study: '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>',
    quotes: '<svg viewBox="0 0 24 24"><path d="M6 17h4l2-4V7H6v6h3M14 17h4l2-4V7h-6v6h3"/></svg>',
    set: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2L14 3h-4l-.5 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 005 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2L10 21h4l.5-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>'
  };
  const items = [["over", "pOver"], ["unis", "pUnis", counts.saved], ["tests", "pTests", counts.tests], ["study", "pStudy"], ["quotes", "pQuotes", counts.quotes], ["set", "pSet"]];
  return items.map(([k, id, n]) => `<a href="#${id}" data-nav="${id}">${ic[k]}${escapeHtml(p("nav_" + k))}${n ? `<em>${n}</em>` : ""}</a>`).join("");

function last7() {
  const days = (S.study && S.study.days) || [], map = {};
  days.forEach(d => { map[d.date] = d.total_sec || 0; });
  const out = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const k = isoLocal(d); out.push({ date: k, sec: map[k] || 0 }); }
  return out;
}

  const w = last7(), wsum = w.reduce((a, x) => a + x.sec, 0), wmax = Math.max(1, ...w.map(x => x.sec));
  const streak = (S.study && S.study.streak) || 0, best = (S.study && S.study.best_streak) || 0;
  return `<div class="stats">
    <div class="stat k"><small>${escapeHtml(p("st_saved"))}</small><div class="num">${S.saved.length}</div><small>${testCount ? escapeHtml(p("st_from_test", { n: testCount })) : "&nbsp;"}</small></div>

    <div class="stat"><small>${escapeHtml(p("st_week"))}</small><div class="num">${escapeHtml(humanDur(wsum))}</div><div class="spark">${w.map(x => `<i class="${x.sec ? "" : "z"}" style="height:${x.sec ? Math.max(12, Math.round(x.sec / wmax * 100)) : 10}%"></i>`).join("")}</div></div>

}

  if (!days.length) return `<div class="empty-state">${t("profile_study_empty", "Пока нет сохранённых таймеров.")}<br><a href="focus.html">${t("profile_study_hint", "Запустить таймер →")}</a></div>`;
  const list = days.slice(0, S.studyShown).map(d => `
    <div class="study-day"><div class="study-day-head"><div class="study-day-date">${escapeHtml(dayTitle(d.date))}</div><div class="study-day-total">${t("profile_study_total", "всего")} ${escapeHtml(humanDur(d.total_sec))}</div></div>

  return `<div class="study-days">${list}</div>` + more;
}

  const quill = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M20.2 3.8c-5.6.4-10.6 3.6-13 8.6-.9 1.9-1.4 3.9-1.5 6l3.1-.5c2.2-.3 4.2-1.3 5.8-2.8l-2.4-.6 3.4-1.4c1.9-1.3 3.4-3.1 4.2-5.3.4-1.3.6-2.6.4-4z"/><path d="M16 8 4 20" fill="none" stroke-width="1.7" stroke-linecap="round"/></svg>';

function watchNav() {
  const links = document.querySelectorAll("[data-nav]");
  const mark = id => links.forEach(a => a.classList.toggle("on", a.dataset.nav === id));
  mark("pOver");
  if (!("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) mark(e.target.id); }); }, { rootMargin: "-30% 0px -60% 0px" });
  ["pOver", "pUnis", "pTests", "pStudy", "pQuotes", "pSet"].forEach(id => { const el = document.getElementById(id); if (el) io.observe(el); });
}

function renderNotLoggedIn() {
  return `<div class="auth-required"><h2>${t("profile_need_login_title", "Сначала войди в аккаунт")}</h2><p>${t("profile_need_login_desc", "Чтобы сохранять университеты и видеть результаты тестов — создай аккаунт или войди.")}</p>
    <button class="btn" data-auth-open="register">${t("profile_create_account", "Создать аккаунт")}</button></div>`;
}
function renderLoading() {
  document.getElementById("mainContent").innerHTML = `<div class="loading"><span>${escapeHtml(t("profile_loading", "Загрузка профиля"))}</span><span class="loading-dots"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></span></div>`;
}

async function renderProfile() {
  const user = window.EduAuth.getCurrentUser();
  if (!user) { document.getElementById("mainContent").innerHTML = renderNotLoggedIn(); return; }
  S.user = user;
  renderLoading();
  const focusPromise = Promise.all([
    window.EduAuth.getStudySummary({ days: 30, strict: true }).catch(() => false),
    window.EduAuth.getSavedQuotes({ strict: true }).catch(() => false),
    loadQuotesData()
  ]);
  try {
    const [saved, tests] = await Promise.all([window.EduAuth.getSaved({ strict: true }), window.EduAuth.getTests({ strict: true }), window.EduDeadlines.load()]);
    S.saved = saved || []; S.tests = tests || [];
  } catch (e) {
    if (!window.EduAuth.isLoggedIn()) { document.getElementById("mainContent").innerHTML = renderNotLoggedIn(); return; }
    document.getElementById("mainContent").innerHTML = `<div style="max-width:520px;margin:80px auto;text-align:center;padding:0 20px;"><p style="margin-bottom:20px;">${escapeHtml((e && e.message) || t("modal_server_waking", "Сервер просыпается. Подожди 30 секунд и попробуй снова."))}</p><button type="button" class="btn-logout" onclick="renderProfile()">${t("test_save_retry", "Повторить")}</button></div>`;
    return;
  }
  S.study = null; S.quoteIds = null;
  paint();
  const [summary, quoteIds, qdata] = await focusPromise;
  S.study = summary; S.quoteIds = quoteIds; S.qdata = qdata;
  paint();
  const h = { "#savedQuotes": "pQuotes", "#studyLog": "pStudy" }[location.hash] || (location.hash || "").slice(1);
  const el = h && document.getElementById(h);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}

document.addEventListener("click", async (e) => {
  if (e.target.closest("[data-study-more]")) { S.studyShown += 10; const b = document.getElementById("studyBox"); if (b) b.innerHTML = renderStudy(S.study); return; }
  if (e.target.closest("[data-all-unis]")) { S.showAllUnis = !S.showAllUnis; paint(); document.getElementById("pUnis").scrollIntoView({ block: "start" }); return; }
  if (e.target.closest("[data-all-recs]")) { S.showAllRecs = !S.showAllRecs; paint(); document.getElementById("pTests").scrollIntoView({ block: "start" }); return; }
  if (e.target.closest("[data-old-tests]")) { S.showOldTests = !S.showOldTests; paint(); document.getElementById("pTests").scrollIntoView({ block: "start" }); return; }
  const qBtn = e.target.closest("[data-remove-quote]");
  if (qBtn) {
    qBtn.disabled = true;
    const id = Number(qBtn.dataset.removeQuote), r = await window.EduAuth.toggleQuote(id);
    if (r.ok && Array.isArray(S.quoteIds)) { S.quoteIds = S.quoteIds.filter(x => x !== id); window.EduAuth.showToast(t("profile_quotes_removed", "Цитата убрана из сохранённых"), "info"); paint(); }
    else { qBtn.disabled = false; window.EduAuth.showToast((r && r.error) || "Error", "error"); }
    return;
  }
  const removeBtn = e.target.closest("[data-remove-saved]");
  if (removeBtn) {
    e.stopPropagation();
    const uni = S.saved.find(u => u.name === removeBtn.dataset.removeSaved);
    if (uni) {
      removeBtn.disabled = true;
      await window.EduAuth.toggleSave({ name: uni.name, country: uni.country, city: uni.city });
      S.saved = S.saved.filter(u => u !== uni);
      window.EduAuth.showToast(t("catalog_saved_remove", "Университет убран из избранного"), "info");
      paint();
    }
    return;
  }
  const open = e.target.closest("[data-open]");
  if (open && !e.target.closest("a,button")) { location.href = open.dataset.open; return; }
});

window.addEventListener("edupath-lang-change", () => { if (S.user && S.saved) paint(); else renderProfile(); });

renderProfile();

// ============================================================
// УПРАВЛЕНИЕ ДАННЫМИ: удалить выбранное или аккаунт целиком
// ============================================================

const DATA_PARTS = [
  ["saved",   "data_saved",   "Понравившиеся университеты"],
  ["tests",   "data_tests",   "Результаты тестов"],
  ["study",   "data_study",   "История таймеров и серия"],
  ["quotes",  "data_quotes",  "Сохранённые цитаты"],
  ["profile", "data_profile", "Данные профиля (гражданство, уровень обучения)"]
];
let pendingDelete = null;

function renderDataControls() {
  return `
    <section class="section anim-item anim-delay-3" id="dataControls">
      <h2 class="section-title">${t("data_title", "🗂 Управление данными")}</h2>
      <p class="section-sub">${t("data_sub", "Отметь, что стереть. Всё остальное останется.")}</p>
      <div class="data-list">
        ${DATA_PARTS.map(([id, key, fb]) => `
          <label class="data-opt"><input type="checkbox" data-del-part="${id}"><span>${t(key, fb)}</span></label>`).join("")}
      </div>
      <button type="button" class="btn-danger-soft" data-del-selected disabled>${t("data_delete_sel", "Удалить выбранное")}</button>

      <div class="danger-box">
        <div>
          <h3>${t("data_account_title", "Удалить аккаунт целиком")}</h3>
          <p>${t("data_account_sub", "Сотрётся всё: аккаунт, университеты, тесты, таймеры и цитаты. Вернуть будет нельзя.")}</p>
        </div>
        <button type="button" class="btn-danger" data-del-account>${t("data_account_btn", "Удалить аккаунт")}</button>
      </div>
    </section>

    <div class="dm-overlay" id="delModal" hidden>
      <div class="dm" role="dialog" aria-modal="true" aria-labelledby="delTitle">
        <h3 id="delTitle"></h3>
        <div style="font-size:14px;">${t("data_confirm_will", "Будет удалено:")}</div>
        <ul id="delList"></ul>
        <p class="dm-note">${t("data_confirm_note", "Дневные лимиты ИИ-теста при удалении не обнуляются.")}</p>
        <div id="delWordBox">
          <label for="delWord" id="delWordLabel"></label>
          <input type="text" id="delWord" autocomplete="off" autocapitalize="characters" spellcheck="false">
        </div>
        <p class="dm-err" id="delErr"></p>
        <div class="dm-actions">
          <button type="button" class="btn-logout" data-del-cancel>${t("data_cancel", "Отмена")}</button>
          <button type="button" class="btn-danger" data-del-confirm>${t("data_confirm_btn", "Удалить")}</button>
        </div>
      </div>
    </div>`;
}

function confirmWord() { return t("data_confirm_word", "УДАЛИТЬ"); }

function openDeleteModal(parts) {
  pendingDelete = parts;
  const acc = parts.indexOf("account") !== -1;
  const modal = document.getElementById("delModal");
  document.getElementById("delTitle").textContent = acc
    ? t("data_confirm_title_acc", "Удалить аккаунт навсегда?")
    : t("data_confirm_title_sel", "Удалить выбранное?");
  const items = acc
    ? [t("data_item_account", "Аккаунт и вход")].concat(DATA_PARTS.map(([, key, fb]) => t(key, fb)))
    : DATA_PARTS.filter(([id]) => parts.indexOf(id) !== -1).map(([, key, fb]) => t(key, fb));
  document.getElementById("delList").innerHTML = items.map(x => `<li>${escapeHtml(x)}</li>`).join("");
  // слово-подтверждение нужно только для удаления аккаунта
  document.getElementById("delWordBox").style.display = acc ? "block" : "none";
  document.getElementById("delWordLabel").innerHTML = escapeHtml(t("data_confirm_type", "Чтобы подтвердить, впиши слово {word}")).replace("{word}", "<b>" + escapeHtml(confirmWord()) + "</b>");
  document.getElementById("delWord").value = "";
  document.getElementById("delErr").textContent = "";
  document.querySelector("[data-del-confirm]").disabled = acc;
  modal.hidden = false;
  setTimeout(() => (acc ? document.getElementById("delWord") : document.querySelector("[data-del-cancel]")).focus(), 50);
}

function closeDeleteModal() {
  const m = document.getElementById("delModal");
  if (m) m.hidden = true;
  pendingDelete = null;
}

async function runDelete() {
  if (!pendingDelete) return;
  const parts = pendingDelete.slice();
  const acc = parts.indexOf("account") !== -1;
  const word = document.getElementById("delWord").value.trim();
  if (acc && word.toUpperCase() !== confirmWord().toUpperCase()) {
    document.getElementById("delErr").textContent = t("data_confirm_wrong", "Слово не совпадает");
    return;
  }
  const btn = document.querySelector("[data-del-confirm]");
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = t("modal_wait", "Подождите...");
  const res = await window.EduAuth.deleteMyData(parts, acc ? confirmWord() : "");
  btn.textContent = old;
  btn.disabled = false;
  if (!res.ok) {
    document.getElementById("delErr").textContent = res.error || t("modal_error_generic", "Что-то пошло не так");
    return;
  }
  closeDeleteModal();
  if (res.account) {
    window.EduAuth.showToast(t("data_acc_done", "Аккаунт удалён. Нам жаль, что ты уходишь."), "info");
    setTimeout(() => location.replace("index.html"), 1600);
    return;
  }
  window.EduAuth.showToast(t("data_done", "Готово, выбранное удалено."), "success");
  renderProfile();
}

document.addEventListener("change", (e) => {
  if (!e.target.matches("[data-del-part]")) return;
  const any = document.querySelectorAll("[data-del-part]:checked").length > 0;
  const b = document.querySelector("[data-del-selected]");
  if (b) b.disabled = !any;
});

document.addEventListener("input", (e) => {
  if (e.target.id !== "delWord") return;
  document.getElementById("delErr").textContent = "";
  document.querySelector("[data-del-confirm]").disabled = e.target.value.trim().toUpperCase() !== confirmWord().toUpperCase();
});

document.addEventListener("click", (e) => {
  if (e.target.closest("[data-del-selected]")) {
    const parts = Array.from(document.querySelectorAll("[data-del-part]:checked")).map(x => x.dataset.delPart);
    if (!parts.length) { window.EduAuth.showToast(t("data_pick", "Отметь хотя бы один пункт"), "info"); return; }
    openDeleteModal(parts);
    return;
  }
  if (e.target.closest("[data-del-account]")) { openDeleteModal(["account"]); return; }
  if (e.target.closest("[data-del-cancel]") || e.target.id === "delModal") { closeDeleteModal(); return; }
  if (e.target.closest("[data-del-confirm]")) { runDelete(); return; }
});

document.addEventListener("keydown", (e) => {
  const m = document.getElementById("delModal");
  if (!m || m.hidden) return;
  if (e.key === "Escape") closeDeleteModal();
  if (e.key === "Enter" && e.target.id === "delWord" && !document.querySelector("[data-del-confirm]").disabled) runDelete();
});

</script>
</body>
