<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPath — Профиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7EFE1; --cream-deep:#EFE1C6; --paper:#FBF6EC;
    --espresso:#2B1B10; --bark:#5A3B26; --clay:#8C5A34;
    --caramel:#C79256; --sand:#D9BD93;
    --text-main:#2B1B10; --text-muted:#7A6552;
    --line:rgba(43,27,16,0.14);
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:'Work Sans', sans-serif;
    background:var(--cream); color:var(--text-main);
    line-height:1.5; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; letter-spacing:-0.01em; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }

  /* HEADER */
  header{ background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:100; }
  nav.wrap{ display:flex; align-items:center; justify-content:space-between; height:84px; max-width:1200px; margin:0 auto; padding:0 32px; }
  .logo{ display:flex; align-items:center; gap:12px; font-family:'Fraunces', serif; font-weight:600; font-size:26px; color:var(--espresso); }
  .logo svg{ width:38px; height:38px; flex-shrink:0; }
  .nav-links{ display:flex; align-items:center; gap:8px; }
  .nav-links a{ font-size:15px; color:var(--text-muted); padding:10px 18px; border-radius:8px; transition:background .25s var(--ease), color .25s var(--ease); }
  .nav-links a:hover{ color:var(--espresso); background:var(--cream-deep); }
  .nav-links a.active{ background:var(--espresso); color:var(--paper); }
  .nav-right{ display:flex; align-items:center; gap:14px; }
  .btn-login{ background:var(--clay); color:var(--paper); padding:10px 22px; border-radius:20px; font-size:14px; font-weight:500; }
  .icon-btn{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); border-radius:50%; }

  /* MAIN */
  main{ max-width:1000px; margin:0 auto; padding:48px 32px 96px; }

  /* NOT LOGGED IN */
  .auth-required{
    text-align:center; padding:80px 20px;
    background:var(--paper); border-radius:24px;
    border:1px solid var(--line);
  }
  .auth-required svg{ width:60px; height:60px; color:var(--clay); margin-bottom:20px; }
  .auth-required h2{ font-size:28px; margin-bottom:12px; }
  .auth-required p{ font-size:15px; color:var(--text-muted); margin-bottom:28px; max-width:400px; margin-left:auto; margin-right:auto; }
  .btn-primary{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--espresso); color:var(--paper);
    padding:15px 30px; border-radius:10px;
    font-size:15px; font-weight:500;
    transition:background .25s var(--ease), transform .25s var(--ease);
  }
  .btn-primary:hover{ background:var(--bark); transform:translateY(-2px); }

  /* LOGGED IN */
  .profile-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:40px; flex-wrap:wrap; gap:20px;
  }
  .profile-greeting h1{ font-size:38px; color:var(--espresso); margin-bottom:6px; }
  .profile-greeting h1 em{ font-style:italic; color:var(--clay); }
  .profile-email{ font-size:14px; color:var(--text-muted); }
  .btn-logout{
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 22px; border-radius:10px;
    background:var(--cream-deep); color:var(--espresso);
    font-size:14px; font-weight:500;
    transition:background .25s var(--ease);
  }
  .btn-logout:hover{ background:var(--sand); }

  .section{ margin-bottom:48px; }
  .section-title{
    font-family:'Fraunces', serif; font-size:24px;
    color:var(--espresso); margin-bottom:8px;
    display:flex; align-items:center; gap:12px;
  }
  .section-sub{ font-size:14px; color:var(--text-muted); margin-bottom:20px; }

  .empty-state{
    background:var(--paper); border:1px dashed var(--line);
    border-radius:16px; padding:40px 24px; text-align:center;
    font-size:14px; color:var(--text-muted); line-height:1.6;
  }
  .empty-state a{ color:var(--clay); text-decoration:underline; font-weight:500; }

  /* SAVED UNIVERSITIES */
  .saved-grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:14px;
  }
  .saved-card{
    background:var(--paper); border:1px solid var(--line);
    border-radius:14px; padding:20px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    transition:transform .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease);
  }
  .saved-card:hover{
    transform:translateY(-3px);
    border-color:var(--sand);
    box-shadow:0 12px 24px -14px rgba(43,27,16,0.25);
  }
  .saved-info{ flex:1; min-width:0; }
  .saved-name{ font-weight:600; font-size:16px; color:var(--espresso); margin-bottom:4px; }
  .saved-location{ font-size:13px; color:var(--text-muted); }
  .saved-remove{
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-muted); background:transparent;
    transition:background .2s, color .2s;
    flex-shrink:0;
  }
  .saved-remove:hover{ background:var(--cream); color:#B84A3A; }

  /* TESTS */
  .test-block{
    background:var(--paper); border:1px solid var(--line);
    border-radius:20px; padding:32px;
    margin-bottom:16px;
    transition:box-shadow .3s var(--ease), border-color .3s var(--ease);
  }
  .test-block:hover{ border-color:var(--sand); box-shadow:0 12px 32px -18px rgba(43,27,16,0.25); }

  .test-current{ border-color:var(--caramel); border-width:1.5px; }

  .test-header{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    cursor:pointer; user-select:none;
  }
  .test-header-left{ display:flex; flex-direction:column; gap:4px; }
  .test-date{
    font-family:'Fraunces', serif; font-size:18px;
    color:var(--espresso); font-weight:600;
  }
  .test-summary-line{ font-size:13px; color:var(--text-muted); }
  .test-toggle{
    font-size:20px; color:var(--text-muted);
    transition:transform .4s var(--ease);
    flex-shrink:0;
  }
  .test-block.open .test-toggle{ transform:rotate(180deg); }

  .test-body{
    max-height:0; overflow:hidden;
    opacity:0;
    transition:max-height .6s var(--ease), opacity .4s var(--ease), padding .4s var(--ease);
  }
  .test-block.open .test-body{
    max-height:8000px; opacity:1;
    padding-top:24px;
  }

  .category-mini{ margin-bottom:24px; }
  .category-mini:last-child{ margin-bottom:0; }
  .category-title-mini{
    display:flex; align-items:center; gap:10px;
    font-family:'Fraunces', serif; font-size:18px;
    color:var(--espresso); margin-bottom:12px;
  }
  .uni-list-mini{ display:flex; flex-direction:column; gap:8px; }
  .uni-mini{
    background:var(--cream); border:1px solid transparent;
    border-radius:10px; padding:12px 16px;
    transition:border-color .2s var(--ease), transform .2s var(--ease);
  }
  .uni-mini:hover{ border-color:var(--sand); transform:translateX(3px); }
  .uni-mini-name{ font-weight:600; font-size:14px; color:var(--espresso); margin-bottom:2px; }
  .uni-mini-country{ font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .uni-mini-reason{ font-size:13px; color:var(--text-main); opacity:0.85; line-height:1.55; }

  .empty-mini{
    padding:14px; background:var(--cream); border-radius:8px;
    font-size:13px; color:var(--text-muted); text-align:center; font-style:italic;
  }

  @media (max-width: 700px){
    nav.wrap{ height:72px; padding:0 18px; }
    .nav-links{ display:none; }
    .logo{ font-size:21px; gap:9px; }
    .logo svg{ width:30px; height:30px; }
    main{ padding:32px 18px 64px; }
    .profile-greeting h1{ font-size:28px; }
    .saved-grid{ grid-template-columns:1fr; }
    .section-title{ font-size:20px; }
    .test-block{ padding:22px; }
  }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="#5A3B26" stroke-width="2"/>
        <path d="M27 13 L18 18 L13 27 L22 22 Z" fill="#C79256"/>
        <circle cx="20" cy="20" r="2.4" fill="#2B1B10"/>
      </svg>
      EduPath
    </a>
    <div class="nav-links">
      <a href="index.html">Главная</a>
      <a href="universities.html">Университеты</a>
      <a href="profile.html" class="active">Профиль</a>
    </div>
    <div class="nav-right">
      <a href="#" class="btn-login">Войти</a>
      <button type="button" class="icon-btn" aria-label="Поиск">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="19" height="19"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
    </div>
  </nav>
</header>

<main id="mainContent"></main>

<script src="auth.js"></script>
<script>
// ============================================================
// РЕНДЕР СТРАНИЦЫ ПРОФИЛЯ
// ============================================================

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function formatDate(iso) {
  const d = new Date(iso);
  const months = ["января", "февраля", "марта", "апреля", "мая", "июня",
                  "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  return d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear() + ", " +
         String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function renderNotLoggedIn() {
  return `
    <div class="auth-required">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      <h2>Сначала войди в аккаунт</h2>
      <p>Чтобы сохранять университеты и видеть результаты тестов — создай аккаунт или войди.</p>
      <button class="btn-primary" data-auth-open="register">
        <span>Создать аккаунт</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  `;
}

function renderSavedUniversities(saved) {
  if (saved.length === 0) {
    return `
      <div class="empty-state">
        Ты пока не сохранил ни одного университета.<br>
        Зайди в <a href="universities.html">каталог</a> и нажми на звёздочку рядом с вузом.
      </div>
    `;
  }

  return `
    <div class="saved-grid">
      ${saved.map(u => `
        <div class="saved-card" data-saved-name="${escapeHtml(u.name)}">
          <div class="saved-info">
            <div class="saved-name">${escapeHtml(u.name)}</div>
            <div class="saved-location">${escapeHtml(u.country || "")}${u.city ? " · " + escapeHtml(u.city) : ""}</div>
          </div>
          <button class="saved-remove" type="button" title="Убрать" data-remove-saved="${escapeHtml(u.name)}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      `).join("")}
    </div>
  `;
}

function renderTests(tests) {
  if (tests.length === 0) {
    return `
      <div class="empty-state">
        Ты пока не проходил тест.<br>
        <a href="test.html">Пройти тест на подбор университета →</a>
      </div>
    `;
  }

  return tests.map((t, idx) => {
    const isFirst = idx === 0;
    const openClass = isFirst ? "open" : "";
    const currentClass = isFirst ? "test-current" : "";

    const cats = t.categories || {};
    const catDefs = [
      { key: "academic",  icon: "🎓", title: "По учебным показателям" },
      { key: "lifestyle", icon: "🌍", title: "По желанию жить" },
      { key: "safe",      icon: "🎯", title: "Куда шанс высокий" },
      { key: "reach",     icon: "💪", title: "Куда мог бы, но не дотягиваешь" }
    ];

    let totalUnis = 0;
    catDefs.forEach(c => { totalUnis += (cats[c.key] || []).length; });

    const bodyHtml = catDefs.map(c => {
      const list = cats[c.key] || [];
      let listHtml;
      if (list.length === 0) {
        listHtml = `<div class="empty-mini">Ничего не подошло в этой категории</div>`;
      } else {
        listHtml = `<div class="uni-list-mini">` + list.map(u => `
          <div class="uni-mini">
            <div class="uni-mini-name">${escapeHtml(u.name || "—")}</div>
            <div class="uni-mini-country">${escapeHtml(u.country || "")}</div>
            <div class="uni-mini-reason">${escapeHtml(u.reason || "")}</div>
          </div>
        `).join("") + `</div>`;
      }
      return `
        <div class="category-mini">
          <div class="category-title-mini">${c.icon} ${c.title}</div>
          ${listHtml}
        </div>
      `;
    }).join("");

    return `
      <div class="test-block ${openClass} ${currentClass}" data-test-idx="${idx}">
        <div class="test-header" data-toggle-test>
          <div class="test-header-left">
            <div class="test-date">${isFirst ? "Последний тест" : "Тест"} · ${formatDate(t.date)}</div>
            <div class="test-summary-line">Найдено ${totalUnis} университетов</div>
          </div>
          <div class="test-toggle">▾</div>
        </div>
        <div class="test-body">
          ${bodyHtml}
          ${t.summary ? `<div class="empty-mini" style="margin-top:20px; font-style:normal;">${escapeHtml(t.summary)}</div>` : ""}
        </div>
      </div>
    `;
  }).join("");
}

function renderProfile() {
  const user = window.EduAuth.getCurrentUser();
  const main = document.getElementById("mainContent");

  if (!user) {
    main.innerHTML = renderNotLoggedIn();
    return;
  }

  const saved = window.EduAuth.getSaved();
  const tests = window.EduAuth.getTests();

  main.innerHTML = `
    <div class="profile-head">
      <div class="profile-greeting">
        <h1>Привет, <em>${escapeHtml(user.name.split(" ")[0])}</em></h1>
        <div class="profile-email">${escapeHtml(user.email)}</div>
      </div>
      <button class="btn-logout" data-auth-logout>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span>Выйти</span>
      </button>
    </div>

    <section class="section">
      <h2 class="section-title">⭐ Понравившиеся университеты</h2>
      <p class="section-sub">Те, которые ты отметил звёздочкой в каталоге</p>
      ${renderSavedUniversities(saved)}
    </section>

    <section class="section">
      <h2 class="section-title">🎯 Результаты теста</h2>
      <p class="section-sub">Университеты, которые ИИ подобрал по твоим ответам</p>
      ${renderTests(tests)}
    </section>
  `;
}

// Обработка кликов
document.addEventListener("click", (e) => {
  // Удаление сохранённого вуза
  const removeBtn = e.target.closest("[data-remove-saved]");
  if (removeBtn) {
    e.stopPropagation();
    const name = removeBtn.dataset.removeSaved;
    const saved = window.EduAuth.getSaved();
    const uni = saved.find(u => u.name === name);
    if (uni) {
      window.EduAuth.toggleSave({ name: uni.name, country: uni.country, city: uni.city });
      window.EduAuth.showToast("Университет убран из избранного", "info");
      renderProfile();
    }
    return;
  }

  // Разворачивание теста
  const testHeader = e.target.closest("[data-toggle-test]");
  if (testHeader) {
    const block = testHeader.closest(".test-block");
    if (block) block.classList.toggle("open");
  }
});

// Первый рендер
renderProfile();

// Обновление, если пользователь только что вошёл/вышел
window.addEventListener("storage", renderProfile);
</script>
</body>
</html>
