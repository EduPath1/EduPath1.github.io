<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPath — Fun Zone 🧠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7EFE1; --cream-deep:#EFE1C6; --paper:#FBF6EC;
    --espresso:#2B1B10; --bark:#5A3B26; --clay:#8C5A34;
    --caramel:#C79256; --sand:#D9BD93;
    --text-main:#2B1B10; --text-muted:#7A6552;
    --line:rgba(43,27,16,0.14);
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
    --neon:#E63946;
    --gold:#FFD700;
    --green:#27AE60;
    --blue:#4A7FE6;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Work Sans', sans-serif; background:var(--cream); color:var(--text-main); line-height:1.5; min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  h1,h2,h3,h4{ font-family:'Fraunces', serif; font-weight:600; letter-spacing:-0.01em; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }

  header{ background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:100; }
  nav.wrap{ display:flex; align-items:center; justify-content:space-between; height:84px; max-width:1300px; margin:0 auto; padding:0 32px; position:relative; }
  .logo{ display:flex; align-items:center; gap:12px; font-family:'Fraunces', serif; font-weight:600; font-size:26px; color:var(--espresso); }
  .logo svg{ width:38px; height:38px; flex-shrink:0; }
  .nav-links{ display:flex; align-items:center; gap:8px; }
  .nav-links a{ font-size:15px; color:var(--text-muted); padding:10px 18px; border-radius:8px; transition:background .25s var(--ease), color .25s var(--ease); }
  .nav-links a:hover{ color:var(--espresso); background:var(--cream-deep); }
  .nav-links a.active{ background:var(--espresso); color:var(--paper); }
  .nav-right{ display:flex; align-items:center; gap:14px; }
  .btn-login{ background:var(--clay); color:var(--paper); padding:10px 22px; border-radius:20px; font-size:14px; font-weight:500; }
  .icon-btn{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); border-radius:50%; }
  .lang-dropdown{ position:relative; }
  .lang-menu{ position:absolute; top:calc(100% + 10px); right:0; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:6px; min-width:150px; box-shadow:0 16px 32px -14px rgba(43,27,16,0.3); opacity:0; visibility:hidden; transform:translateY(-6px); transition:opacity .15s, transform .15s, visibility .15s; z-index:30; }
  .lang-menu.open{ opacity:1; visibility:visible; transform:translateY(0); }
  .lang-option{ display:block; width:100%; text-align:left; background:none; padding:10px 12px; font-size:14px; color:var(--text-muted); border-radius:8px; }
  .lang-option:hover{ background:var(--cream-deep); color:var(--espresso); }
  .lang-option.active{ background:var(--cream-deep); color:var(--espresso); font-weight:600; }

  .fz-hero{
    position:relative; text-align:center; padding:64px 24px 32px;
    background:
      radial-gradient(circle at 15% 20%, rgba(199,146,86,0.25), transparent 45%),
      radial-gradient(circle at 85% 30%, rgba(230,57,70,0.18), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(140,90,52,0.22), transparent 55%),
      var(--cream);
    overflow:hidden;
  }
  .fz-hero::before, .fz-hero::after{
    content:"🧠"; position:absolute; font-size:64px; opacity:0.18; pointer-events:none;
    animation: floaty 6s ease-in-out infinite;
  }
  .fz-hero::before{ top:14%; left:6%; }
  .fz-hero::after{ bottom:8%; right:8%; animation-delay:1.5s; content:"💀"; }
  @keyframes floaty{ 0%,100%{ transform:translateY(0) rotate(-6deg);} 50%{ transform:translateY(-16px) rotate(6deg);} }

  .fz-badge{
    display:inline-block; font-family:'Work Sans', sans-serif;
    font-weight:900; font-size:12px; letter-spacing:0.25em;
    padding:8px 16px; border-radius:999px;
    background:var(--espresso); color:var(--paper);
    margin-bottom:20px; transform: rotate(-2deg);
    box-shadow: 0 8px 20px -12px rgba(43,27,16,0.5);
  }
  .fz-title{
    font-size: clamp(48px, 10vw, 100px);
    font-weight:900; line-height:0.9; letter-spacing:-0.04em;
    background: linear-gradient(135deg, var(--espresso) 0%, var(--clay) 50%, var(--neon) 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:20px; text-transform:uppercase;
    animation: titleWobble 6s ease-in-out infinite;
  }
  @keyframes titleWobble{ 0%,100%{ transform:rotate(-1deg);} 50%{ transform:rotate(1deg);} }

  .fz-sub{ max-width: 640px; margin: 0 auto 12px; font-size: 16px; color: var(--bark); line-height: 1.6; }
  .fz-sub-small{ max-width: 640px; margin: 0 auto; font-size: 14px; color: var(--text-muted); line-height: 1.6; font-style: italic; }

  main{ max-width:1300px; margin:0 auto; padding:24px 24px 96px; }

  .fz-dash-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap:16px;
  }
  .fz-card{
    background: var(--paper); border:1px solid var(--line);
    border-radius:20px; padding:22px 20px; cursor:pointer;
    position:relative; overflow:hidden;
    transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
    display:flex; flex-direction:column; min-height:150px;
  }
  .fz-card:hover{
    transform:translateY(-6px); border-color:var(--caramel);
    box-shadow: 0 20px 40px -24px rgba(43,27,16,0.35);
  }
  .fz-card-icon{ font-size:36px; margin-bottom:12px; display:block; filter: drop-shadow(0 4px 6px rgba(43,27,16,0.15)); }
  .fz-card-title{ font-family:'Fraunces', serif; font-weight:700; font-size:18px; color:var(--espresso); margin-bottom:6px; line-height:1.25; }
  .fz-card-desc{ font-size:13px; color:var(--text-muted); line-height:1.4; margin-bottom:auto; }
  .fz-card-open{ margin-top:14px; font-size:12px; font-weight:700; letter-spacing:0.1em; color:var(--clay); text-transform:uppercase; display:flex; align-items:center; gap:6px; }
  .fz-card:hover .fz-card-open{ color:var(--neon); }

  .fz-modal-overlay{
    position: fixed; inset: 0;
    background: rgba(43,27,16,0.6); backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    z-index: 9000;
    opacity: 0; visibility: hidden;
    transition: opacity .3s var(--ease), visibility .3s var(--ease);
    padding: 20px; overflow-y: auto;
  }
  .fz-modal-overlay.open{ opacity:1; visibility:visible; }
  .fz-modal{
    background: var(--paper); border-radius: 24px;
    width: 100%; max-width: 640px;
    max-height: calc(100vh - 40px); overflow-y: auto;
    padding: 36px 32px 32px; position: relative;
    box-shadow: 0 40px 80px -32px rgba(43,27,16,0.5);
    transform: translateY(20px) scale(0.98);
    transition: transform .35s var(--ease);
  }
  .fz-modal-overlay.open .fz-modal{ transform: translateY(0) scale(1); }
  .fz-modal-close{
    position:absolute; top:16px; right:16px;
    width:38px; height:38px; border-radius:50%;
    background: transparent; color: var(--text-muted);
    font-size: 24px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition: background .2s;
  }
  .fz-modal-close:hover{ background: var(--cream-deep); color: var(--espresso); }
  .fz-modal-head{ display:flex; align-items:center; gap:14px; margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid var(--line); }
  .fz-modal-head-icon{ font-size:32px; flex-shrink:0; }
  .fz-modal-head-text{ flex:1; }
  .fz-modal-title{ font-family:'Fraunces', serif; font-size:24px; font-weight:700; color: var(--espresso); line-height:1.2; }
  .fz-modal-sub{ font-size:13px; color: var(--text-muted); margin-top:4px; }

  .fz-grid-2{ display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; margin-bottom:18px; }
  .fz-field label{ display:block; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color: var(--text-muted); margin-bottom:6px; }
  .fz-field input, .fz-field select{
    width:100%; padding:12px 14px; font-family:inherit; font-size:15px;
    background: var(--cream); color: var(--text-main);
    border:1.5px solid transparent; border-radius:10px;
    transition: border-color .25s var(--ease), background .25s var(--ease);
  }
  .fz-field input:focus, .fz-field select:focus{ outline:none; border-color: var(--clay); background: var(--paper); }

  .fz-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    background: var(--espresso); color: var(--paper);
    padding:14px 24px; border-radius:12px;
    font-size:14px; font-weight:700; letter-spacing:0.02em;
    transition: transform .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
    width: 100%; margin-top: 8px;
  }
  .fz-btn:hover{ transform:translateY(-2px); background: var(--bark); box-shadow: 0 14px 28px -14px rgba(43,27,16,0.5); }
  .fz-btn:active{ transform:translateY(0); }
  .fz-btn.accent{ background: var(--neon); }
  .fz-btn.accent:hover{ background:#C22531; }
  .fz-btn.ghost{ background: var(--cream-deep); color: var(--espresso); }
  .fz-btn.ghost:hover{ background: var(--sand); }
  .fz-btn.gold{ background: var(--caramel); color: var(--espresso); }
  .fz-btn.gold:hover{ background: #B07E3E; }

  .fz-inline-btns{ display:flex; gap:10px; margin-top:10px; }
  .fz-inline-btns .fz-btn{ flex:1; }

  .fz-result{
    margin-top:22px; padding:24px 20px;
    background: var(--cream); border-radius:16px;
    border:2px dashed var(--caramel);
    display:none; text-align:center;
    animation: popIn .5s var(--ease);
  }
  .fz-result.show{ display:block; }
  @keyframes popIn{ 0%{ transform:scale(0.92); opacity:0;} 60%{ transform:scale(1.03);} 100%{ transform:scale(1); opacity:1;} }

  .fz-big-number{
    font-family:'Fraunces', serif; font-weight:900;
    font-size: clamp(44px, 8vw, 72px);
    line-height:1; color: var(--espresso);
    letter-spacing: -0.03em; margin: 8px 0 14px;
  }
  .fz-big-number .unit{ font-size:0.35em; color: var(--clay); margin-left:8px; }

  .fz-meme-phrase{
    font-family:'Fraunces', serif; font-style: italic;
    font-size: clamp(16px, 2.4vw, 20px);
    color: var(--bark); line-height:1.4;
  }

  .fz-label-mini{
    font-size:11px; font-weight:900; letter-spacing:0.25em;
    color: var(--clay); text-transform: uppercase; margin-bottom:6px;
  }

  .fz-stat-row{
    display:flex; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;
  }
  .fz-stat-row:last-child{ border-bottom: none; }
  .fz-stat-row .label{ color: var(--text-muted); font-weight:500; }
  .fz-stat-row .value{ font-weight:700; color: var(--espresso); }

  .fz-bar{ height: 12px; background: var(--cream-deep); border-radius: 6px; overflow:hidden; margin-top: 6px; }
  .fz-bar-fill{ height:100%; background: linear-gradient(90deg, var(--caramel), var(--clay)); border-radius: 6px; transition: width .8s var(--ease); width: 0; }

  .fz-roulette-stage{
    text-align:center; padding: 28px 16px;
    background: radial-gradient(circle at 50% 50%, rgba(199,146,86,0.18), transparent 65%), var(--cream);
    border-radius: 16px; margin-bottom: 14px;
  }
  .fz-roulette-display{
    font-family:'Fraunces', serif; font-weight: 900;
    font-size: clamp(22px, 4.5vw, 40px);
    color: var(--espresso); min-height: 1.2em;
    line-height: 1.1; letter-spacing: -0.02em;
    text-align:center; margin: 8px 0;
  }
  .fz-roulette-display.spinning{ animation: shakeRoulette 0.12s infinite; }
  @keyframes shakeRoulette{
    0%{ transform:translate(0,0) rotate(0deg);}
    25%{ transform:translate(-2px,1px) rotate(-0.5deg);}
    50%{ transform:translate(2px,-1px) rotate(0.5deg);}
    75%{ transform:translate(-1px,2px) rotate(-0.4deg);}
    100%{ transform:translate(1px,-2px) rotate(0.4deg);}
  }
  .fz-roulette-flag{ font-size: 44px; }

  .fz-battle-table{ width:100%; border-collapse: separate; border-spacing: 0 6px; margin: 14px 0; font-size: 14px; }
  .fz-battle-table th, .fz-battle-table td{ padding:10px 12px; text-align:left; }
  .fz-battle-table th{ font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
  .fz-battle-table td{ background: var(--cream); font-weight:600; color: var(--espresso); }
  .fz-battle-table tr td:first-child{ border-radius: 10px 0 0 10px; color: var(--text-muted); font-weight:500; }
  .fz-battle-table tr td:last-child{ border-radius: 0 10px 10px 0; }
  .fz-battle-table td.winner{ color: var(--clay); font-weight: 900; background: linear-gradient(90deg, var(--cream), var(--cream-deep)); }
  .fz-battle-table td.loser{ opacity: 0.6; }

  .fz-achievement-popup{
    position: fixed; top: 100px; right: 24px;
    background: linear-gradient(135deg, var(--caramel), var(--clay));
    color: var(--paper); padding: 16px 22px;
    border-radius: 14px;
    box-shadow: 0 20px 40px -20px rgba(140,90,52,0.6);
    z-index: 9999; display: flex; align-items:center; gap:14px;
    transform: translateX(120%);
    transition: transform .5s var(--ease);
    max-width: 320px;
  }
  .fz-achievement-popup.show{ transform: translateX(0); }
  .fz-achievement-popup-icon{ font-size: 28px; flex-shrink:0; }
  .fz-achievement-popup-title{ font-weight:700; font-size:14px; }
  .fz-achievement-popup-desc{ font-size:12px; opacity:0.9; margin-top:2px; }

  .fz-ach-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:12px; margin-top: 16px; }
  .fz-ach{ padding: 16px 14px; background: var(--cream); border: 1.5px solid var(--line); border-radius: 14px; text-align: center; opacity: 0.4; transition: all .3s var(--ease); }
  .fz-ach.unlocked{
    opacity:1; border-color: var(--caramel);
    background: linear-gradient(135deg, var(--cream-deep), var(--paper));
    box-shadow: 0 12px 24px -16px rgba(199,146,86,0.5);
  }
  .fz-ach-icon{ font-size: 28px; margin-bottom:6px; }
  .fz-ach-name{ font-size: 12px; font-weight:700; color: var(--espresso); line-height:1.2; }
  .fz-ach-desc{ font-size: 11px; color: var(--text-muted); margin-top:4px; line-height:1.3; }

  .fz-gacha-result{ display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
  .fz-gacha-card{ padding: 14px 12px; border-radius: 12px; text-align: center; font-size: 13px; animation: gachaPop .5s var(--ease); color: var(--espresso); }
  @keyframes gachaPop{ 0%{ transform: scale(0.3) rotate(-10deg); opacity:0; } 60%{ transform: scale(1.1) rotate(2deg);} 100%{ transform: scale(1) rotate(0); opacity:1; } }
  .fz-gacha-card.common{    background: linear-gradient(135deg, #D9BD93, #BEA06F); }
  .fz-gacha-card.rare{      background: linear-gradient(135deg, #88B7F0, #4A7FE6); color: #fff; }
  .fz-gacha-card.epic{      background: linear-gradient(135deg, #B87FE6, #7C3ACD); color: #fff; }
  .fz-gacha-card.legendary{ background: linear-gradient(135deg, #FFD700, #E8A100); color: #2B1B10; }
  .fz-gacha-card.mythic{    background: linear-gradient(135deg, #E63946, #2B1B10); color: #fff; }
  .fz-gacha-rarity{ font-size: 10px; font-weight: 900; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.85; margin-bottom: 6px; }
  .fz-gacha-name{ font-weight: 700; font-size: 12px; line-height: 1.3; }

  .fz-wallet-hp{ display: flex; align-items:center; gap: 4px; margin: 16px 0; justify-content: center; flex-wrap: wrap; }
  .fz-hp-heart{ font-size: 24px; transition: all .5s var(--ease); }
  .fz-hp-heart.lost{ opacity: 0.2; filter: grayscale(100%); transform: scale(0.85); }

  .fz-brain-stage{ display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px 0; min-height: 240px; }
  .fz-brain-cell{
    background: var(--cream); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-family:'Fraunces', serif;
    cursor: pointer; transition: all .2s var(--ease);
    padding: 6px; text-align: center; line-height: 1.1; min-height: 60px;
  }
  .fz-brain-cell:hover{ background: var(--cream-deep); transform: scale(1.05); }
  .fz-brain-cell.correct{ background: var(--green); color: white; }
  .fz-brain-cell.wrong{ background: var(--neon); color: white; animation: shakeWrong .4s; }
  @keyframes shakeWrong{ 0%,100%{ transform: translateX(0); } 25%{ transform: translateX(-4px); } 75%{ transform: translateX(4px); } }

  .fz-boss-hp{ display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; margin: 14px 0; }
  .fz-boss-hp-heart{ font-size: 22px; transition: opacity .4s var(--ease); }
  .fz-boss-hp-heart.lost{ opacity: 0.15; }
  .fz-boss-buttons{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }

  .fz-nuclear-btn{
    display:block; margin: 0 auto; padding: 20px 40px;
    background: var(--neon); color: var(--paper);
    font-weight:900; font-size: 20px; letter-spacing: 0.15em;
    border-radius: 14px;
    transition: all .25s var(--ease);
    animation: nukePulse 2s infinite;
  }
  @keyframes nukePulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(230,57,70,0.7); }
    50%{ box-shadow: 0 0 0 20px rgba(230,57,70,0); }
  }
  .fz-nuclear-btn:hover{ background:#C22531; transform: scale(1.05); }

  .fz-stock-chart{ position: relative; height: 140px; background: var(--cream); border-radius: 12px; overflow: hidden; margin: 14px 0; }
  .fz-stock-chart svg{ width: 100%; height: 100%; }
  .fz-stock-line{ fill: none; stroke: var(--green); stroke-width: 2; transition: all .6s var(--ease); }

  .fz-mono{
    font-family: 'Courier New', monospace;
    font-size: 13px; background: var(--cream);
    padding: 14px 16px; border-radius: 10px;
    color: var(--espresso); line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }

  @media (max-width:900px){ .nav-links{ display:none !important; } }
  @media (max-width:640px){
    nav.wrap{ height: 72px; padding: 0 18px; }
    .logo{ font-size: 21px; gap: 9px; }
    .logo svg{ width: 30px; height: 30px; }
    main{ padding: 16px 16px 64px; }
    .fz-modal{ padding: 28px 22px 22px; border-radius: 18px; }
    .fz-modal-title{ font-size: 20px; }
    .fz-grid-2{ grid-template-columns: 1fr; }
    .fz-brain-stage{ grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="#5A3B26" stroke-width="2"/>
        <path d="M27 13 L18 18 L13 27 L22 22 Z" fill="#C79256"/>
        <circle cx="20" cy="20" r="2.4" fill="#2B1B10"/>
      </svg>
      EduPath
    </a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav_home">Главная</a>
      <a href="universities.html" data-i18n="nav_universities">Университеты</a>
      <a href="profile.html" data-i18n="nav_profile">Профиль</a>
      <a href="fanzone.html" class="active" data-i18n="nav_fanzone">🤡 Fun Zone</a>
    </div>
    <div class="nav-right">
      <div class="lang-dropdown">
        <button type="button" class="icon-btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Language">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="19" height="19"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.7 4 6 4 9.5s-1.4 6.8-4 9.5c-2.6-2.7-4-6-4-9.5s1.4-6.8 4-9.5z"/></svg>
        </button>
        <div class="lang-menu" id="langMenu" role="menu">

function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function randFloat(min, max){ return Math.random() * (max - min) + min; }
function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function $(sel, root){ return (root || document).querySelector(sel); }
function $$(sel, root){ return Array.from((root || document).querySelectorAll(sel)); }

    const study = parseFloat($("#aStudy").value) || 0;
    const sleep = parseFloat($("#aSleep").value) || 0;
    let base = gpa*500000 + sat*1500 + ielts*200000 + Math.max(0, 8-sleep)*40000 + study*90000 + Math.random()*500000;

  "You are now a programmer. Welcome to hell.",

let _futureInterval = null;

function openFuture(){
  openModal(modalHead("🎰", "fz2_future_title", "fz2_future_sub")
    + `
    <div class="fz-roulette-stage">
      <div class="fz-roulette-flag" id="fFlag">🎰</div>

  `);
  const spin = () => {
    const disp = $("#fDisp");
    const msg = $("#fMsg");
    const btn = $("#fBtn");
    const again = $("#fAgain");
    btn.style.display = "none";
    again.style.display = "none";
    msg.textContent = "";

    clearInterval(_futureInterval);

      disp.textContent = pick(UNIVERSITIES);

      if(ticks >= total){
        clearInterval(_futureInterval);
        disp.classList.remove("spinning");
        disp.textContent = pick(UNIVERSITIES);
        msg.textContent = pick(FUTURE_MESSAGES);
        again.style.display = "inline-flex";
        unlockAchievement("future");
      }
    }, 70);
  };

  $("#fAgain").addEventListener("click", spin);
}

// 3. BATTLE
// ============================================================
const BATTLE_CATS = [
  "fz2_bcat_aura","fz2_bcat_drip","fz2_bcat_parent","fz2_bcat_suffering","fz2_bcat_sleep",
  "fz2_bcat_mc","fz2_bcat_scholarship","fz2_bcat_npc","fz2_bcat_social","fz2_bcat_coffee"
];
const BATTLE_REASONS = [
  "bro needs scholarship 💀",
  "aura decides everything.",
  "mom approved this one.",
  "NPC level too high.",
  "sleep is a luxury.",
  "drip is undefeated.",
  "main character energy off the charts.",
  "academic suffering is the base.",
  "coffee intake beyond legal limits.",
  "social life detected. suspicious.",
];

function openBattle(){
  const opts = UNIVERSITIES.map(u => `<option value="${u}">${u}</option>`).join("");
  openModal(modalHead("⚔️", "fz2_battle_title", "fz2_battle_sub")
    + `
    <div class="fz-grid-2">
      <div class="fz-field"><label>${t("fz2_battle_pick1","Fighter 1")}</label><select id="bA">${opts}</select></div>
      <div class="fz-field"><label>${t("fz2_battle_pick2","Fighter 2")}</label><select id="bB">${opts}</select></div>
    </div>
    <div class="fz-inline-btns">
      <button class="fz-btn" id="bGo">⚔️ ${t("fz2_battle_go","FIGHT")}</button>
      <button class="fz-btn ghost" id="bRand">🎲 ${t("fz2_battle_random","Random pair")}</button>
    </div>
    <div id="bRes" style="margin-top:16px;"></div>
  `);
  $("#bGo").addEventListener("click", () => {
    const a = $("#bA").value, b = $("#bB").value;
    if(a === b) return;
    renderBattle(a, b);
    unlockAchievement("battle");
  });
  $("#bRand").addEventListener("click", () => {
    let a = pick(UNIVERSITIES), b = pick(UNIVERSITIES);
    while(b === a) b = pick(UNIVERSITIES);
    $("#bA").value = a; $("#bB").value = b;
    renderBattle(a, b);
    unlockAchievement("battle");
  });
}

function renderBattle(a, b){
  const stats = {};
  BATTLE_CATS.forEach(c => { stats[c] = { a: randInt(20, 100), b: randInt(20, 100) }; });
  let aScore = 0, bScore = 0;
  BATTLE_CATS.forEach(c => {
    if(c === "fz2_bcat_suffering"){
      if(stats[c].a < stats[c].b) aScore++; else bScore++;
    } else {
      if(stats[c].a > stats[c].b) aScore++; else bScore++;
    }
  });
  const winner = aScore >= bScore ? a : b;
  const reason = pick(BATTLE_REASONS);

  const rows = BATTLE_CATS.map(c => {
    const s = stats[c];
    let aCls = "", bCls = "";
    if(c === "fz2_bcat_suffering"){
      if(s.a < s.b){ aCls = "winner"; bCls = "loser"; } else if(s.b < s.a){ bCls = "winner"; aCls = "loser"; }
    } else {
      if(s.a > s.b){ aCls = "winner"; bCls = "loser"; } else if(s.b > s.a){ bCls = "winner"; aCls = "loser"; }
    }
    return `<tr><td>${t(c, c)}</td><td class="${aCls}">${s.a}</td><td class="${bCls}">${s.b}</td></tr>`;
  }).join("");

  $("#bRes").innerHTML = `
    <table class="fz-battle-table">
      <thead><tr><th></th><th>${a}</th><th>${b}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="text-align:center; padding:20px; background:var(--cream); border-radius:14px; border:2px solid var(--caramel); margin-top:14px;">
      <div style="font-size:36px;">🏆</div>
      <div style="font-family:'Fraunces',serif; font-size:24px; font-weight:900; color:var(--espresso); margin:8px 0;">${t("fz2_battle_winner","WINNER")}: ${escapeHtml(winner)}</div>
      <div style="font-style:italic; color:var(--bark); font-size:15px;">${t("fz2_battle_reason","Reason")}: ${escapeHtml(reason)}</div>
    </div>
  `;
}

function rollGacha(){
  const r = Math.random();
  if(r < 0.6){
    return { rarity: "common", name: pick(["Local Polytechnic","Municipal College","Regional Institute","Community University"]) };
  } else if(r < 0.85){
    return { rarity: "rare", name: pick(["State Tech","University of Somewhere","Mid-tier Institute","Honestly Decent University"]) };
  } else if(r < 0.95){
    return { rarity: "epic", name: pick(["Top 200 University","Solid Research University","Well Known Institute","Ranked Something University"]) };
  } else if(r < 0.99){
    return { rarity: "legendary", name: pick(["MIT","Oxford","Stanford","Cambridge","Harvard","ETH Zurich","Tsinghua"]) };
  } else {
    return { rarity: "mythic", name: "University of Almaty International Quantum Business Engineering 💀" };
  }
}
function openGacha(){
  openModal(modalHead("🎲", "fz2_gacha_title", "fz2_gacha_sub")
    + `
    <button class="fz-btn accent" id="g1">${t("fz2_gacha_pull1","PULL ×1")}</button>
    <button class="fz-btn" id="g10" style="margin-top:8px;">${t("fz2_gacha_pull10","PULL ×10")}</button>
    <div class="fz-gacha-result" id="gRes"></div>
  `);
  function showPulls(n){
    const container = $("#gRes");
    container.innerHTML = "";
    for(let i = 0; i < n; i++){
      const res = rollGacha();
      const div = document.createElement("div");
      div.className = "fz-gacha-card " + res.rarity;
      const rarityLabel = t("fz2_rarity_" + res.rarity, res.rarity);
      div.innerHTML = `<div class="fz-gacha-rarity">${rarityLabel}</div><div class="fz-gacha-name">${escapeHtml(res.name)}</div>`;
      container.appendChild(div);
      if(res.rarity === "mythic") unlockAchievement("gacha_mythic");
    }
    unlockAchievement("gacha_1");
    if(n >= 10) unlockAchievement("gacha_10");
  }
  $("#g1").addEventListener("click", () => showPulls(1));
  $("#g10").addEventListener("click", () => showPulls(10));
}

let _brainScore = 0, _brainTotal = 0, _brainTarget = "";
function openBrain(){
  openModal(modalHead("🧠", "fz2_brain_title", "fz2_brain_sub")
    + `
    <div class="fz-field" style="margin-bottom:14px;">
      <label>${t("fz2_brain_target","Target")}</label>
      <div class="fz-big-number" id="brTarget" style="font-size:36px; text-align:center;">?</div>
    </div>
    <div class="fz-brain-stage" id="brStage"></div>
    <div style="text-align:center; font-size:14px; color:var(--text-muted);" id="brScore"></div>
    <button class="fz-btn accent" id="brBtn" style="margin-top:12px;">🧠 ${t("fz2_brain_start","START")}</button>
  `);
  const targets = ["42","1999","MIT","Oxford","A","3.14","🚀","👽","XYZ","Nobel","π","💀"];
  let roundsLeft = 0;
  function newRound(){
    if(roundsLeft <= 0){
      const pct = _brainTotal > 0 ? Math.round((_brainScore / _brainTotal) * 100) : 0;
      let msg = pct >= 80 ? "Enough RAM to open Bluebook." : (pct >= 50 ? "Running on 2 tabs." : "Windows has stopped responding.");
      $("#brStage").innerHTML = `<div style="grid-column: 1 / -1; text-align:center; padding:40px;">
        <div class="fz-label-mini">${t("fz2_brain_capacity","BRAIN CAPACITY")}</div>
        <div class="fz-big-number">${pct}%</div>
        <div class="fz-meme-phrase">${msg}</div>
      </div>`;
      $("#brBtn").textContent = "🧠 " + t("fz2_brain_again","TEST AGAIN");
      unlockAchievement("brain");
      return;
    }
    roundsLeft--;
    const stage = $("#brStage");
    stage.innerHTML = "";
    const options = [];
    for(let i = 0; i < 12; i++) options.push(pick(targets));
    _brainTarget = options[0];
    $("#brTarget").textContent = _brainTarget;
    const shuffled = options.sort(() => Math.random() - 0.5);
    shuffled.forEach(opt => {
      const cell = document.createElement("div");
      cell.className = "fz-brain-cell";
      cell.textContent = opt;
      cell.addEventListener("click", () => {
        if(opt === _brainTarget){ cell.classList.add("correct"); _brainScore++; }
        else { cell.classList.add("wrong"); }
        _brainTotal++;
        $("#brScore").textContent = t("fz2_brain_score","Score") + `: ${_brainScore} / ${_brainTotal}`;
        setTimeout(newRound, 400);
      });
      stage.appendChild(cell);
    });
  }
  $("#brBtn").addEventListener("click", () => {
    _brainScore = 0; _brainTotal = 0; roundsLeft = 5;
    $("#brBtn").textContent = "🧠 " + t("fz2_brain_restart","RESTART");
    newRound();
  });
}

    </div>

    <div class="fz-result" id="bossRes" style="margin-top:14px;"><div class="fz-meme-phrase" id="bossMsg"></div></div>
  `);
  let bossHp = 100, playerHp = 100;
  function render(){
    let hearts = "";
    for(let i = 0; i < 10; i++){
      hearts += `<span class="fz-boss-hp-heart ${i < Math.ceil(bossHp/10) ? "" : "lost"}">❤️</span>`;

    $("#bossHp").innerHTML = hearts;
    $("#playerHp").textContent = Math.max(0, playerHp);
    $("#deadlineHp").textContent = Math.max(0, bossHp);
  }
  render();
  $$("[data-boss]").forEach(btn => {
    btn.addEventListener("click", () => {
      const a = btn.dataset.boss;
      let msg = "";
      if(a === "study"){ bossHp -= 10; msg = "Deadline HP -10"; }
      else if(a === "sleep"){ playerHp += 20; msg = "Player HP +20. Deadline is annoyed."; }
      else if(a === "proc"){ bossHp += 5; msg = "Deadline HP +5. Why would you do this."; }
      else if(a === "panic"){ msg = "No effect. Deadline is confused but amused."; }
      $("#bossMsg").textContent = msg;
      render();
      if(bossHp <= 0){ $("#bossMsg").innerHTML = "👑 <b>" + t("fz2_boss_win","YOU DEFEATED THE APPLICATION DEADLINE") + "</b>"; unlockAchievement("boss_win"); $$("[data-boss]").forEach(b => b.disabled = true); }
      if(playerHp <= 0){ $("#bossMsg").innerHTML = "💀 <b>" + t("fz2_boss_lose","YOU GOT COOKED") + "</b>"; unlockAchievement("boss_lose"); $$("[data-boss]").forEach(b => b.disabled = true); }
    });
  });
}

  renderDashboard();
}

if(document.readyState !== "loading") initFZ();

window.addEventListener("edupath-lang-change", () => {
  renderDashboard();

  const overlay = document.getElementById("fzModal");
  if(overlay && overlay.classList.contains("open")) {
    closeModal();
  }
});
</script>
