<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPath — Universities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7EFE1; --cream-deep:#EFE1C6; --paper:#FBF6EC;
    --espresso:#2B1B10; --bark:#5A3B26; --clay:#8C5A34;
    --caramel:#C79256; --sand:#D9BD93;
    --text-main:#2B1B10; --text-muted:#7A6552;
    --line:rgba(43,27,16,0.14);
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Work Sans',sans-serif; background:var(--cream); color:var(--text-main); line-height:1.5; min-height:100vh; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }

  header{ background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:100; }
  nav.wrap{ display:flex; align-items:center; justify-content:space-between; height:84px; max-width:1400px; margin:0 auto; padding:0 32px; position:relative; }
  .logo{ display:flex; align-items:center; gap:12px; font-family:'Fraunces',serif; font-weight:600; font-size:26px; color:var(--espresso); }
  .logo svg{ width:38px; height:38px; flex-shrink:0; }
  .nav-links{ display:flex; align-items:center; gap:8px; }
  .nav-links a{ font-size:15px; color:var(--text-muted); padding:10px 18px; border-radius:8px; transition:background .25s var(--ease), color .25s var(--ease); }
  .nav-links a:hover{ color:var(--espresso); background:var(--cream-deep); }
  .nav-links a.active{ background:var(--espresso); color:var(--paper); }
  .nav-right{ display:flex; align-items:center; gap:14px; position:relative; }
  .btn-login{ background:var(--clay); color:var(--paper); padding:10px 22px; border-radius:20px; font-size:14px; font-weight:500; transition:background .3s var(--ease); }
  .btn-login:hover{ background:var(--bark); }
  .icon-btn{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); border-radius:50%; transition:background .3s var(--ease); }
  .icon-btn:hover{ background:var(--cream-deep); color:var(--espresso); }

  .lang-dropdown{ position:relative; }
  .lang-menu{ position:absolute; top:calc(100% + 10px); right:0; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:6px; min-width:150px; box-shadow:0 16px 32px -14px rgba(43,27,16,0.3); opacity:0; visibility:hidden; transform:translateY(-6px); transition:opacity .15s, transform .15s, visibility .15s; z-index:30; }
  .lang-menu.open{ opacity:1; visibility:visible; transform:translateY(0); }
  .lang-option{ display:block; width:100%; text-align:left; background:none; padding:10px 12px; font-size:14px; color:var(--text-muted); border-radius:8px; }
  .lang-option:hover{ background:var(--cream-deep); color:var(--espresso); }
  .lang-option.active{ background:var(--cream-deep); color:var(--espresso); font-weight:600; }

  .search-input{ display:block; position:absolute; top:48px; right:0; width:340px; padding:14px 18px; background:var(--paper); border:1px solid var(--line); border-radius:12px; font-size:15px; font-family:inherit; box-shadow:0 16px 32px -14px rgba(43,27,16,0.3); z-index:200; opacity:0; visibility:hidden; transform:translateY(-8px); transition:opacity .25s var(--ease), transform .25s var(--ease), visibility .25s; }
  .search-input.open{ opacity:1; visibility:visible; transform:translateY(0); }
  .search-results{ display:block; position:absolute; top:104px; right:0; width:340px; max-height:340px; overflow-y:auto; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:0 16px 32px -14px rgba(43,27,16,0.3); z-index:199; opacity:0; visibility:hidden; transform:translateY(-8px); transition:opacity .25s var(--ease), transform .25s var(--ease), visibility .25s; }
  .search-results.open{ opacity:1; visibility:visible; transform:translateY(0); }
  .search-result{ display:block; width:100%; text-align:left; padding:10px 14px; border-radius:8px; font-size:14px; cursor:pointer; transition:background .2s var(--ease); }
  .search-result:hover{ background:var(--cream-deep); }
  .search-result small{ color:var(--text-muted); display:block; font-size:12px; }
  .search-empty{ padding:14px; font-size:14px; color:var(--text-muted); text-align:center; }

  .layout{ display:grid; grid-template-columns:420px 1fr; gap:0; max-width:1400px; margin:0 auto; min-height:calc(100vh - 84px); }
  .sidebar{ background:var(--paper); border-right:1px solid var(--line); padding:32px 24px; overflow-y:auto; max-height:calc(100vh - 84px); position:sticky; top:84px; }
  .sidebar h2{ font-size:24px; margin-bottom:6px; }
  .sidebar .subtitle{ font-size:14px; color:var(--text-muted); margin-bottom:20px; }

  .filters-wrap{ position:relative; margin-bottom:18px; }
  .filters-btn{ display:flex; align-items:center; justify-content:space-between; width:100%; padding:12px 16px; background:var(--cream); border:1px solid transparent; border-radius:10px; font-size:14px; font-weight:500; color:var(--espresso); transition:background .25s var(--ease), border-color .25s var(--ease); }
  .filters-btn:hover{ background:var(--cream-deep); }
  .filters-btn.active{ border-color:var(--clay); background:var(--paper); }
  .filters-btn-left{ display:flex; align-items:center; gap:8px; }
  .filters-btn-badge{ display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 6px; background:var(--clay); color:var(--paper); border-radius:10px; font-size:11px; font-weight:600; }
  .filters-btn-arrow{ font-size:11px; color:var(--text-muted); transition:transform .3s var(--ease); }
  .filters-btn.active .filters-btn-arrow{ transform:rotate(180deg); }

  .filters-panel{ max-height:0; overflow:hidden; opacity:0; background:var(--paper); border:1px solid var(--line); border-radius:12px; margin-top:8px; transition:max-height .4s var(--ease), opacity .3s var(--ease), padding .4s var(--ease), margin-top .3s var(--ease); }
  .filters-panel.open{ max-height:600px; opacity:1; padding:18px; }
  .filter-group{ margin-bottom:16px; }
  .filter-group:last-of-type{ margin-bottom:0; }
  .filter-group label{ display:block; font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px; font-weight:600; }
  .filter-row{ display:flex; gap:8px; align-items:center; }
  .filter-row input{ flex:1; min-width:0; padding:10px 12px; font-family:inherit; font-size:14px; background:var(--cream); color:var(--text-main); border:1.5px solid var(--line); border-radius:8px; }
  .filter-row input:focus{ outline:none; border-color:var(--clay); background:var(--paper); }
  .filter-row span{ color:var(--text-muted); font-size:13px; }
  .filter-select{ width:100%; padding:10px 12px; font-family:inherit; font-size:14px; background:var(--cream); color:var(--text-main); border:1.5px solid var(--line); border-radius:8px; cursor:pointer; }
  .filter-select:focus{ outline:none; border-color:var(--clay); background:var(--paper); }
  .filter-check{ display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--cream); border-radius:8px; font-size:14px; cursor:pointer; transition:background .2s var(--ease); }
  .filter-check:hover{ background:var(--cream-deep); }
  .filter-check input{ accent-color:var(--clay); width:16px; height:16px; cursor:pointer; }
  .filter-actions{ display:flex; gap:10px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
  .filter-btn-apply{ flex:1; padding:11px 16px; background:var(--espresso); color:var(--paper); border-radius:8px; font-size:14px; font-weight:600; transition:background .2s var(--ease); }
  .filter-btn-apply:hover{ background:var(--bark); }
  .filter-btn-reset{ padding:11px 16px; background:var(--cream-deep); color:var(--espresso); border-radius:8px; font-size:14px; font-weight:500; transition:background .2s var(--ease); }
  .filter-btn-reset:hover{ background:var(--sand); }

  .country{ border-bottom:1px solid var(--line); overflow:hidden; }
  .country:last-child{ border-bottom:none; }
  .country-header{ display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; padding:16px 4px; font-size:16px; font-weight:600; color:var(--espresso); transition:color .25s var(--ease), padding-left .25s var(--ease); }
  .country-header:hover{ color:var(--clay); padding-left:10px; }
  .country-arrow{ font-size:12px; color:var(--text-muted); transition:transform .4s var(--ease); }
  .country.open .country-arrow{ transform:rotate(180deg); }
  .country-count{ font-size:12px; color:var(--text-muted); font-weight:400; margin-left:8px; }
  .country-list{ display:block; max-height:0; overflow:hidden; opacity:0; transition:max-height .6s var(--ease), opacity .4s var(--ease), padding .4s var(--ease); }
  .country.open .country-list{ max-height:6000px; opacity:1; padding:0 0 12px 0; }

  .uni-item{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:12px 14px; margin-bottom:6px; border-radius:10px; background:var(--cream); border:1px solid transparent; cursor:pointer; opacity:0; transform:translateY(6px); animation:fadeInUp .45s var(--ease) forwards; transition:background .25s var(--ease), transform .25s var(--ease), border-color .25s var(--ease); }
  .country.open .uni-item{ animation-play-state:running; }
  .uni-item:hover{ background:var(--cream-deep); transform:translateY(-2px); }
  .uni-item.selected{ background:var(--espresso); color:var(--paper); border-color:var(--espresso); }
  .uni-item.selected .uni-meta{ color:var(--sand); }
  .uni-item-main{ flex:1; min-width:0; }
  .uni-name{ font-weight:600; font-size:14px; margin-bottom:4px; display:block; }
  .uni-meta{ font-size:12px; color:var(--text-muted); display:flex; gap:10px; flex-wrap:wrap; transition:color .25s var(--ease); }

  .star-btn{ flex-shrink:0; width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:50%; color:var(--text-muted); transition:color .2s var(--ease), background .2s var(--ease); position:relative; }
  .star-btn:hover{ background:rgba(43,27,16,0.06); color:var(--clay); }
  .uni-item.selected .star-btn{ color:var(--sand); }
  .star-btn svg{ width:20px; height:20px; transition:transform .5s var(--ease), fill .3s var(--ease), stroke .3s var(--ease); }
  .star-btn.active svg{ fill:url(#starGradient); stroke:url(#starGradient); animation:starPop .6s var(--ease); }
  @keyframes starPop{
    0% { transform:scale(0.6) rotate(0deg); }
    40% { transform:scale(1.4) rotate(180deg); }
    70% { transform:scale(0.95) rotate(320deg); }
    100% { transform:scale(1) rotate(360deg); }
  }

  .country.open .uni-item:nth-child(1){ animation-delay:0.04s; }
  .country.open .uni-item:nth-child(2){ animation-delay:0.08s; }
  .country.open .uni-item:nth-child(3){ animation-delay:0.12s; }
  .country.open .uni-item:nth-child(4){ animation-delay:0.16s; }
  .country.open .uni-item:nth-child(5){ animation-delay:0.20s; }
  .country.open .uni-item:nth-child(n+6){ animation-delay:0.24s; }

  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  .detail{ padding:40px 48px; overflow-y:auto; }
  .detail-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:70vh; color:var(--text-muted); text-align:center; }
  .detail-empty svg{ width:80px; height:80px; margin-bottom:20px; opacity:0.4; animation:softFloat 4s ease-in-out infinite; }
  @keyframes softFloat{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }
  .detail-empty h2{ font-size:24px; color:var(--text-main); margin-bottom:10px; }
  .detail-empty p{ font-size:15px; max-width:400px; }
  .detail-content{ display:none; opacity:0; }
  .detail-content.active{ display:block; animation:fadeInPanel .5s var(--ease) forwards; }
  @keyframes fadeInPanel{ from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:translateY(0);} }

  .uni-title{ font-size:38px; line-height:1.15; margin-bottom:10px; color:var(--espresso); }
  .uni-location{ font-size:16px; color:var(--text-muted); margin-bottom:8px; }
  .grant-badge{ display:inline-flex; align-items:center; gap:6px; background:var(--caramel); color:var(--espresso); padding:6px 14px; border-radius:20px; font-size:13px; font-weight:600; margin-bottom:24px; }

  .info-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; margin-bottom:20px; }
  .info-card{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:20px; transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease); opacity:0; transform:translateY(8px); animation:fadeInUp .5s var(--ease) forwards; }
  .info-card:hover{ transform:translateY(-3px); box-shadow:0 12px 24px -14px rgba(43,27,16,0.25); border-color:var(--sand); }
  .info-grid .info-card:nth-child(1){ animation-delay:0.05s; }
  .info-grid .info-card:nth-child(2){ animation-delay:0.10s; }
  .info-grid .info-card:nth-child(3){ animation-delay:0.15s; }
  .info-grid .info-card:nth-child(4){ animation-delay:0.20s; }
  .info-grid .info-card:nth-child(5){ animation-delay:0.25s; }
  .info-grid .info-card:nth-child(6){ animation-delay:0.30s; }

  .info-label{ font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px; font-weight:600; }
  .info-value{ font-size:15px; color:var(--text-main); line-height:1.5; }
  .info-value.empty{ color:var(--text-muted); font-style:italic; }
  .section-title{ font-size:22px; margin-bottom:16px; margin-top:32px; color:var(--espresso); }

  .action-buttons{ display:flex; flex-wrap:wrap; gap:12px; margin-top:32px; padding-top:32px; border-top:1px solid var(--line); }
  .btn-main{ display:inline-flex; align-items:center; gap:10px; padding:15px 26px; border-radius:10px; font-size:14px; font-weight:600; transition:transform .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease); }
  .btn-main.primary{ background:var(--espresso); color:var(--paper); }
  .btn-main.primary:hover{ background:var(--bark); transform:translateY(-2px); box-shadow:0 10px 20px -10px rgba(43,27,16,0.5); }
  .btn-main.secondary{ background:var(--clay); color:var(--paper); }
  .btn-main.secondary:hover{ background:var(--bark); transform:translateY(-2px); }
  .btn-main.ghost{ background:var(--cream-deep); color:var(--espresso); }
  .btn-main.ghost:hover{ background:var(--sand); transform:translateY(-2px); }

  @media (max-width:1000px){
    .layout{ grid-template-columns:1fr; }
    .sidebar{ position:static; max-height:none; border-right:none; border-bottom:1px solid var(--line); }
    .detail{ padding:32px 24px; }
    .uni-title{ font-size:30px; }
    .info-grid{ grid-template-columns:1fr; }
  }
  @media (max-width:900px){
    .nav-links{ display:none !important; }
  }
  @media (max-width:600px){
    nav.wrap{ height:72px; padding:0 18px; }
    .logo{ font-size:21px; gap:9px; }
    .logo svg{ width:30px; height:30px; }
    .search-input, .search-results{ width:calc(100vw - 36px); right:-10px; }
  }
</style>
</head>
<body>

<svg style="position:absolute; width:0; height:0;" aria-hidden="true">
  <defs>
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>
  </defs>
</svg>

<header>
  <nav class="wrap">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="#5A3B26" stroke-width="2"/>
        <path d="M27 13 L18 18 L13 27 L22 22 Z" fill="#C79256"/>
        <circle cx="20" cy="20" r="2.4" fill="#2B1B10"/>
      </svg>
      EduPath
    </a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav_home">Главная</a>
      <a href="universities.html" class="active" data-i18n="nav_universities">Университеты</a>
      <a href="profile.html" data-i18n="nav_profile">Профиль</a>
      <a href="fanzone.html" data-i18n="nav_fanzone">🤡 Fun Zone</a>
    </div>
    <div class="nav-right">
      <div class="lang-dropdown">
        <button type="button" class="icon-btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Сменить язык">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="19" height="19"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.7 4 6 4 9.5s-1.4 6.8-4 9.5c-2.6-2.7-4-6-4-9.5s1.4-6.8 4-9.5z"/></svg>
        </button>
        <div class="lang-menu" id="langMenu" role="menu">
          <button type="button" class="lang-option active" data-lang="ru" role="menuitem">Русский</button>
          <button type="button" class="lang-option" data-lang="en" role="menuitem">English</button>
          <button type="button" class="lang-option" data-lang="zh" role="menuitem">中文</button>
          <button type="button" class="lang-option" data-lang="kk" role="menuitem">Қазақша</button>
          <button type="button" class="lang-option" data-lang="ky" role="menuitem">Кыргызча</button>
        </div>
      </div>
      <a href="#" class="btn-login" data-auth-open="register" data-i18n="nav_login">Войти</a>
      <button type="button" class="icon-btn" id="searchBtn" aria-label="Поиск">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="19" height="19"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <input type="text" class="search-input" id="searchInput" data-i18n-placeholder="catalog_search_placeholder" placeholder="Find a university...">
      <div class="search-results" id="searchResults"></div>
    </div>
  </nav>
</header>

<div class="layout">
  <aside class="sidebar">
    <h2 data-i18n="catalog_title">Universities</h2>
    <p class="subtitle" data-i18n="catalog_sub">Pick a country and university</p>
    <div class="filters-wrap">
      <button type="button" class="filters-btn" id="filtersToggle">
        <span class="filters-btn-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
          <span data-i18n="catalog_filters">Filters</span>
          <span class="filters-btn-badge" id="filtersBadge" style="display:none;">0</span>
        </span>
        <span class="filters-btn-arrow">▾</span>
      </button>

      <div class="filters-panel" id="filtersPanel">
        <div class="filter-group">
          <label data-i18n="catalog_budget_label">Tuition budget (USD/year)</label>
          <div class="filter-row">
            <input type="number" id="filterBudgetMin" data-i18n-placeholder="catalog_budget_from" placeholder="from" min="0">
            <span>—</span>
            <input type="number" id="filterBudgetMax" data-i18n-placeholder="catalog_budget_to" placeholder="to" min="0">
          </div>
        </div>

        <div class="filter-group">
          <label data-i18n="catalog_country_label">Country</label>
          <select class="filter-select" id="filterCountry">
            <option value="" data-i18n="catalog_country_all">All countries</option>
          </select>
        </div>

        <div class="filter-group">
          <label data-i18n="catalog_grant_label">Financial aid</label>
          <label class="filter-check">
            <input type="checkbox" id="filterFullGrant">
            <span data-i18n="catalog_grant_only">Only with full scholarship</span>
          </label>
        </div>

        <div class="filter-actions">
          <button type="button" class="filter-btn-reset" id="filterReset" data-i18n="catalog_reset">Reset</button>
          <button type="button" class="filter-btn-apply" id="filterApply" data-i18n="catalog_apply">Apply</button>
        </div>
      </div>
    </div>
    <div id="countriesList"></div>
  </aside>

  <main class="detail" id="detail">
    <div class="detail-empty" id="detailEmpty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M12 4L3 8l9 4 9-4-9-4z"/>
        <path d="M6 10v6c0 1.5 2.7 3 6 3s6-1.5 6-3v-6"/>
      </svg>
      <h2 data-i18n="catalog_choose_uni">Pick a university</h2>
      <p data-i18n="catalog_choose_hint">Click on a country on the left, then a university to see details.</p>
    </div>
    <div class="detail-content" id="detailContent"></div>
  </main>
</div>

<script>
// ============================================================
// EduPath — каталог университетов
// Страны: name — английский (для JSON и fallback), key — ключ i18n
// ============================================================

const COUNTRY_FILES = [
  { file: "Australia.json",      name: "Australia",       key: "country_australia" },
  { file: "Austria.json",        name: "Austria",         key: "country_austria" },
  { file: "Belgium.json",        name: "Belgium",         key: "country_belgium" },
  { file: "Canada.json",         name: "Canada",          key: "country_canada" },
  { file: "China.json",          name: "China",           key: "country_china" },

const FLAGS = {
  "Australia":"🇦🇺","Austria":"🇦🇹","Belgium":"🇧🇪","Canada":"🇨🇦","China":"🇨🇳",
  "Czech Republic":"🇨🇿","Denmark":"🇩🇰","Finland":"🇫🇮","Germany":"🇩🇪","Hong Kong":"🇭🇰",

};

let ALL_DATA = [];
let _currentUni = null;

// ============================================================
// ХЕЛПЕРЫ
// ============================================================

function escapeAttr(s){
  return String(s == null ? "" : s).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function t(key, fallback){
  return (window.I18N && window.I18N.t(key)) || fallback || key;
}

// ============================================================
// ЗАГРУЗКА
// ============================================================

async function loadAll(){
  const results = await Promise.allSettled(
    COUNTRY_FILES.map(async (c) => {
      const res = await fetch(c.file);
      if(!res.ok) throw new Error(c.file);
      const data = await res.json();
      return { country: c.name, key: c.key, items: data };
    })
  );

  results.forEach(r => {
    if(r.status === "fulfilled"){
      const { country, key, items } = r.value;
      items.forEach(uni => {
        if(uni && uni["Университет"] && String(uni["Университет"]).trim() !== ""){
          uni._country = country;
          uni._country_key = key;
          uni._flag = FLAGS[country] || "🌍";
          ALL_DATA.push(uni);
        }
      });
    }
  });

  ALL_DATA.sort((a,b) => {
    const ai = COUNTRY_FILES.findIndex(c => c.name === a._country);
    const bi = COUNTRY_FILES.findIndex(c => c.name === b._country);
    if(ai !== bi) return ai - bi;
    return String(a["Университет"]).localeCompare(String(b["Университет"]));
  });

  if (window.EduAuth && window.EduAuth.isLoggedIn()) {
    try { await window.EduAuth.getSaved(); } catch(e) {}
  }

  buildCountryFilter();
  renderSidebar();
}

// ============================================================
// ПОЛНЫЙ ГРАНТ
// ============================================================

function isFullGrant(uni){
  const v = String(uni["Дают полный грант (обучение, проживание, перелет, питание) международным студентам?"] || "").trim().toLowerCase();
  return v === "да" || v === "истина" || v === "true";
}

// ============================================================
// ФИЛЬТР СТРАН
// ============================================================

function buildCountryFilter(){
  const sel = document.getElementById("filterCountry");
  if(!sel) return;

  const current = sel.value;
  sel.innerHTML = "";

  const allOpt = document.createElement("option");
  allOpt.value = "";
  allOpt.setAttribute("data-i18n", "catalog_country_all");
  allOpt.textContent = t("catalog_country_all", "All countries");
  sel.appendChild(allOpt);

  COUNTRY_FILES.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.name;
    opt.setAttribute("data-i18n", c.key);
    opt.textContent = t(c.key, c.name);
    sel.appendChild(opt);
  });

  sel.value = current || "";
}

// ============================================================
// SIDEBAR
// ============================================================

function renderSidebar(){
  const container = document.getElementById("countriesList");
  container.innerHTML = "";
  const filtered = applyFilters(ALL_DATA);

  COUNTRY_FILES.forEach(c => {
    let items = filtered.filter(u => u._country === c.name);
    if(items.length === 0) return;

    const div = document.createElement("div");
    div.className = "country";

    const header = document.createElement("button");
    header.type = "button";
    header.className = "country-header";
    header.innerHTML = `<span>${FLAGS[c.name] || "🌍"} ${t(c.key, c.name)}<span class="country-count">${items.length}</span></span><span class="country-arrow">▾</span>`;
    header.addEventListener("click", () => div.classList.toggle("open"));

    const list = document.createElement("div");
    list.className = "country-list";

    items.forEach(uni => {
      const wrapper = document.createElement("div");
      wrapper.className = "uni-item";
      wrapper.dataset.name = uni["Университет"];
      if(_currentUni && _currentUni["Университет"] === uni["Университет"]){
        wrapper.classList.add("selected");
      }

      const city = uni["Город"] || "—";
      const rate = uni["Процент Поступления"] || "—";
      const deadline = uni["Дедлайн Основной Подачи"] || uni["Дедлайн Ранней Подачи"] || "—";
      const isSaved = window.EduAuth ? window.EduAuth.isSaved(uni["Университет"]) : false;

      wrapper.innerHTML = `
        <div class="uni-item-main">
          <span class="uni-name">${uni["Университет"]}</span>
          <span class="uni-meta">
            <span>📍 ${city}</span>
            <span>🎯 ${rate}</span>
            <span>📅 ${deadline}</span>
          </span>
        </div>
        <button type="button" class="star-btn ${isSaved ? "active" : ""}" data-star="${escapeAttr(uni["Университет"])}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        </button>
      `;

      wrapper.addEventListener("click", (e) => {
        if(e.target.closest(".star-btn")) return;
        selectUni(uni, wrapper);
      });

      list.appendChild(wrapper);
    });

    div.appendChild(header);
    div.appendChild(list);
    container.appendChild(div);
  });
}

document.addEventListener("click", async (e) => {
  const starBtn = e.target.closest(".star-btn");
  if(!starBtn) return;

  e.stopPropagation();

  const name = starBtn.dataset.star;
  const uni = ALL_DATA.find(u => u["Университет"] === name);
  if(!uni) return;

  if(!window.EduAuth || !window.EduAuth.isLoggedIn()){
    window.EduAuth.showToast(t("catalog_need_login", "Log in to save universities"), "info");
    window.EduAuth.openModal("register");
    return;
  }

  const result = await window.EduAuth.toggleSave({
    name: uni["Университет"],
    country: uni._country,
    city: uni["Город"]
  });

  if(!result || !result.ok){
    window.EduAuth.showToast((result && result.error) || "Error", "error");
    return;
  }

  if(result.added){
    starBtn.classList.add("active");
    window.EduAuth.showToast(t("catalog_saved_ok", "University saved successfully"), "success");
  } else if(result.removed){
    starBtn.classList.remove("active");
    window.EduAuth.showToast(t("catalog_saved_remove", "University removed from favorites"), "info");
  }
});

function selectUni(uni, wrapper){
  _currentUni = uni;

  document.querySelectorAll(".uni-item.selected").forEach(el => el.classList.remove("selected"));
  if(wrapper) wrapper.classList.add("selected");

  const content = document.getElementById("detailContent");
  const empty = document.getElementById("detailEmpty");

  if(content.classList.contains("active")){
    content.style.transition = "opacity .2s ease";
    content.style.opacity = "0";
    setTimeout(() => {
      content.classList.remove("active");
      renderDetail(uni);
    }, 180);
  } else {
    empty.style.opacity = "0";
    setTimeout(() => {
      empty.style.display = "none";
      renderDetail(uni);
    }, 200);
  }
}

const filters = {
  budgetMin: null,
  budgetMax: null,
  country: "",
  fullGrant: false
};

function parsePrice(str){
  if(!str) return null;
  const s = String(str).trim().toLowerCase();
  if(s.includes("бесплат") || s.includes("free")) return 0;
  const matches = s.match(/\d[\d\s,\.]*/g);
  if(!matches || matches.length === 0) return null;
  const numbers = matches.map(m => {
    const clean = m.replace(/[\s,\.]/g, "");
    return parseInt(clean, 10);
  }).filter(n => !isNaN(n) && n > 0);
  if(numbers.length === 0) return null;
  if(numbers.length >= 2) return Math.round((numbers[0] + numbers[1]) / 2);
  return numbers[0];
}

function applyFilters(items){
  return items.filter(uni => {
    if(filters.country && uni._country !== filters.country) return false;
    if(filters.fullGrant && !isFullGrant(uni)) return false;
    if(filters.budgetMin !== null || filters.budgetMax !== null){
      const price = parsePrice(uni["Стоимость обучения (USD/год)"]);
      if(price === null) return false;
      if(filters.budgetMin !== null && price < filters.budgetMin) return false;
      if(filters.budgetMax !== null && price > filters.budgetMax) return false;
    }
    return true;
  });
}

function updateFiltersBadge(){
  let count = 0;
  if(filters.budgetMin !== null) count++;
  if(filters.budgetMax !== null) count++;
  if(filters.country) count++;
  if(filters.fullGrant) count++;

  const badge = document.getElementById("filtersBadge");
  const btn = document.getElementById("filtersToggle");

  if(count > 0){
    badge.style.display = "inline-flex";
    badge.textContent = count;
    btn.classList.add("active");
  } else {
    badge.style.display = "none";
    btn.classList.remove("active");
  }
}

document.getElementById("filtersToggle").addEventListener("click", () => {
  document.getElementById("filtersPanel").classList.toggle("open");
});

document.getElementById("filterApply").addEventListener("click", () => {
  const minVal = document.getElementById("filterBudgetMin").value;
  const maxVal = document.getElementById("filterBudgetMax").value;

  filters.budgetMin = minVal !== "" ? parseInt(minVal, 10) : null;
  filters.budgetMax = maxVal !== "" ? parseInt(maxVal, 10) : null;
  filters.country = document.getElementById("filterCountry").value;
  filters.fullGrant = document.getElementById("filterFullGrant").checked;

  updateFiltersBadge();
  renderSidebar();
  document.getElementById("filtersPanel").classList.remove("open");
});

document.getElementById("filterReset").addEventListener("click", () => {
  document.getElementById("filterBudgetMin").value = "";
  document.getElementById("filterBudgetMax").value = "";
  document.getElementById("filterCountry").value = "";
  document.getElementById("filterFullGrant").checked = false;

  filters.budgetMin = null;
  filters.budgetMax = null;
  filters.country = "";
  filters.fullGrant = false;

  updateFiltersBadge();
  renderSidebar();
});

const searchBtn = document.getElementById("searchBtn");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

searchBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  searchInput.classList.toggle("open");
  if(searchInput.classList.contains("open")) searchInput.focus();
  else searchResults.classList.remove("open");
});

searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  if(q.length < 2){ searchResults.classList.remove("open"); return; }
  const found = ALL_DATA.filter(u => {
    const name = String(u["Университет"] || "").toLowerCase();
    const city = String(u["Город"] || "").toLowerCase();
    const country = String(u._country || "").toLowerCase();
    return name.includes(q) || city.includes(q) || country.includes(q);
  }).slice(0, 12);
  if(found.length === 0){
    searchResults.innerHTML = `<div class="search-empty">${t("catalog_search_empty", "Sorry, we're still working on adding this university")}</div>`;
  } else {
    searchResults.innerHTML = found.map(u => `
      <button class="search-result" data-name="${escapeAttr(u["Университет"])}">
        ${u["Университет"]}
        <small>${u._flag} ${t(u._country_key, u._country)} · ${u["Город"] || ""}</small>
      </button>
    `).join("");
  }
  searchResults.classList.add("open");
});

searchResults.addEventListener("click", (e) => {
  const btn = e.target.closest(".search-result");
  if(!btn) return;
  const name = btn.dataset.name;
  const uni = ALL_DATA.find(u => u["Университет"] === name);
  if(uni){
    const itemEl = [...document.querySelectorAll(".uni-item")].find(el => el.dataset.name === name);
    if(itemEl){
      itemEl.closest(".country").classList.add("open");
      selectUni(uni, itemEl);
      setTimeout(() => itemEl.scrollIntoView({ behavior:"smooth", block:"center" }), 250);
    } else {
      selectUni(uni, null);
    }
  }
  searchInput.value = "";
  searchResults.classList.remove("open");
  searchInput.classList.remove("open");
});

document.addEventListener("click", () => {
  searchResults.classList.remove("open");
  searchInput.classList.remove("open");
});
searchInput.addEventListener("click", (e) => e.stopPropagation());
searchResults.addEventListener("click", (e) => e.stopPropagation());

loadAll().then(() => {
  const params = new URLSearchParams(window.location.search);
  const uniName = params.get("uni");
  if(!uniName) return;

  const uni = ALL_DATA.find(u => u["Университет"] === uniName);
  if(!uni) return;

  const itemEl = [...document.querySelectorAll(".uni-item")].find(el => el.dataset.name === uniName);
  if(itemEl){
    itemEl.closest(".country").classList.add("open");
    selectUni(uni, itemEl);
    setTimeout(() => itemEl.scrollIntoView({ behavior: "smooth", block: "center" }), 300);
  } else {
    selectUni(uni, null);
  }
});
