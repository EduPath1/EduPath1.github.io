<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPath — Университеты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7EFE1; --cream-deep:#EFE1C6; --paper:#FBF6EC;
    --espresso:#2B1B10; --bark:#5A3B26; --clay:#8C5A34;
    --caramel:#C79256; --sand:#D9BD93;
    --text-main:#2B1B10; --text-muted:#7A6552;
    --line:rgba(43,27,16,0.14);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Work Sans',sans-serif; background:var(--cream); color:var(--text-main); line-height:1.5; min-height:100vh; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }

  /* ===== HEADER ===== */
  header{ background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:100; }
  nav.wrap{ display:flex; align-items:center; justify-content:space-between; height:84px; max-width:1400px; margin:0 auto; padding:0 32px; }
  .logo{ display:flex; align-items:center; gap:12px; font-family:'Fraunces',serif; font-weight:600; font-size:26px; color:var(--espresso); transition: opacity .25s var(--ease); }
  .logo:hover{ opacity:0.75; }
  .logo svg{ width:38px; height:38px; flex-shrink:0; }
  .nav-links{ display:flex; align-items:center; gap:8px; }
  .nav-links a{ font-size:15px; color:var(--text-muted); padding:10px 18px; border-radius:8px; transition: background .3s var(--ease), color .3s var(--ease); }
  .nav-links a:hover{ color:var(--espresso); background:var(--cream-deep); }
  .nav-links a.active{ background:var(--espresso); color:var(--paper); }
  .nav-right{ display:flex; align-items:center; gap:14px; position:relative; }
  .btn-login{ background:var(--clay); color:var(--paper); padding:10px 22px; border-radius:20px; font-size:14px; font-weight:500; transition: background .3s var(--ease), transform .25s var(--ease); }
  .btn-login:hover{ background:var(--bark); transform: translateY(-1px); }
  .icon-btn{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); border-radius:50%; transition: background .3s var(--ease), color .3s var(--ease); }
  .icon-btn:hover{ background:var(--cream-deep); color:var(--espresso); }
  .search-input{ display:block; position:absolute; top:48px; right:0; width:340px; padding:14px 18px; background:var(--paper); border:1px solid var(--line); border-radius:12px; font-size:15px; font-family:inherit; box-shadow:0 16px 32px -14px rgba(43,27,16,0.3); z-index:200; opacity:0; visibility:hidden; transform: translateY(-8px); transition: opacity .25s var(--ease), transform .25s var(--ease), visibility .25s; }
  .search-input.open{ opacity:1; visibility:visible; transform: translateY(0); }
  .search-results{ display:block; position:absolute; top:104px; right:0; width:340px; max-height:340px; overflow-y:auto; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:0 16px 32px -14px rgba(43,27,16,0.3); z-index:199; opacity:0; visibility:hidden; transform: translateY(-8px); transition: opacity .25s var(--ease), transform .25s var(--ease), visibility .25s; }
  .search-results.open{ opacity:1; visibility:visible; transform: translateY(0); }
  .search-result{ display:block; width:100%; text-align:left; padding:10px 14px; border-radius:8px; font-size:14px; cursor:pointer; transition: background .2s var(--ease); }
  .search-result:hover{ background:var(--cream-deep); }
  .search-result small{ color:var(--text-muted); display:block; font-size:12px; }
  .search-empty{ padding:14px; font-size:14px; color:var(--text-muted); text-align:center; }

  /* ===== LAYOUT ===== */
  .layout{ display:grid; grid-template-columns:420px 1fr; gap:0; max-width:1400px; margin:0 auto; min-height:calc(100vh - 84px); }

  /* ===== SIDEBAR ===== */
  .sidebar{ background:var(--paper); border-right:1px solid var(--line); padding:32px 24px; overflow-y:auto; max-height:calc(100vh - 84px); position:sticky; top:84px; }
  .sidebar h2{ font-size:24px; margin-bottom:6px; }
  .sidebar .subtitle{ font-size:14px; color:var(--text-muted); margin-bottom:20px; }
  .only-grant{ display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--cream); border-radius:10px; margin-bottom:18px; font-size:14px; cursor:pointer; transition: background .25s var(--ease); }
  .only-grant:hover{ background:var(--cream-deep); }
  .only-grant input{ accent-color:var(--clay); width:16px; height:16px; cursor:pointer; }

  /* Аккордеон страны */
  .country{ border-bottom:1px solid var(--line); overflow:hidden; }
  .country:last-child{ border-bottom:none; }
  .country-header{ display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; padding:16px 4px; font-size:16px; font-weight:600; color:var(--espresso); transition: color .25s var(--ease), padding-left .25s var(--ease); }
  .country-header:hover{ color:var(--clay); padding-left:10px; }
  .country-arrow{ font-size:12px; color:var(--text-muted); transition: transform .4s var(--ease); }
  .country.open .country-arrow{ transform: rotate(180deg); }
  .country-count{ font-size:12px; color:var(--text-muted); font-weight:400; margin-left:8px; }

  /* Плавное раскрытие списка */
  .country-list{
    display:block;
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition: max-height .6s var(--ease), opacity .4s var(--ease), padding .4s var(--ease);
  }
  .country.open .country-list{
    max-height:4000px;
    opacity:1;
    padding: 0 0 12px 0;
  }

  .uni-item{
    display:block; width:100%; text-align:left;
    padding:12px 14px; margin-bottom:6px;
    border-radius:10px; background:var(--cream);
    border:1px solid transparent;
    cursor:pointer;
    opacity:0; transform: translateY(6px);
    animation: fadeInUp .45s var(--ease) forwards;
    transition: background .25s var(--ease), transform .25s var(--ease), border-color .25s var(--ease);
  }
  .country.open .uni-item{ animation-play-state: running; }
  .uni-item:hover{ background:var(--cream-deep); transform: translateY(-2px); }
  .uni-item.selected{ background:var(--espresso); color:var(--paper); border-color:var(--espresso); }
  .uni-item.selected .uni-meta{ color:var(--sand); }
  .uni-name{ font-weight:600; font-size:14px; margin-bottom:4px; display:block; }
  .uni-meta{ font-size:12px; color:var(--text-muted); display:flex; gap:10px; flex-wrap:wrap; transition: color .25s var(--ease); }

  /* Задержка появления элементов подряд */
  .country.open .uni-item:nth-child(1){ animation-delay: 0.04s; }
  .country.open .uni-item:nth-child(2){ animation-delay: 0.08s; }
  .country.open .uni-item:nth-child(3){ animation-delay: 0.12s; }
  .country.open .uni-item:nth-child(4){ animation-delay: 0.16s; }
  .country.open .uni-item:nth-child(5){ animation-delay: 0.20s; }
  .country.open .uni-item:nth-child(6){ animation-delay: 0.24s; }
  .country.open .uni-item:nth-child(7){ animation-delay: 0.28s; }
  .country.open .uni-item:nth-child(8){ animation-delay: 0.32s; }
  .country.open .uni-item:nth-child(n+9){ animation-delay: 0.36s; }

  @keyframes fadeInUp{
    from { opacity:0; transform: translateY(6px); }
    to   { opacity:1; transform: translateY(0); }
  }

  /* ===== DETAIL PANEL ===== */
  .detail{ padding:40px 48px; overflow-y:auto; }
  .detail-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:70vh; color:var(--text-muted); text-align:center; transition: opacity .35s var(--ease); }
  .detail-empty svg{ width:80px; height:80px; margin-bottom:20px; opacity:0.4; animation: softFloat 4s ease-in-out infinite; }
  @keyframes softFloat{
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  .detail-empty h2{ font-size:24px; color:var(--text-main); margin-bottom:10px; }
  .detail-empty p{ font-size:15px; max-width:400px; }
  .detail-content{ display:none; opacity:0; }
  .detail-content.active{ display:block; animation: fadeInPanel .5s var(--ease) forwards; }
  @keyframes fadeInPanel{
    from { opacity:0; transform: translateY(12px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .uni-title{ font-size:38px; line-height:1.15; margin-bottom:10px; color:var(--espresso); }
  .uni-location{ font-size:16px; color:var(--text-muted); margin-bottom:8px; }
  .grant-badge{ display:inline-flex; align-items:center; gap:6px; background:var(--caramel); color:var(--espresso); padding:6px 14px; border-radius:20px; font-size:13px; font-weight:600; margin-bottom:24px; animation: pulseGlow 2.5s ease-in-out infinite; }
  @keyframes pulseGlow{
    0%, 100% { box-shadow: 0 0 0 0 rgba(199,146,86,0.4); }
    50%      { box-shadow: 0 0 0 8px rgba(199,146,86,0); }
  }
  .open-new{ display:inline-flex; align-items:center; gap:6px; font-size:14px; color:var(--clay); margin-bottom:24px; cursor:pointer; padding:8px 14px; border-radius:8px; background:var(--cream-deep); transition: background .25s var(--ease), transform .25s var(--ease); }
  .open-new:hover{ background:var(--sand); transform: translateY(-1px); }

  .info-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; margin-bottom:20px; }
  .info-card{
    background:var(--paper); border:1px solid var(--line);
    border-radius:14px; padding:20px;
    transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
    opacity:0; transform: translateY(8px);
    animation: fadeInUp .5s var(--ease) forwards;
  }
  .info-card:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 24px -14px rgba(43,27,16,0.25);
    border-color: var(--sand);
  }
  .info-grid .info-card:nth-child(1){ animation-delay: 0.05s; }
  .info-grid .info-card:nth-child(2){ animation-delay: 0.10s; }
  .info-grid .info-card:nth-child(3){ animation-delay: 0.15s; }
  .info-grid .info-card:nth-child(4){ animation-delay: 0.20s; }
  .info-grid .info-card:nth-child(5){ animation-delay: 0.25s; }
  .info-grid .info-card:nth-child(6){ animation-delay: 0.30s; }

  .info-label{ font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px; font-weight:600; }
  .info-value{ font-size:15px; color:var(--text-main); line-height:1.5; }
  .info-value.empty{ color:var(--text-muted); font-style:italic; }
  .section-title{ font-size:22px; margin-bottom:16px; margin-top:32px; color:var(--espresso); animation: fadeInUp .5s var(--ease) forwards; }

  .action-buttons{ display:flex; flex-wrap:wrap; gap:12px; margin-top:32px; padding-top:32px; border-top:1px solid var(--line); }
  .btn-main{ display:inline-flex; align-items:center; gap:10px; padding:15px 26px; border-radius:10px; font-size:14px; font-weight:600; transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease); }
  .btn-main.primary{ background:var(--espresso); color:var(--paper); }
  .btn-main.primary:hover{ background:var(--bark); transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(43,27,16,0.5); }
  .btn-main.secondary{ background:var(--clay); color:var(--paper); }
  .btn-main.secondary:hover{ background:var(--bark); transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(140,90,52,0.5); }
  .btn-main.ghost{ background:var(--cream-deep); color:var(--espresso); }
  .btn-main.ghost:hover{ background:var(--sand); transform: translateY(-2px); }

  @media (max-width:1000px){
    .layout{ grid-template-columns:1fr; }
    .sidebar{ position:static; max-height:none; border-right:none; border-bottom:1px solid var(--line); }
    .detail{ padding:32px 24px; }
    .uni-title{ font-size:30px; }
    .info-grid{ grid-template-columns:1fr; }
  }
  @media (max-width:600px){
    nav.wrap{ height:72px; padding:0 18px; }
    .nav-links{ display:none; }
    .logo{ font-size:21px; gap:9px; }
    .logo svg{ width:30px; height:30px; }
    .search-input, .search-results{ width:calc(100vw - 36px); right:-10px; }
  }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="#5A3B26" stroke-width="2"/>
        <path d="M27 13 L18 18 L13 27 L22 22 Z" fill="#C79256"/>
        <circle cx="20" cy="20" r="2.4" fill="#2B1B10"/>
      </svg>
      EduPath
    </a>
    <div class="nav-links">
      <a href="index.html">Главная</a>
      <a href="universities.html" class="active">Университеты</a>
      <a href="#">Профиль</a>
    </div>
    <div class="nav-right">
      <a href="#" class="btn-login">Войти</a>
      <button type="button" class="icon-btn" id="searchBtn" aria-label="Поиск">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="19" height="19"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <input type="text" class="search-input" id="searchInput" placeholder="Найти университет...">
      <div class="search-results" id="searchResults"></div>
    </div>
  </nav>
</header>

<div class="layout">
  <aside class="sidebar">
    <h2>Университеты</h2>
    <p class="subtitle">Выбери страну и университет</p>
    <label class="only-grant">
      <input type="checkbox" id="onlyGrant">
      <span>Показывать только с полным грантом</span>
    </label>
    <div id="countriesList"></div>
  </aside>

  <main class="detail" id="detail">
    <div class="detail-empty" id="detailEmpty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M12 4L3 8l9 4 9-4-9-4z"/>
        <path d="M6 10v6c0 1.5 2.7 3 6 3s6-1.5 6-3v-6"/>
      </svg>
      <h2>Выбери университет</h2>
      <p>Кликни на страну слева, потом на университет, чтобы увидеть подробную информацию.</p>
    </div>
    <div class="detail-content" id="detailContent"></div>
  </main>
</div>

<script>
const COUNTRY_FILES = [
  { file: "Australia.json",      name: "Австралия" },
  { file: "Austria.json",        name: "Австрия" },
  { file: "Belgium.json",        name: "Бельгия" },
  { file: "Canada.json",         name: "Канада" },
  { file: "China.json",          name: "Китай" },
  { file: "Czech Republic.json", name: "Чехия" },
  { file: "Denmark.json",        name: "Дания" },
  { file: "Finland.json",        name: "Финляндия" },
  { file: "Germany.json",        name: "Германия" },
  { file: "Hong Kong.json",      name: "Гонконг" },
  { file: "Hungary.json",        name: "Венгрия" },
  { file: "Italy.json",          name: "Италия" },
  { file: "Japan.json",          name: "Япония" },
  { file: "Latvia.json",         name: "Латвия" },
  { file: "Netherlands.json",    name: "Нидерланды" },
  { file: "Poland.json",         name: "Польша" },
  { file: "Qatar.json",          name: "Катар" },
  { file: "Singapore.json",      name: "Сингапур" },
  { file: "South Korea.json",    name: "Южная Корея" },
  { file: "Spain.json",          name: "Испания" },
  { file: "Sweden.json",         name: "Швеция" },
  { file: "Switzerland.json",    name: "Швейцария" },
  { file: "Turkey.json",         name: "Турция" },
  { file: "UAE.json",            name: "ОАЭ" },
  { file: "UK.json",             name: "Великобритания" },
  { file: "USA.json",            name: "США" }
];

const FLAGS = {
  "Австралия":"🇦🇺","Австрия":"🇦🇹","Бельгия":"🇧🇪","Канада":"🇨🇦","Китай":"🇨🇳",
  "Чехия":"🇨🇿","Дания":"🇩🇰","Финляндия":"🇫🇮","Германия":"🇩🇪","Гонконг":"🇭🇰",
  "Венгрия":"🇭🇺","Италия":"🇮🇹","Япония":"🇯🇵","Латвия":"🇱🇻","Нидерланды":"🇳🇱",
  "Польша":"🇵🇱","Катар":"🇶🇦","Сингапур":"🇸🇬","Южная Корея":"🇰🇷","Испания":"🇪🇸",
  "Швеция":"🇸🇪","Швейцария":"🇨🇭","Турция":"🇹🇷","ОАЭ":"🇦🇪","Великобритания":"🇬🇧","США":"🇺🇸"
};

let ALL_DATA = [];

async function loadAll(){
  const results = await Promise.allSettled(
    COUNTRY_FILES.map(async (c) => {
      const res = await fetch(c.file);
      if(!res.ok) throw new Error(c.file);
      const data = await res.json();
      return { country: c.name, items: data };
    })
  );
  results.forEach(r => {
    if(r.status === "fulfilled"){
      const { country, items } = r.value;
      items.forEach(uni => {
        if(uni && uni["Университет"] && String(uni["Университет"]).trim() !== ""){
          uni._country_ru = country;
          uni._flag = FLAGS[country] || "🌍";
          ALL_DATA.push(uni);
        }
      });
    } else {
      console.warn("Не загрузился:", r.reason?.message);
    }
  });
  ALL_DATA.sort((a,b) => {
    const ai = COUNTRY_FILES.findIndex(c => c.name === a._country_ru);
    const bi = COUNTRY_FILES.findIndex(c => c.name === b._country_ru);
    if(ai !== bi) return ai - bi;
    return String(a["Университет"]).localeCompare(String(b["Университет"]));
  });
  renderSidebar();
}

function isFullGrant(uni){
  const v = String(uni["Дают полный грант (обучение, проживание, перелет, питание) международным студентам?"] || "").trim().toLowerCase();
  return v === "да" || v === "истина" || v === "true";
}

function renderSidebar(){
  const container = document.getElementById("countriesList");
  const onlyGrant = document.getElementById("onlyGrant").checked;
  container.innerHTML = "";
  COUNTRY_FILES.forEach(c => {
    let items = ALL_DATA.filter(u => u._country_ru === c.name);
    if(onlyGrant) items = items.filter(isFullGrant);
    if(items.length === 0) return;
    const div = document.createElement("div");
    div.className = "country";
    const header = document.createElement("button");
    header.type = "button";
    header.className = "country-header";
    header.innerHTML = `<span>${FLAGS[c.name] || "🌍"} ${c.name}<span class="country-count">${items.length}</span></span><span class="country-arrow">▾</span>`;
    header.addEventListener("click", () => div.classList.toggle("open"));
    const list = document.createElement("div");
    list.className = "country-list";
    items.forEach(uni => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "uni-item";
      btn.dataset.name = uni["Университет"];
      const city = uni["Город"] || "—";
      const rate = uni["Процент Поступления"] || "—";
      const deadline = uni["Дедлайн Основной Подачи"] || uni["Дедлайн Ранней Подачи"] || "—";
      btn.innerHTML = `<span class="uni-name">${uni["Университет"]}</span><span class="uni-meta"><span>📍 ${city}</span><span>🎯 ${rate}</span><span>📅 ${deadline}</span></span>`;
      btn.addEventListener("click", () => selectUni(uni, btn));
      list.appendChild(btn);
    });
    div.appendChild(header);
    div.appendChild(list);
    container.appendChild(div);
  });
}

function selectUni(uni, btn){
  document.querySelectorAll(".uni-item.selected").forEach(el => el.classList.remove("selected"));
  if(btn) btn.classList.add("selected");

  // Плавно скрываем старую панель
  const content = document.getElementById("detailContent");
  const empty = document.getElementById("detailEmpty");

  if(content.classList.contains("active")){
    content.style.transition = "opacity .2s ease";
    content.style.opacity = "0";
    setTimeout(() => {
      content.classList.remove("active");
      renderDetail(uni);
    }, 180);
  } else {
    empty.style.opacity = "0";
    setTimeout(() => {
      empty.style.display = "none";
      renderDetail(uni);
    }, 200);
  }
}

function renderDetail(uni){
  const content = document.getElementById("detailContent");
  content.classList.add("active");

  const g = (k) => {
    const v = uni[k];
    if(v === undefined || v === null || String(v).trim() === "" || String(v).trim().toLowerCase() === "n/a") return null;
    return v;
  };
  const row = (label, value) => {
    const val = value ? String(value) : "не указано";
    const cls = value ? "" : " empty";
    return `<div class="info-card"><div class="info-label">${label}</div><div class="info-value${cls}">${val}</div></div>`;
  };

  const title = g("Университет") || "Без названия";
  const country = g("Страна") || uni._country_ru;
  const city = g("Город");
  const grantBadge = isFullGrant(uni) ? `<div class="grant-badge">✨ Полный грант</div>` : "";
  const openNew = `<button class="open-new" onclick="openInNewWindow('${String(title).replace(/'/g,"\\'")}')">🔗 Открыть в новом окне</button>`;

  content.innerHTML = `
    <h1 class="uni-title">${title}</h1>
    <div class="uni-location">📍 ${country}${city ? " · " + city : ""}</div>
    ${grantBadge}
    <div>${openNew}</div>

    <h3 class="section-title">Финансы</h3>
    <div class="info-grid">
      ${row("Стоимость обучения", g("Стоимость обучения (USD/год)"))}

      ${row("Финансовая помощь", g("Максимальная Финансовая помощь (USD)"))}

      ${row("TOEFL / IELTS", g("TOEFL/IELTS"))}

      ${row("Эссе", g("Эссе"))}
      ${row("Рекомендательные письма", g("Рекомендательные Письма"))}
      ${row("Стоимость заявки", g("Стоимость Заявки"))}
      ${row("Ссылка на подачу", g("Ссылка на заполнение заявки"))}
    </div>

    <h3 class="section-title">Рейтинги</h3>
    <div class="info-grid">
      ${row("Рейтинг по стране", g("Рейтинг по Стране"))}
      ${row("Рейтинг в мире", g("Рейтинг в Мире"))}
    </div>

    <h3 class="section-title">Профессии</h3>
    <div class="info-grid">
      ${row("Направления", g("Профессии"))}
    </div>

    <h3 class="section-title">Дополнительно</h3>
    <div class="info-grid">
      ${row("Комментарии", g("Дополнительные Комментарии"))}
    </div>

    <div class="action-buttons">
      ${uni["Сайт Университета"] ? `<a href="${uni["Сайт Университета"]}" target="_blank" rel="noopener" class="btn-main primary">🌐 Официальный сайт</a>` : ""}
      ${uni["Ссылка на заполнение заявки"] && String(uni["Ссылка на заполнение заявки"]).startsWith("http") ? `<a href="${uni["Ссылка на заполнение заявки"]}" target="_blank" rel="noopener" class="btn-main secondary">📝 Подать заявку</a>` : ""}
      ${uni["Сайт Финансовой Помощи"] && String(uni["Сайт Финансовой Помощи"]).startsWith("http") ? `<a href="${uni["Сайт Финансовой Помощи"]}" target="_blank" rel="noopener" class="btn-main ghost">💰 Финансовая помощь</a>` : ""}
    </div>
  `;
}

function openInNewWindow(title){
  const url = `universities.html?uni=${encodeURIComponent(title)}`;
  window.open(url, "_blank");
}

document.getElementById("onlyGrant").addEventListener("change", renderSidebar);

const searchBtn = document.getElementById("searchBtn");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

searchBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  searchInput.classList.toggle("open");
  if(searchInput.classList.contains("open")) searchInput.focus();
  else searchResults.classList.remove("open");
});

searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  if(q.length < 2){ searchResults.classList.remove("open"); return; }
  const found = ALL_DATA.filter(u => {
    const name = String(u["Университет"] || "").toLowerCase();
    const city = String(u["Город"] || "").toLowerCase();
    const country = String(u._country_ru || "").toLowerCase();
    return name.includes(q) || city.includes(q) || country.includes(q);
  }).slice(0, 12);
  if(found.length === 0){
    searchResults.innerHTML = `<div class="search-empty">Извините, мы пока работаем над добавлением этого университета</div>`;
  } else {
    searchResults.innerHTML = found.map(u => `
      <button class="search-result" data-name="${String(u["Университет"]).replace(/"/g,"&quot;")}">
        ${u["Университет"]}
        <small>${u._flag} ${u._country_ru} · ${u["Город"] || ""}</small>
      </button>
    `).join("");
  }
  searchResults.classList.add("open");
});

searchResults.addEventListener("click", (e) => {
  const btn = e.target.closest(".search-result");
  if(!btn) return;
  const name = btn.dataset.name;
  const uni = ALL_DATA.find(u => u["Университет"] === name);
  if(uni){
    const itemBtn = [...document.querySelectorAll(".uni-item")].find(el => el.dataset.name === name);
    if(itemBtn){
      itemBtn.closest(".country").classList.add("open");
      selectUni(uni, itemBtn);
      setTimeout(() => itemBtn.scrollIntoView({ behavior: "smooth", block: "center" }), 250);
    } else {
      selectUni(uni, null);
    }
  }
  searchInput.value = "";
  searchResults.classList.remove("open");
  searchInput.classList.remove("open");
});

document.addEventListener("click", () => {
  searchResults.classList.remove("open");
  searchInput.classList.remove("open");
});
searchInput.addEventListener("click", (e) => e.stopPropagation());
searchResults.addEventListener("click", (e) => e.stopPropagation());

loadAll();
</script>
