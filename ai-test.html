<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPath — Тест ИИ</title>
<style>
  body{ font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #F7EFE1; color: #2B1B10; }
  h1{ font-family: Georgia, serif; }
  button{ padding: 14px 28px; font-size: 16px; background: #2B1B10; color: #F7EFE1; border: none; border-radius: 8px; cursor: pointer; }
  button:hover{ background: #5A3B26; }
  button:disabled{ opacity: 0.5; cursor: wait; }
  .box{ background: white; padding: 20px; border-radius: 12px; margin-top: 20px; white-space: pre-wrap; line-height: 1.6; }
  .error{ color: #B84A3A; background: #FDF0EC; }
  .success{ color: #2B6B3F; }
</style>
</head>
<body>
  <h1>Тест ИИ — EduPath</h1>
  <p>Нажмите кнопку — воркер отправит первый запрос в ИИ, и вы увидите ответ.</p>

  <button id="testBtn" onclick="testAI()">Отправить тестовый запрос</button>

  <div id="result" class="box" style="display:none"></div>

<script>
const WORKER_URL = "https://edupath-ai.muqiyatalkar.workers.dev";

async function testAI(){
  const btn = document.getElementById("testBtn");
  const result = document.getElementById("result");
  btn.disabled = true;
  btn.textContent = "ИИ думает...";
  result.style.display = "none";
  result.className = "box";
  result.textContent = "";

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: [
          { role: "user", content: "Привет! Я хочу поступить в университет за рубежом. Задай мне первый вопрос." }
        ]
      })
    });

    if(!res.ok){
      const text = await res.text();
      throw new Error(`HTTP ${res.status}: ${text}`);
    }

    const data = await res.json();
    result.className = "box success";
    result.textContent = "✅ Ответ от ИИ:\n\n" + data.result;
  } catch(e){
    result.className = "box error";
    result.textContent = "❌ Ошибка: " + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Отправить ещё раз";
    result.style.display = "block";
  }
}
</script>
</body>
</html>
