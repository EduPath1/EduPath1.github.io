<!DOCTYPE html>
<html lang="ru">
<head>
<script>/* Внутренние страницы только для вошедших: без входа — на лендинг */try{if(!localStorage.getItem("edupath_token")){location.replace("index.html");}}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPath — Тест на подбор университета</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7EFE1; --cream-deep:#EFE1C6; --paper:#FBF6EC;
    --espresso:#2B1B10; --bark:#5A3B26; --clay:#8C5A34;
    --caramel:#C79256; --sand:#D9BD93;
    --text-main:#2B1B10; --text-muted:#7A6552;
    --line:rgba(43,27,16,0.14);
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Work Sans', sans-serif; background:var(--cream); color:var(--text-main); line-height:1.5; min-height:100vh; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; letter-spacing:-0.01em; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }

  header{ background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:100; }
  nav.wrap{ display:flex; align-items:center; justify-content:space-between; height:84px; max-width:1200px; margin:0 auto; padding:0 32px; position:relative; }
  .logo{ display:flex; align-items:center; gap:12px; font-family:'Fraunces', serif; font-weight:600; font-size:26px; color:var(--espresso); }
  .logo svg{ width:38px; height:38px; flex-shrink:0; }
  .nav-links{ display:flex; align-items:center; gap:8px; }
  .nav-links a{ font-size:15px; color:var(--text-muted); padding:10px 18px; border-radius:8px; transition:background .25s var(--ease), color .25s var(--ease); }
  .nav-links a:hover{ color:var(--espresso); background:var(--cream-deep); }
  .nav-links a.active{ background:var(--espresso); color:var(--paper); }
  .nav-right{ display:flex; align-items:center; gap:14px; }
  .btn-login{ background:var(--clay); color:var(--paper); padding:10px 22px; border-radius:20px; font-size:14px; font-weight:500; }
  .icon-btn{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); border-radius:50%; }

  .lang-dropdown{ position:relative; }
  .lang-menu{ position:absolute; top:calc(100% + 10px); right:0; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:6px; min-width:150px; box-shadow:0 16px 32px -14px rgba(43,27,16,0.3); opacity:0; visibility:hidden; transform:translateY(-6px); transition:opacity .15s, transform .15s, visibility .15s; z-index:30; }
  .lang-menu.open{ opacity:1; visibility:visible; transform:translateY(0); }
  .lang-option{ display:block; width:100%; text-align:left; background:none; padding:10px 12px; font-size:14px; color:var(--text-muted); border-radius:8px; }
  .lang-option:hover{ background:var(--cream-deep); color:var(--espresso); }
  .lang-option.active{ background:var(--cream-deep); color:var(--espresso); font-weight:600; }

  main{ max-width:900px; margin:0 auto; padding:64px 32px 96px; }
  .screen{ display:none; animation:fadeInUp .5s var(--ease) forwards; }
  .screen.active{ display:block; }

  .intro{ text-align:center; padding:32px 0; }
  .intro .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:14px; color:var(--clay); font-weight:600; margin-bottom:24px; }
  .intro .eyebrow::before{ content:""; width:22px; height:1.5px; background:var(--clay); display:inline-block; }
  .intro .eyebrow::after{ content:""; width:22px; height:1.5px; background:var(--clay); display:inline-block; }
  .intro h1{ font-size:48px; line-height:1.1; margin-bottom:24px; color:var(--espresso); }
  .intro h1 em{ font-style:italic; color:var(--clay); }
  .intro p{ font-size:17px; color:var(--text-muted); max-width:560px; margin:0 auto 20px; line-height:1.7; }
  .intro .note{ font-size:14px; color:var(--text-muted); margin-bottom:36px; }
  .intro .btn-start{ display:inline-flex; align-items:center; gap:12px; background:var(--espresso); color:var(--paper); padding:18px 34px; border-radius:10px; font-size:15px; font-weight:500; box-shadow:0 10px 24px -10px rgba(43,27,16,0.45); transition:background .25s var(--ease), transform .25s var(--ease); }
  .intro .btn-start:hover{ background:var(--bark); transform:translateY(-2px); }
  .intro .btn-start svg{ width:16px; height:16px; }

  .btn-ghost{ display:inline-flex; align-items:center; gap:10px; margin-left:10px; padding:17px 26px; border-radius:10px; font-size:15px; font-weight:500; color:var(--clay); border:1.5px solid var(--sand); background:transparent; }
  .btn-ghost:hover{ background:var(--cream-deep); }
  .intro-actions{ display:flex; justify-content:center; flex-wrap:wrap; gap:10px; }

  .dialog-wrap{ background:var(--paper); border:1px solid var(--line); border-radius:24px; padding:40px 44px 34px; box-shadow:0 20px 48px -28px rgba(43,27,16,0.25); }
  .dialog-progress{ display:flex; align-items:center; gap:16px; font-size:13px; color:var(--text-muted); margin-bottom:28px; }
  .progress-track{ flex:1; height:6px; background:var(--cream-deep); border-radius:99px; overflow:hidden; }
  .progress-bar{ height:100%; width:0; background:linear-gradient(90deg, var(--caramel), var(--clay)); border-radius:99px; transition:width .4s var(--ease); }
  .question-label{ font-size:12px; font-weight:600; color:var(--clay); text-transform:uppercase; letter-spacing:.08em; margin-bottom:12px; }
  .opt-tag{ color:var(--text-muted); text-transform:none; letter-spacing:0; font-weight:500; }
  .question-text{ font-size:27px; font-weight:500; line-height:1.3; color:var(--espresso); margin-bottom:10px; }
  .question-hint{ font-size:14px; color:var(--text-muted); margin-bottom:22px; }
  .question-text + .opts, .question-text + .text-input, .question-text + select{ margin-top:22px; }
  .opts{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
  .opts-small{ grid-template-columns:repeat(3, minmax(0,1fr)); }
  .opt{ text-align:left; padding:14px 16px; border-radius:12px; border:1.5px solid var(--line); background:var(--cream); color:var(--text-main); font-size:15px; line-height:1.35; transition:border-color .2s var(--ease), background .2s var(--ease), transform .2s var(--ease); }
  .opt:hover{ border-color:var(--sand); background:var(--paper); }
  .opt.selected{ border-color:var(--clay); background:#F3E3CC; color:var(--espresso); font-weight:600; box-shadow:inset 0 0 0 1px var(--clay); }
  .sub-q{ font-size:14px; font-weight:600; color:var(--bark); margin:18px 0 10px; }
  .text-input{ width:100%; padding:14px 16px; font-family:inherit; font-size:15px; color:var(--text-main); background:var(--cream); border:1.5px solid var(--line); border-radius:12px; transition:border-color .2s var(--ease), background .2s var(--ease); }
  .text-input:focus{ outline:none; border-color:var(--clay); background:var(--paper); }
  .text-area{ resize:vertical; min-height:110px; }
  .select-input{ appearance:auto; }
  .other-wrap{ display:block; margin-top:16px; }
  .other-label{ display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:6px; }
  .score-list{ margin-top:14px; display:grid; gap:10px; }
  .score-row{ display:grid; grid-template-columns:minmax(120px, 34%) 1fr; align-items:center; gap:12px; margin-top:12px; font-size:14px; color:var(--bark); font-weight:600; }
  .score-list .score-row{ margin-top:0; }
  .form-error{ min-height:22px; margin-top:12px; font-size:14px; color:#a53f35; }
  .dialog-actions{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:12px; }
  .btn-send{ display:inline-flex; align-items:center; gap:10px; background:var(--espresso); color:var(--paper); padding:14px 26px; border-radius:10px; font-size:15px; font-weight:500; transition:background .25s var(--ease), transform .25s var(--ease); }
  .btn-send:hover{ background:var(--bark); transform:translateY(-1px); }
  .btn-send svg{ width:16px; height:16px; }
  .btn-back{ padding:14px 20px; border-radius:10px; font-size:15px; color:var(--text-muted); border:1.5px solid var(--line); }
  .btn-back:hover{ background:var(--cream-deep); color:var(--espresso); }

  .loading-wrap{ text-align:center; }
  .loading-wrap h2{ font-size:30px; margin-bottom:24px; color:var(--espresso); }
  .loading-steps{ list-style:none; display:inline-flex; flex-direction:column; gap:12px; text-align:left; margin-bottom:22px; }
  .loading-steps li{ font-size:15px; color:var(--text-muted); padding-left:28px; position:relative; }
  .loading-steps li::before{ content:""; position:absolute; left:4px; top:6px; width:10px; height:10px; border-radius:50%; background:var(--cream-deep); }
  .loading-steps li.done{ color:var(--bark); }
  .loading-steps li.done::before{ background:var(--clay); }
  .loading-steps li.current{ color:var(--espresso); font-weight:600; }
  .loading-steps li.current::before{ background:var(--caramel); animation:thinkingPulse 1.4s ease-in-out infinite; }
  .loading-note{ font-size:13px; color:var(--text-muted); }
  .load-error{ font-size:16px; color:#a53f35; margin:10px 0 20px; }
  .load-actions{ display:flex; justify-content:center; flex-wrap:wrap; gap:10px; }
  @keyframes thinkingPulse{ 0%,80%,100%{ opacity:.35; transform:scale(.8);} 40%{ opacity:1; transform:scale(1.15);} }

  .save-banner{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:linear-gradient(135deg, var(--caramel) 0%, var(--clay) 100%); color:var(--paper); padding:18px 24px; border-radius:16px; margin-bottom:30px; box-shadow:0 12px 28px -16px rgba(140,90,52,0.6); }
  .save-banner-icon{ flex-shrink:0; width:40px; height:40px; display:flex; align-items:center; justify-content:center; background:rgba(251,246,236,0.2); border-radius:50%; font-size:20px; }
  .save-banner-text{ flex:1; min-width:200px; }
  .save-banner-title{ font-weight:600; font-size:16px; }
  .save-banner-desc{ font-size:13px; opacity:.9; word-break:break-word; }
  .save-banner-btn{ display:inline-flex; align-items:center; background:var(--paper); color:var(--clay); padding:10px 18px; border-radius:10px; font-size:14px; font-weight:600; }

  main.final-wide{ max-width:1200px; }
  .final-header{ text-align:center; margin-bottom:30px; }
  .final-header h2{ font-size:38px; margin-bottom:12px; color:var(--espresso); }
  .final-header h2 em{ font-style:italic; color:var(--clay); }
  .final-header p{ font-size:16px; color:var(--text-muted); }
  .category{ margin-bottom:26px; background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:26px; opacity:0; animation:fadeInUp .6s var(--ease) forwards; }
  .category-title{ font-family:'Fraunces', serif; font-size:22px; font-weight:600; color:var(--espresso); margin-bottom:4px; }
  .category-sub{ font-size:14px; color:var(--text-muted); margin-bottom:18px; }
  .cards-track{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:13px; }
  .uni-card{ min-height:200px; background:var(--cream); border:1px solid var(--line); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:9px; cursor:pointer; transition:transform .2s, box-shadow .2s, border-color .2s; }
  .uni-card:hover, .uni-card:focus-visible{ transform:translateY(-3px); box-shadow:0 16px 42px rgba(43,27,16,.09); border-color:var(--caramel); outline:none; }
  .card-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .country-pill{ font-size:11px; color:var(--text-muted); background:var(--paper); padding:5px 9px; border-radius:999px; }
  .deadline-dot{ width:9px; height:9px; border-radius:50%; background:#a9a09a; flex:none; }
  .deadline-dot.red{ background:#c94c43; } .deadline-dot.yellow{ background:#d6a22d; } .deadline-dot.green{ background:#4c9667; }
  .uni-card h3{ font-size:19px; line-height:1.18; color:var(--espresso); }
  .card-location{ font-size:12px; color:var(--text-muted); }
  .card-facts{ display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; margin:0; }
  .card-facts dt{ font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; }
  .card-facts dd{ font-size:12px; color:var(--espresso); margin:0; }
  .card-facts dd.none{ color:var(--text-muted); }
  .facts-later{ font-size:12px; color:var(--text-muted); font-style:italic; }
  .card-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11px; color:var(--text-muted); margin-top:auto; }
  .result-link{ color:var(--clay); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .result-link:hover{ text-decoration:underline; }
  .dossier{ color:var(--clay); font-weight:600; white-space:nowrap; }
  .empty-note{ padding:18px; background:var(--cream); border-radius:10px; font-size:14px; color:var(--text-muted); text-align:center; font-style:italic; }
  .cv-note{ background:var(--paper); border:1px solid var(--sand); border-left:4px solid var(--clay); border-radius:16px; padding:22px 26px; margin-top:8px; font-size:15px; line-height:1.7; color:var(--text-main); }
  .cv-note .disclaimer{ margin-top:10px; font-size:13px; color:var(--text-muted); font-style:italic; }
  .final-actions{ text-align:center; margin-top:36px; }
  .remaining-note{ font-size:13px; color:var(--text-muted); margin-bottom:14px; }
  .btn-restart{ display:inline-flex; align-items:center; gap:10px; background:var(--clay); color:var(--paper); padding:15px 30px; border-radius:10px; font-size:15px; font-weight:500; }
  .btn-restart:hover{ background:var(--bark); }

  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:translateY(0);} }

  @media (max-width:1000px){ .cards-track{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  @media (max-width:900px){ .nav-links{ display:none !important; } }
  @media (max-width:700px){
    nav.wrap{ height:72px; padding:0 18px; }
    .logo{ font-size:21px; gap:9px; } .logo svg{ width:30px; height:30px; }
    main{ padding:28px 16px 64px; }
    .intro h1{ font-size:32px; } .intro p{ font-size:15px; }
    .btn-ghost{ margin-left:0; }
    .dialog-wrap{ padding:24px 18px; border-radius:18px; }
    .question-text{ font-size:21px; }
    .opts, .opts-small{ grid-template-columns:1fr; }
    .opts-small{ grid-template-columns:1fr 1fr; }
    .score-row{ grid-template-columns:1fr; gap:6px; }
    .final-header h2{ font-size:28px; }
    .category{ padding:18px; }
    .cards-track{ grid-template-columns:1fr; }
    .save-banner{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="#5A3B26" stroke-width="2"/>
        <path d="M27 13 L18 18 L13 27 L22 22 Z" fill="#C79256"/>
        <circle cx="20" cy="20" r="2.4" fill="#2B1B10"/>
      </svg>
      EduPath
    </a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav_home">Главная</a>
      <a href="universities.html" data-i18n="nav_universities">Университеты</a>
      <a href="profile.html" data-i18n="nav_profile">Профиль</a>
      <a href="fanzone.html" data-i18n="nav_fanzone">🤡 Fun Zone</a>
      <a href="team.html" data-i18n="nav_team">О нашей команде</a>
    </div>
    <div class="nav-right">
      <div class="lang-dropdown">
        <button type="button" class="icon-btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Сменить язык">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="19" height="19"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.7 4 6 4 9.5s-1.4 6.8-4 9.5c-2.6-2.7-4-6-4-9.5s1.4-6.8 4-9.5z"/></svg>
        </button>
        <div class="lang-menu" id="langMenu" role="menu">
          <button type="button" class="lang-option active" data-lang="ru" role="menuitem">Русский</button>
          <button type="button" class="lang-option" data-lang="en" role="menuitem">English</button>
          <button type="button" class="lang-option" data-lang="zh" role="menuitem">中文</button>
          <button type="button" class="lang-option" data-lang="kk" role="menuitem">Қазақша</button>
          <button type="button" class="lang-option" data-lang="ky" role="menuitem">Кыргызча</button>
        </div>
      </div>
    </div>
  </nav>
</header>

<main id="main">

  <section class="screen active" id="screenIntro">
    <div class="intro">
      <div class="eyebrow" id="introEyebrow">Тест на подбор университета</div>
      <h1 id="introTitle">Найдём университеты <em>под тебя</em></h1>
      <p id="introSub"></p>
      <p class="note" id="introNote"></p>
      <div class="intro-actions" id="introActions"></div>
    </div>
  </section>

  <section class="screen" id="screenQuiz">
    <div class="dialog-wrap">
      <div class="dialog-progress">
        <span id="progressText"></span>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      </div>
      <div id="questionBox"></div>
    </div>
  </section>

  <section class="screen" id="screenLoading">
    <div class="dialog-wrap loading-wrap">
      <h2 id="loadingTitle"></h2>
      <ul class="loading-steps" id="loadingSteps"></ul>
      <p class="loading-note" id="loadingNote"></p>
      <div id="loadingError"></div>
    </div>
  </section>

  <section class="screen" id="screenFinal">
    <div id="saveBanner"></div>
    <div class="final-header">
      <h2 id="finalTitle"></h2>
      <p id="finalSub"></p>
    </div>
    <div id="categoriesContainer"></div>
    <div class="cv-note" id="cvNote"></div>
    <div class="final-actions">
      <p class="remaining-note" id="remainingNote"></p>
      <button type="button" class="btn-restart" id="restartBtn" data-act="restart"></button>
    </div>
  </section>

</main>

<script src="i18n.js"></script>
<script src="auth.js"></script>
<script src="test-texts.js"></script>
<script src="test-quiz.js"></script>
</body>
</html>
